<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghi số nước R9</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#msg{padding:24px;font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div id="msg">Đang mở giao diện R9 trực tiếp…</div>
<script>
(async function(){
  const stamp=Date.now();
  const CAPTURE_PASS='879-final10-postcapture-r4';
  try{
    const res=await fetch('./v87-background.html?r9direct='+stamp,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    let html=await res.text();

    // Gỡ các lớp capture/UI cũ nếu có để gán lại đúng chuỗi PASS.
    html=html.replace(/<script[^>]+src=["']\.\/water-ui[123]\.js[^"']*["'][^>]*><\/script>\s*/gi,'');
    html=html.replace(/<script[^>]+src=["']\.\/water-shot-guide[^"']*\.js[^"']*["'][^>]*><\/script>\s*/gi,'');
    html=html.replace(/<script[^>]+src=["']\.\/water-camera-fast-final6\.js[^"']*["'][^>]*><\/script>\s*/gi,'');
    html=html.replace(/<script[^>]+src=["']\.\/water-final-core-(?:pre|post)\.js[^"']*["'][^>]*><\/script>\s*/gi,'');
    html=html.replace(/<script[^>]+src=["']\.\/water-shot-style-r7\.js[^"']*["'][^>]*><\/script>\s*/gi,'');
    html=html.replace(/<script[^>]+src=["']\.\/water-project-bar-r8[abc]?\.js[^"']*["'][^>]*><\/script>\s*/gi,'');
    html=html.replace(/<script[^>]+src=["']\.\/water-manage-(?:export|data)[^"']*\.js[^"']*["'][^>]*><\/script>\s*/gi,'');

    // Khôi phục đúng phần trình bày cơ sở của mốc FINAL10 R4 PASS.
    const progressHtml='  <div id="progressBar" role="status" aria-live="polite">Tổng: <b id="progressTotal">----</b> · Đã chụp: <b id="progressDone">----</b> · Chưa chụp: <b id="progressLeft">----</b> · Kỳ ghi: <b id="progressPeriod">--/----</b></div>';
    if(!html.includes('id="progressBar"')){
      html=html.replace('  </div>\n\n  <div class="camera">','  </div>\n\n'+progressHtml+'\n\n  <div class="camera">');
    }

    if(!html.includes('#progressBar{')){
      html=html.replace('canvas,iframe{display:none}\n</style>','canvas,iframe{display:none}\n#progressBar{background:#fff;padding:8px 3px;border-bottom:1px solid #ddd;text-align:center;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap;letter-spacing:-.35px;overflow:hidden}\n#progressBar b{font-variant-numeric:tabular-nums}\n#syncStatus{margin-top:7px;border:1px solid #ddd;border-radius:10px;background:#f7f7f7;font-weight:700;text-align:center}\n#debug{padding:3px 5px}\n#appFooter{margin-top:5px;padding-top:5px;border-top:1px solid #eee;font-size:11px;color:#666;text-align:center}\n</style>');
    }

    html=html.replace('<div id="statusMain">GHI SỐ NƯỚC V8.7.8</div>\n      <div id="statusSub">Không cần quét QR riêng. Chụp 1 ảnh có cả đồng hồ + QR.</div>','<div id="statusMain">SẴN SÀNG CHỤP</div>\n      <div id="statusSub">Đưa mặt đồng hồ + QR hiện rõ trong khung ảnh.</div>');
    html=html.replace(/\s*<div[^>]*>\s*V8\.7\.8\s*·[^<]*<\/div>/i,'');

    if(!html.includes('id="appFooter"')){
      html=html.replace('<div id="debug">Trạng thái camera và nhân sự</div>\n  </div>','<div id="debug">Trạng thái camera và nhân sự</div>\n    <div id="appFooter">Designed by Mr.Hoa - Hotline: 0915176386</div>\n  </div>');
    }

    // CHỤP SỐ: gán đúng chuỗi đã PASS, theo thứ tự bắt buộc.
    const capturePass=[
      './water-final-core-pre.js?capturepass='+CAPTURE_PASS+'&v='+stamp,
      './water-ui3.js?capturepass='+CAPTURE_PASS+'&v='+stamp,
      './water-final-core-post.js?capturepass='+CAPTURE_PASS+'&v='+stamp,
      './water-camera-fast-final6.js?capturepass='+CAPTURE_PASS+'&v='+stamp,
      './water-shot-guide-final10-postcapture-r4.js?capturepass='+CAPTURE_PASS+'&v='+stamp
    ];

    // Các module sau chỉ bổ sung header/progress và 3 tab; không thay lõi Chụp số.
    const addons=[
      './water-staff-header-nameonly-r5.js?r9direct='+stamp,
      './water-progress-live-r6.js?r9direct='+stamp,
      './water-top-tabs-r9.js?r9direct='+stamp,
      './water-project-tab-r91.js?r9direct='+stamp,
      './water-project-sheet-r93.js?r9direct='+stamp,
      './water-manage-layout-r96.js?r9direct='+stamp,
      './water-manage-data-r117.js?r9direct='+stamp,
      // Chỉ dùng 1 module export. Không nạp bản compact cũ vì sẽ ghi đè nguồn TAI_CHI_SO_THANG.
      './water-default-capture-r92.js?r9direct='+stamp
    ];

    const scripts=capturePass.concat(addons)
      .map(src=>'<script src="'+src+'"></'+'script>')
      .join('\n');

    html=html.replace('</body>',scripts+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('msg').textContent='Không mở được R9 trực tiếp: '+String(err&&err.message||err);
  }
})();
</script>
</body>
</html>
