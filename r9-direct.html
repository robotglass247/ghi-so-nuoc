        '<':'&lt;',
        '>':'&gt;',

  function periodScore(v){

  function jsonp(query){
    return new Promise(function(resolve,reject){
      const cb='__waterTaiChiSo_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const script=document.createElement('script');
      let done=false;

      const timer=setTimeout(function(){
        finish(new Error('Hết thời gian đọc TAI_CHI_SO_THANG.'));
      },20000);

      function finish(err,data){
        if(done)return;
        done=true;
        clearTimeout(timer);

        try{ delete window[cb]; }
        catch(e){ window[cb]=undefined; }

        if(script.parentNode){
          script.parentNode.removeChild(script);
        }

        err ? reject(err) : resolve(data);
      }

      window[cb]=function(data){
        finish(null,data);
      };

      script.onerror=function(){
        finish(new Error('Không đọc được sheet TAI_CHI_SO_THANG.'));
      };

      script.src=
        'https://docs.google.com/spreadsheets/d/'

  function setMonths(list){
    const select=el('waterExportMonthR118');
    if(!select)return;

    list=(list||[])
      .map(txt)
      .filter(function(v){
        return /^\d{1,2}\/\d{4}$/.test(v);
      })
      .filter(function(v,i,a){
        return a.indexOf(v)===i;
      })
      .sort(function(a,b){
        return periodScore(b)-periodScore(a);
      });

    select.innerHTML='';

    if(!list.length){
      const o=document.createElement('option');
      o.value='';
      o.textContent='Chọn Tháng: Chưa có dữ liệu';
      select.appendChild(o);
      setDisabled(true);
      return [];
    }

    list.forEach(function(v){
      const o=document.createElement('option');
      o.value=v;
      o.textContent='Chọn Tháng: '+v;
      select.appendChild(o);
    });

    setDisabled(false);

    try{
      localStorage.setItem(MONTH_CACHE,JSON.stringify(list));
    }catch(e){}

    return list;

  async function loadMonths(){

    loading=true;

    const select=el('waterExportMonthR118');

      let cached=[];

      try{

      }catch(_e){}

      const list=setMonths(cached);

      if(list.length){

    }finally{

        select.disabled=false;
      }
    }
  }

  function loadXlsx(){
    if(window.XLSX){
      return Promise.resolve(window.XLSX);
    }

    return new Promise(function(resolve,reject){
      const urls=[
        'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
        'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
      ];

      let i=0;

      function next(){
        if(window.XLSX){
          resolve(window.XLSX);
          return;
        }

        if(i>=urls.length){
          reject(new Error('Không tải được thư viện Excel.'));
          return;
        }

        const s=document.createElement('script');
        s.src=urls[i++];
        s.async=true;

        s.onload=function(){
          if(window.XLSX){
            resolve(window.XLSX);
          }else{
            next();
          }
        };

        s.onerror=next;
        document.head.appendChild(s);
      }

      next();
    });
  }

  function buildRealXls(period,rows,XLSX){
    const aoa=[
      ['CHI SỐ NƯỚC THÁNG '+period,'','','','','','',''],
      ['','','','','','','',''],
      [
        'TT',
        'Tòa',
        'Tầng',
        'Căn hộ',
        'Mã đồng hồ',
        'Chỉ số kỳ trước',
        'Chỉ số kỳ này',
        'Tiêu thụ m³'
      ]
    ];

    rows.forEach(function(r,index){
      const vals=[];
      for(let i=0;i<7;i++){
        vals.push(txt(cell(r,i)));
      }

      aoa.push([
        String(index+1),
        vals[0],
        vals[1],
        vals[2],
        vals[3],
        vals[4],
        vals[5],
        vals[6]
      ]);
    });

    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!ref']='A1:H'+aoa.length;

    ws['!merges']=[
      {
        s:{r:0,c:0},
        e:{r:0,c:7}
      }
    ];

    ws['!cols']=[
      {wch:7},
      {wch:12},
      {wch:10},
      {wch:14},
      {wch:18},
      {wch:17},
      {wch:17},
      {wch:14}
    ];

    ws['!rows']=[
      {hpt:24},
      {hpt:18},
      {hpt:30}
    ];

    // Giữ TT/Tòa/Tầng/Căn hộ/Mã đồng hồ dạng text để không mất số 0 đầu.
    for(let r=3;r<aoa.length;r++){
      for(let c=0;c<=4;c++){
        const addr=XLSX.utils.encode_cell({r:r,c:c});
        if(ws[addr]){
          ws[addr].t='s';
          ws[addr].v=String(ws[addr].v==null?'':ws[addr].v);
          ws[addr].z='@';
        }
      }
    }

    if(aoa.length>=4){
      ws['!autofilter']={
        ref:'A3:H'+aoa.length
      };
    }

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(
      wb,
      ws,
      ('CHI_SO_'+period.replace('/','_')).slice(0,31)
    );

    return wb;
  }

    if(!period){

      );

    const old=link?link.textContent:'Tải File';

      link.textContent='Đang tạo...';
    }

    status(
      'Đang lấy '+period+' từ TAI_CHI_SO_THANG...',
      ''
    );

    try{
      /*
        B:H = 7 cột dữ liệu xuất file (không xuất cột ảnh).
        J = Kỳ dùng để lọc.
        KHÔNG tham chiếu bất kỳ Sheet hàng đợi nào.

      const q=
        \"select B,C,D,E,F,G,H where J = '\" 
        +period.replace(/'/g,\"''\")
        +\"'\";

      const data=await jsonp(q);

      const rows=
        data &&
        data.table &&
        Array.isArray(data.table.rows)
          ? data.table.rows
          : [];

      if(!rows.length){
        throw new Error(
          'TAI_CHI_SO_THANG không có dữ liệu kỳ '+period+'.'
        );
      }

      const XLSX=await loadXlsx();
      const wb=buildRealXls(period,rows,XLSX);

      const ws=wb.Sheets[wb.SheetNames[0]];
      const range=XLSX.utils.decode_range(ws['!ref']||'A1:A1');
      if(range.e.c!==7){
        throw new Error('Khóa xuất R11.8 phát hiện file không đúng 8 cột.');
      }
      for(let rr=0;rr<=range.e.r;rr++){
        const addr='I'+(rr+1);
        if(ws[addr]){
          throw new Error('Khóa xuất R11.8 phát hiện cột I/Ảnh.');
        }
      }

      const fileName=
        'R118_KHONG_ANH_'
        +safeName(period.replace('/','-'))
        +'.xlsx';

      const bytes=XLSX.write(
        wb,
        {
          bookType:'xlsx',
          type:'array',
          compression:true
        }
      );

      const blob=new Blob(
        [bytes],
        {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
      );
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=fileName;
      a.style.display='none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        URL.revokeObjectURL(url);
        if(a.parentNode)a.parentNode.removeChild(a);
      },1500);

      status(
        'R11.8 • Đã tải '+fileName+' • 8 cột • Không ảnh.',
        'ok'
      );

    }catch(e){
      /*
        CỐ Ý KHÔNG FALLBACK.
        Nếu TAI_CHI_SO_THANG lỗi thì dừng tại đây.
      */
      status(
        txt(e&&e.message)||
        'Không tải được dữ liệu từ TAI_CHI_SO_THANG.',
        'err'
      );

    }finally{
      if(link){
        link.textContent=old||'Tải File';
      }

      setDisabled(false);
    }
  }

  function keepMounted(){
    /*
      Nếu module layout khác dựng lại Tab QUẢN LÝ,
      module này sẽ dựng lại card tải mới.
    */
    if(!isCorrectMounted()){
      mount();
    }
  }

  function start(){
    if(mount())return;

    let tries=0;

    const timer=setInterval(function(){
      tries++;

      if(mount() || tries>40){
        clearInterval(timer);
      }
    },200);
  }

  if(window.MutationObserver){
    const obs=new MutationObserver(function(){
      keepMounted();
    });

    obs.observe(
      document.documentElement,
      {
        childList:true,
        subtree:true
      }
    );
  }

  if(document.readyState==='loading'){
    document.addEventListener(
      'DOMContentLoaded',
      start,
      {once:true}
    );
  }else{
    start();
  }

  window.WATER_MANAGE_EXPORT_BUILD=BUILD;
  window.WATER_MANAGE_EXPORT_SOURCE=DATA_SHEET;
})();
";

    const scripts=capturePass.concat(addons)
      .map(src=>'<script src="'+src+'"></'+'script>')
      .join('\n')
      +'\n<script>'+manageR118Code+'</'+'script>';

    html=html.replace('</body>',scripts+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('msg').textContent='Không mở được R11.8 trực tiếp: '+String(err&&err.message||err);
  }
})();
