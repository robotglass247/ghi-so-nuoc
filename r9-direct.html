    html=html.replace('</body>',scripts+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('msg').textContent='Không mở được R11.10 trực tiếp: '+String(err&&err.message||err);
  }
})();
</script>
