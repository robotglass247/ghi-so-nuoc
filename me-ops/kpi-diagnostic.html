<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&E OPS KPI Diagnostic</title><style>body{font-family:Arial,sans-serif;background:#eef4fb;color:#15345d;margin:0;padding:18px}.card{max-width:980px;margin:auto;background:#fff;border:1px solid #dbe7f5;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.box{border:1px solid #dbe7f5;border-radius:12px;padding:12px}.v{font-size:28px;font-weight:800}.ok{color:#128a4a}.warn{color:#b54708}.err{color:#b42318}.muted{color:#70839a}.log{white-space:pre-wrap;background:#0e2d4b;color:#fff;padding:12px;border-radius:10px;font-family:monospace;font-size:12px;margin-top:14px;max-height:360px;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="card"><h2>M&E OPS · KIỂM TRA KPI</h2><div id="status" class="muted">Đang đọc dữ liệu trực tiếp...</div><div id="summary" class="grid" style="margin-top:14px"></div><div id="compare" style="margin-top:16px"></div><div id="log" class="log"></div></div><iframe id="f" name="meopsDiagFrame" style="display:none"></iframe><script>const BACKEND='https://script.google.com/macros/s/AKfycbzKYMiU5uAJGjihZ6cOTe-0JUkAvce1WEZjmOWI7j9KhNfnYIPlEjJAv5cgh-ThOTFt/exec';let pending=null,q=[];function lg(s){log.textContent+=new Date().toLocaleTimeString()+'  '+s+'\n'}window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='MEOPS_RPC_RESULT'||!pending||String(d.requestId)!==pending.id)return;clearTimeout(pending.t);const p=pending;pending=null;d.ok?p.res(d.data):p.rej(new Error(d.error||'Backend error'));pump()});function rpc(action,args){return new Promise((res,rej)=>{q.push({action,args:args||[],res,rej});pump()})}function pump(){if(pending||!q.length)return;const x=q.shift(),id='kpi_'+Date.now()+'_'+Math.random().toString(36).slice(2),form=document.createElement('form');form.method='POST';form.action=BACKEND;form.target='meopsDiagFrame';form.style.display='none';for(const [k,v] of Object.entries({api:'meopsrpc',requestId:id,action:x.action,args:JSON.stringify(x.args)})){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)}document.body.appendChild(form);const t=setTimeout(()=>{if(pending&&pending.id===id){pending=null;x.rej(new Error('TIMEOUT'));pump()}},90000);pending={id,res:x.res,rej:x.rej,t};lg('POST '+x.action);form.submit();setTimeout(()=>form.remove(),60000)}function pd(s){const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}function done(status,pct){const s=String(status||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').trim();return Number(pct||0)>=100||s==='hoan thanh'||s==='da hoan thanh'}function box(t,v,n,c=''){return `<div class="box"><div class="muted">${t}</div><div class="v ${c}">${v}</div><div class="muted">${n||''}</div></div>`}async function run(){try{const dash=await rpc('getDashboardData',[true]);const yr=new Date().getFullYear();const plan=await rpc('getMaintenancePlanData',['year',yr]);let init=null;try{init=await rpc('getMaintenanceInitialData',[])}catch(e){lg('getMaintenanceInitialData lỗi: '+e.message)}const rows=plan&&plan.rows||[];const backendDate=pd(dash.meta&&dash.meta.date)||new Date();const y=backendDate.getFullYear(),m=backendDate.getMonth();let todayRows=0,monthRows=0,prevMonthRows=0,overduePlan=0;for(const r of rows){const d=pd(r.date);if(!d)continue;if(d.getFullYear()===y&&d.getMonth()===m&&d.getDate()===backendDate.getDate())todayRows++;if(d.getFullYear()===y&&d.getMonth()===m)monthRows++;const pm=new Date(y,m-1,1);if(d.getFullYear()===pm.getFullYear()&&d.getMonth()===pm.getMonth())prevMonthRows++;if(d<new Date(y,m,backendDate.getDate())&&!done(r.status,r.percent))overduePlan++}const progressMap=new Map();if(init&&Array.isArray(init.tasks)){for(const t of init.tasks)progressMap.set(String(t.id||''),Number(t.progress||0))}let completedInResultsNotPlan=0,correctedOverdue=0,correctedMonthDone=0;for(const r of rows){const d=pd(r.date);if(!d)continue;const rp=progressMap.get(String(r.id||''));const eff=Math.max(Number(r.percent||0),Number.isFinite(rp)?rp:0);const isDone=done(r.status,eff);if(Number.isFinite(rp)&&rp>=100&&!done(r.status,r.percent))completedInResultsNotPlan++;if(d<new Date(y,m,backendDate.getDate())&&!isDone)correctedOverdue++;if(d.getFullYear()===y&&d.getMonth()===m&&isDone)correctedMonthDone++}const correctedPct=monthRows?Math.round(correctedMonthDone*100/monthRows):0;summary.innerHTML=box('Ngày backend',dash.meta&&dash.meta.date||'—','')+box('Công việc hôm nay',dash.kpi.todayTotal,'Dashboard')+box('Quá hạn',dash.kpi.overdue,'Dashboard','warn')+box('KPI tháng',dash.kpi.monthPercent+'%','Dashboard')+box('Kế hoạch tháng hiện tại',monthRows,'Từ kế hoạch năm')+box('Kế hoạch tháng trước',prevMonthRows,'Từ kế hoạch năm');compare.innerHTML=`<h3>Đối chiếu</h3><p>Ngày backend: <b>${dash.meta&&dash.meta.date||'—'}</b>. Kế hoạch đúng ngày này trong dữ liệu năm: <b>${todayRows}</b>.</p><p>Quá hạn tính trực tiếp từ kế hoạch: <b>${overduePlan}</b>. Sau khi ghép tiến độ thực tế từ Nhập kết quả (nếu có): <b>${correctedOverdue}</b>.</p><p>Số ID có tiến độ thực tế ≥100% nhưng dòng kế hoạch chưa được nhận là hoàn thành: <b>${completedInResultsNotPlan}</b>.</p><p>KPI tháng sau ghép tiến độ thực tế: <b>${correctedPct}%</b> (${correctedMonthDone}/${monthRows}).</p>`;status.className='ok';status.textContent='Đã kiểm tra xong. Chụp màn hình phần này gửi lại để sửa đúng công thức.';lg('dashboard='+JSON.stringify(dash.kpi));lg('plan rows='+rows.length+' month='+monthRows+' prevMonth='+prevMonthRows);lg('initial tasks='+(init&&init.tasks?init.tasks.length:'N/A'))}catch(e){status.className='err';status.textContent='LỖI: '+e.message;lg('ERROR '+e.message)}}run()</script></body></html>
