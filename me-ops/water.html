<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>M&E OPS WATER SPEED</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef4fb;color:#15345d}
    .boot{min-height:100dvh;display:grid;place-items:center;padding:24px}
    .card{background:#fff;border:1px solid #dbe7f5;border-radius:18px;padding:24px;box-shadow:0 12px 32px rgba(20,60,110,.10);text-align:center}
  </style>
</head>
<body>
  <div class="boot"><div class="card"><b>M&E OPS</b><div style="margin-top:10px">Đang mở hệ thống…</div></div></div>
  <script>
  (async function(){
    try{
      // Version mới nhưng cho phép trình duyệt cache index để lần mở sau nhanh hơn.
      const r=await fetch('./index.html?water-source=speed2',{cache:'force-cache'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      let html=await r.text();
      html=html.replace('./adapter-v4.js?v=4','./adapter-v4.js?v=water-speed-2');
      html=html.replace('resultAppUrl = cfg.webAppUrl || \'\';','resultAppUrl = location.href.split(\'?\')[0];');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.body.innerHTML='<div class="boot"><div class="card"><b>Không mở được M&E OPS</b><div style="margin-top:10px;color:#b42318">'+String(err&&err.message?err.message:err)+'</div></div></div>';
    }
  })();
  </script>
</body>
</html>
