name: Promote tested staff 904 to main app
on:
  push:
    paths:
      - '.github/workflows/promote-tested-staff904-main.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply tested staff updates only
        run: python3 .github/scripts/promote_staff904.py
      - name: Verify production staff promotion
        run: |
          grep -q "879-main904" v87-background.html
          grep -q "water_staff_list_main904_v1" v87-background.html
          grep -q "staffRemoteUpdatedAt" v87-background.html
          grep -q "credentialless" v87-background.html
          grep -q "localStorage.removeItem('water_staff')" v87-background.html
          grep -q "white-space:nowrap" v87-background.html
          grep -q "titleWidth" v87-background.html
          grep -q "120000" v87-background.html
          grep -q "indexedDB.open('water_meter_v6'" v87-background.html
          if grep -q "water_v9current_ERP_MAIN_meter_v6" v87-background.html; then exit 1; fi
      - name: Commit production staff promotion
        run: |
          git config user.name 'robotglass247'
          git config user.email 'robotglass247@gmail.com'
          git add v87-background.html
          git commit -m 'Promote tested live staff updates to production source'
          git push origin main
