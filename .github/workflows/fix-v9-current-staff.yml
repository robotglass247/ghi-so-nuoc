name: Fix V9 current staff list
on:
  push:
    paths:
      - '.github/workflows/fix-v9-current-staff.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch V9 current staff fallback and labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v9-current/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v9-current-901','v9-current-902')
          s=s.replace('V9.0.1 TEST','V9.0.2 TEST')
          fallback="const STAFF_FALLBACK=[\n  {ma:'NS001',ten:'Nguyễn Văn Sĩ'},\n  {ma:'NS002',ten:'Trần Văn Long'},\n  {ma:'NS003',ten:'Nguyễn Ngọc Hóa'},\n  {ma:'NS004',ten:'Vũ Văn Tùng'},\n  {ma:'NS005',ten:'Minh Trang'},\n  {ma:'NS006',ten:'Trần Tuấn Anh'},\n  {ma:'NS007',ten:'Hoàng Long'},\n  {ma:'NS008',ten:'Hoàng Văn Trần'},\n  {ma:'NS009',ten:'Phạm Văn Tuyến'}\n];"
          s=s.replace("const STAFF_FALLBACK=[];", fallback)
          s=s.replace("captureEvidence.textContent='V8.7.8 · Sẵn sàng kiểm tra chụp thay thế';", "captureEvidence.textContent='V9.0.2 TEST · Sẵn sàng kiểm tra chụp thay thế';")
          p.write_text(s,encoding='utf-8')
          sw=Path('v9-current/water-offline-sw.js')
          t=sw.read_text(encoding='utf-8').replace('water-v9current-ERP_MAIN-901','water-v9current-ERP_MAIN-902').replace("build:'v9-current-901'","build:'v9-current-902'")
          sw.write_text(t,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "NS009" v9-current/index.html
          grep -q "V9.0.2 TEST · Sẵn sàng kiểm tra chụp thay thế" v9-current/index.html
          grep -q "water-v9current-ERP_MAIN-902" v9-current/water-offline-sw.js
      - name: Commit
        run: |
          git config user.name 'robotglass247'
          git config user.email 'robotglass247@gmail.com'
          git add v9-current
          git commit -m 'Fix V9 current staff fallback and version labels'
          git push origin main
