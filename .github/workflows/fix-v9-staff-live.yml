name: Fix V9 live staff refresh
on:
  push:
    paths:
      - '.github/workflows/fix-v9-staff-live.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch V9 live staff refresh
        run: |
          echo '' | base64 -d | python3
      - name: Verify V9 live staff fix
        run: |
          grep -q "V9.0.3 TEST" v9-current/index.html
          grep -q "staff_list_v2" v9-current/index.html
          grep -q "credentialless" v9-current/index.html
          grep -q "120000" v9-current/index.html
          grep -q "NS005" v9-current/index.html
          grep -q "water-v9current-ERP_MAIN-903" v9-current/water-offline-sw.js
      - name: Commit V9 live staff fix
        run: |
          git config user.name 'robotglass247'
          git config user.email 'robotglass247@gmail.com'
          git add v9-current
          git commit -m 'Fix V9 live staff refresh from Sheet'
          git push origin main
