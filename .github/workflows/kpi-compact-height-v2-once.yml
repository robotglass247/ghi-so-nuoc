name: M&E OPS KPI compact height v2

on:
  push:
    paths:
      - '.github/workflows/kpi-compact-height-v2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact KPI block height
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('me-ops/kpi-overview-v1.js')
          s=p.read_text(encoding='utf-8')
          reps={
            '.kpi4-card{padding:16px 16px 11px;overflow:hidden}':'.kpi4-card{padding:10px 12px 8px;overflow:hidden}',
            '.kpi4-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}':'.kpi4-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}',
            '.kpi4-open{border:0;background:#eef5ff;color:#2477f3;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap}':'.kpi4-open{border:0;background:#eef5ff;color:#2477f3;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap}',
            'padding:8px 8px;text-align:center;color:#234264;vertical-align:middle;line-height:1.12':'padding:4px 8px;text-align:center;color:#234264;vertical-align:middle;line-height:1.05',
            '.kpi4-table tbody th{font-size:14px;font-weight:800;line-height:1.12}':'.kpi4-table tbody th{font-size:14px;font-weight:800;line-height:1.05}',
            '.kpi4-sub{display:block;margin-top:3px;color:#667e98;font-size:10px;font-weight:650;line-height:1.1;min-height:0}':'.kpi4-sub{display:block;margin-top:2px;color:#667e98;font-size:10px;font-weight:650;line-height:1.05;min-height:0}',
            '.kpi4-bar{display:block;height:5px;margin:4px auto 0;max-width:90px;border-radius:99px;background:rgba(90,108,135,.16);overflow:hidden}':'.kpi4-bar{display:block;height:4px;margin:2px auto 0;max-width:90px;border-radius:99px;background:rgba(90,108,135,.16);overflow:hidden}',
            '.kpi4-card{padding:11px 6px 9px;border-radius:12px}':'.kpi4-card{padding:8px 6px 7px;border-radius:12px}',
            '.kpi4-head{align-items:center;margin-bottom:8px;gap:6px}':'.kpi4-head{align-items:center;margin-bottom:5px;gap:6px}',
            '.kpi4-table th,.kpi4-table td{padding:6px 3px;line-height:1.08}':'.kpi4-table th,.kpi4-table td{padding:4px 3px;line-height:1.04}',
            '.kpi4-bar{height:4px;margin-top:3px;max-width:54px}':'.kpi4-bar{height:3px;margin-top:2px;max-width:54px}',
            '.kpi4-table th,.kpi4-table td{padding:5px 2px}':'.kpi4-table th,.kpi4-table td{padding:3px 2px}'
          }
          for a,b in reps.items():
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          for fn in ['me-ops/app.html','me-ops/index.html','me-ops/water.html']:
            q=Path(fn)
            t=q.read_text(encoding='utf-8')
            t=t.replace('kpi-overview-v1.js?v=4','kpi-overview-v1.js?v=5')
            t=t.replace('fast=12-kpi-autoheight','fast=13-kpi-compact')
            q.write_text(t,encoding='utf-8')
          PY
      - name: Commit compact KPI height
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add me-ops/kpi-overview-v1.js me-ops/app.html me-ops/index.html me-ops/water.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Compact KPI block height to match quick access'
          git push
