name: Fix embedded R6 preauth once

on:
  push:
    paths:
      - '.github/workflows/fix-embedded-r6-preauth-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch embedded R6 SSO
        shell: python
        run: |
          from pathlib import Path

          g=Path('water-bql-app-sso-guard-v1.js')
          s=g.read_text(encoding='utf-8')
          s=s.replace("const BUILD='water-bql-app-sso-guard-v2-parent-bridge';","const BUILD='water-bql-app-sso-guard-v3-preauth';",1)
          old="""    if(seed(app)){
      const st=document.createElement('style');"""
          new="""    if(seed(app)){
      window.WATER_BQL_SESSION=app;
      window.WATER_BQL_AUTH_STAFF=app.staff;
      window.WATER_BQL_EMBED_PREAUTH=true;
      window.WATER_BQL_AUTH_OK=true;
      document.documentElement.classList.remove('waterAuthPending');
      const st=document.createElement('style');"""
          if old not in s:
              raise SystemExit('guard seed block not found')
          s=s.replace(old,new,1)
          g.write_text(s,encoding='utf-8')

          a=Path('water-auth-bql-v20.js')
          s=a.read_text(encoding='utf-8')
          old="async function start(){gate();"
          new="""async function start(){if(window.WATER_BQL_EMBED_PREAUTH&&window.WATER_BQL_SESSION&&window.WATER_BQL_AUTH_STAFF){const g=$('waterBqlAuthGate');if(g)g.remove();document.documentElement.classList.remove('waterAuthPending');window.WATER_BQL_AUTH_OK=true;window.dispatchEvent(new CustomEvent('WATER_BQL_AUTH_OK',{detail:{staff:window.WATER_BQL_AUTH_STAFF,projectId:PROJECT}}));return}gate();"""
          if old not in s:
              raise SystemExit('BQL start block not found')
          s=s.replace(old,new,1)
          a.write_text(s,encoding='utf-8')

          h=Path('quan-ly-v20-r6.html')
          s=h.read_text(encoding='utf-8')
          if './water-bql-app-sso-guard-v1.js?v=2' not in s:
              raise SystemExit('guard cache ref not found')
          s=s.replace('./water-bql-app-sso-guard-v1.js?v=2','./water-bql-app-sso-guard-v1.js?v=3',1)
          s=s.replace('./water-auth-bql-v20.js?v=07ab1254','./water-auth-bql-v20.js?v=embedded-preauth-1',1)
          h.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add water-bql-app-sso-guard-v1.js water-auth-bql-v20.js quan-ly-v20-r6.html
          git commit -m 'Fix embedded R6 SSO with app preauth' || exit 0
          git push
