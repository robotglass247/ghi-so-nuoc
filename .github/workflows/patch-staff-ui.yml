name: Patch staff UI

on:
  push:
    paths:
      - '.github/workflows/patch-staff-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch staff display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('v87-background.html')
          s = path.read_text(encoding='utf-8')

          s = s.replace(
              '<meta name="water-build" content="878-fast1">',
              '<meta name="water-build" content="878-fast2">',
              1
          )

          old_css = """#reloadStaffBtn{display:none;background:#f1f1f1;border:1px solid #ccc}\ncanvas,iframe{display:none}"""
          new_css = """#reloadStaffBtn{display:none;background:#f1f1f1;border:1px solid #ccc}\n/* Danh sách nhân sự gọn: chỉ hiện tên, rộng theo tên dài nhất */\n#staffModal .modalIn{width:max-content;max-width:calc(100vw - 36px);padding:14px 16px}\n#staffSelect{display:block;width:auto;min-width:180px;max-width:calc(100vw - 68px);padding:6px 34px 6px 10px;margin:6px auto 0;font-size:16px;line-height:1.15;height:auto}\n#staffSelect option{font-size:16px;line-height:1.15;padding:3px 8px}\ncanvas,iframe{display:none}"""
          if old_css in s and 'Danh sách nhân sự gọn' not in s:
              s = s.replace(old_css, new_css, 1)

          old_render = """function renderStaff(){\n  const sel=byId('staffSelect');\n  sel.innerHTML='<option value=\"\">-- Chọn nhân sự --</option>';\n  staffList.forEach(x=>{\n    const op=document.createElement('option');\n    op.value=x.ma;\n    op.textContent=x.ma+' - '+x.ten;\n    sel.appendChild(op);\n  });\n  const old=getStaffCode();\n  if(old)sel.value=old;\n}"""
          new_render = """function renderStaff(){\n  const sel=byId('staffSelect');\n  sel.innerHTML='<option value=\"\">-- Chọn nhân sự --</option>';\n  staffList.forEach(x=>{\n    const op=document.createElement('option');\n    op.value=x.ma;\n    op.textContent=x.ten||'';\n    sel.appendChild(op);\n  });\n  const old=getStaffCode();\n  if(old)sel.value=old;\n  requestAnimationFrame(fitStaffSelectSize);\n}\n\nfunction fitStaffSelectSize(){\n  const sel=byId('staffSelect');\n  if(!sel)return;\n  const cs=getComputedStyle(sel);\n  const canvas=document.createElement('canvas');\n  const ctx=canvas.getContext('2d');\n  ctx.font=[cs.fontStyle,cs.fontWeight,cs.fontSize,cs.fontFamily].join(' ');\n  const texts=['-- Chọn nhân sự --',...staffList.map(x=>String(x.ten||'').trim())];\n  let maxTextWidth=0;\n  texts.forEach(text=>{maxTextWidth=Math.max(maxTextWidth,ctx.measureText(text).width)});\n  const wanted=Math.ceil(maxTextWidth+50);\n  const maxAllowed=Math.max(180,Math.min(window.innerWidth-68,430));\n  const finalWidth=Math.min(Math.max(wanted,180),maxAllowed);\n  sel.style.width=finalWidth+'px';\n  const box=sel.closest('.modalIn');\n  if(box)box.style.width=Math.min(finalWidth+32,window.innerWidth-36)+'px';\n}"""
          if old_render in s:
              s = s.replace(old_render, new_render, 1)

          old_open = """function openStaff(){\n  renderStaff();\n  byId('staffModal').style.display='flex';\n\n  // Mỗi lần mở danh sách nhân sự, tự lấy danh sách mới nhất từ Google Sheet\n  if(navigator.onLine){\n    loadStaff(true);\n  }\n}"""
          new_open = """function openStaff(){\n  renderStaff();\n  byId('staffModal').style.display='flex';\n  requestAnimationFrame(fitStaffSelectSize);\n\n  // Mỗi lần mở danh sách nhân sự, tự lấy danh sách mới nhất từ Google Sheet\n  if(navigator.onLine){\n    loadStaff(true);\n  }\n}"""
          if old_open in s:
              s = s.replace(old_open, new_open, 1)

          old_name = """function updateStaffName(){\n  const ma=getStaffCode();\n  const x=staffList.find(a=>a.ma===ma);\n  byId('staffName').textContent=x?(x.ma+' - '+x.ten):(ma||'Chưa chọn nhân sự');\n}"""
          new_name = """function updateStaffName(){\n  const ma=getStaffCode();\n  const x=staffList.find(a=>a.ma===ma);\n  byId('staffName').textContent=x?x.ten:(ma?'Đang tải nhân sự...':'Chưa chọn nhân sự');\n}"""
          if old_name in s:
              s = s.replace(old_name, new_name, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v87-background.html
          git commit -m "Fix compact staff list display"
          git push
