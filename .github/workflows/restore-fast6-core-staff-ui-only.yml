name: Restore FAST6 core plus Staff UI only
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/restore-fast6-core-staff-ui-only.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact FAST6 runtime and add Staff UI only
        run: |
          set -euo pipefail
          git show c4210230fa901b8b80ebf3eb4ddbed679db90647:v87-background.html > v87-background.html
          git show c4210230fa901b8b80ebf3eb4ddbed679db90647:water-offline-sw.js > water-offline-sw.js

          cat > /tmp/staff_compact.js <<'EOF_STAFF'
          /* STAFF_COMPACT_MAIN905 - UI ONLY */
          (function(){
            'use strict';
            const STYLE_ID='staffCompactMain905Style';
            const LIST_ID='staffCompactList';
            function addStyle(){
              if(document.getElementById(STYLE_ID))return;
              const style=document.createElement('style');
              style.id=STYLE_ID;
              style.textContent=`
                #staffSelect{display:none !important;}
                #staffModal .modalIn{width:max-content !important;max-width:calc(100vw - 24px) !important;padding:12px 14px !important;}
                #staffModal .modalTitle{margin:0 0 7px !important;white-space:nowrap !important;font-size:16px !important;line-height:1.15 !important;}
                #staffCompactList{margin:0 auto !important;border:1px solid #d6d6d6 !important;border-radius:8px !important;overflow-x:hidden !important;overflow-y:auto !important;max-height:min(48vh,320px) !important;background:#fff !important;}
                #staffCompactList .staffCompactItem{display:flex !important;align-items:center !important;gap:5px !important;width:100% !important;min-height:0 !important;height:auto !important;margin:0 !important;padding:5px 8px !important;border:0 !important;border-bottom:1px solid #e7e7e7 !important;border-radius:0 !important;background:#fff !important;color:#111 !important;font-family:Arial,sans-serif !important;font-size:16px !important;font-weight:400 !important;line-height:1.15 !important;text-align:left !important;white-space:nowrap !important;box-shadow:none !important;}
                #staffCompactList .staffCompactItem:last-child{border-bottom:0 !important;}
                #staffCompactList .staffCompactItem.isSelected{background:#eef6ff !important;font-weight:700 !important;}
                #staffCompactList .staffCompactCheck{display:inline-block !important;flex:0 0 16px !important;width:16px !important;text-align:center !important;font-size:14px !important;line-height:1 !important;}
                #staffCompactList .staffCompactName{display:block !important;overflow:hidden !important;text-overflow:ellipsis !important;white-space:nowrap !important;}
              `;
              document.head.appendChild(style);
            }
            function data(){try{return Array.isArray(staffList)?staffList:[];}catch(e){return [];}}
            function selectedCode(){
              try{if(typeof getStaffCode==='function')return String(getStaffCode()||'').trim().toUpperCase();}catch(e){}
              try{return String(localStorage.getItem('water_staff')||'').trim().toUpperCase();}catch(e){return '';}
            }
            function ensureList(){
              addStyle();
              const sel=document.getElementById('staffSelect');
              if(!sel)return null;
              sel.setAttribute('aria-hidden','true');
              sel.tabIndex=-1;
              let list=document.getElementById(LIST_ID);
              if(!list){
                list=document.createElement('div');
                list.id=LIST_ID;
                list.setAttribute('role','listbox');
                sel.insertAdjacentElement('afterend',list);
              }
              return list;
            }
            function measure(text,font){
              const c=document.createElement('canvas');
              const ctx=c.getContext('2d');
              ctx.font=font||'16px Arial';
              return ctx.measureText(String(text||'')).width;
            }
            function fitCompactStaff(){
              const list=ensureList();
              if(!list)return;
              const rows=data();
              let longest=0;
              rows.forEach(x=>{longest=Math.max(longest,measure(String(x.ten||'').trim(),'16px Arial'));});
              const nameWidth=Math.ceil(longest+16+5+18);
              const maxList=Math.max(180,window.innerWidth-56);
              const listWidth=Math.min(Math.max(nameWidth,180),maxList);
              list.style.width=listWidth+'px';
              const title=document.querySelector('#staffModal .modalTitle');
              const titleWidth=title?Math.ceil(measure(title.textContent||'','700 16px Arial')+8):0;
              const modal=document.querySelector('#staffModal .modalIn');
              if(modal){
                const modalWidth=Math.min(Math.max(listWidth+28,titleWidth+28),window.innerWidth-24);
                modal.style.width=modalWidth+'px';
              }
            }
            function renderCompactStaff(){
              const sel=document.getElementById('staffSelect');
              const list=ensureList();
              if(!sel||!list)return;
              const rows=data();
              const old=selectedCode();
              sel.innerHTML='<option value="">-- Chọn nhân sự --</option>';
              rows.forEach(x=>{
                const op=document.createElement('option');
                op.value=String(x.ma||'').trim().toUpperCase();
                op.textContent=String(x.ten||'').trim();
                sel.appendChild(op);
              });
              if(old)sel.value=old;
              list.innerHTML='';
              if(!rows.length){
                const empty=document.createElement('div');
                empty.textContent='Đang tải danh sách nhân sự...';
                empty.style.cssText='padding:6px 8px;font:16px/1.15 Arial;white-space:nowrap';
                list.appendChild(empty);
              }else{
                rows.forEach(x=>{
                  const ma=String(x.ma||'').trim().toUpperCase();
                  const ten=String(x.ten||'').trim();
                  const b=document.createElement('button');
                  b.type='button';
                  b.className='staffCompactItem'+(ma===old?' isSelected':'');
                  b.dataset.ma=ma;
                  b.setAttribute('role','option');
                  b.setAttribute('aria-selected',ma===old?'true':'false');
                  const check=document.createElement('span');
                  check.className='staffCompactCheck';
                  check.textContent=ma===old?'✓':'';
                  const name=document.createElement('span');
                  name.className='staffCompactName';
                  name.textContent=ten;
                  b.append(check,name);
                  b.addEventListener('click',()=>{
                    sel.value=ma;
                    list.querySelectorAll('.staffCompactItem').forEach(node=>{
                      const on=node.dataset.ma===ma;
                      node.classList.toggle('isSelected',on);
                      node.setAttribute('aria-selected',on?'true':'false');
                      const c=node.querySelector('.staffCompactCheck');
                      if(c)c.textContent=on?'✓':'';
                    });
                  });
                  list.appendChild(b);
                });
              }
              requestAnimationFrame(fitCompactStaff);
            }
            addStyle();
            window.renderStaff=renderCompactStaff;
            window.fitStaffSelectSize=fitCompactStaff;
            try{renderStaff=renderCompactStaff;}catch(e){}
            try{fitStaffSelectSize=fitCompactStaff;}catch(e){}
            window.addEventListener('resize',()=>requestAnimationFrame(fitCompactStaff));
            setTimeout(renderCompactStaff,0);
          })();
          EOF_STAFF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('v87-background.html')
          html=p.read_text(encoding='utf-8')
          staff=Path('/tmp/staff_compact.js').read_text(encoding='utf-8')
          marker='/* STAFF_COMPACT_MAIN905 - UI ONLY */'
          if marker in html:
              raise SystemExit('staff marker unexpectedly already present in Stable source')
          html=html.replace('</body>', '<script>\n'+staff+'\n</script>\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

          cat > app.html <<'EOF_APP'
          <!doctype html>
          <html lang="vi">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <meta name="theme-color" content="#111111">
          <title>Ghi số nước</title>
          <style>html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;text-align:center}#boot{padding:24px;font-size:16px;line-height:1.5}</style>
          </head>
          <body>
          <div id="boot">Đang mở ứng dụng FAST6…</div>
          <script>
          (async()=>{
            const SW='./water-offline-sw.js?v=878-fast6-staff-ui-pass1';
            const TARGET='./v87-background.html?build=878-fast6-staff-ui-pass1';
            const EXPECT='878-fast6';
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            const go=()=>location.replace(TARGET);
            function getStatus(worker){
              return new Promise(resolve=>{
                try{
                  const ch=new MessageChannel();
                  const timer=setTimeout(()=>resolve(null),900);
                  ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
                  worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);
                }catch(e){resolve(null);}
              });
            }
            try{
              if(!('serviceWorker' in navigator)){go();return;}
              if(!navigator.onLine){go();return;}
              const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
              try{await reg.update();}catch(e){}
              const started=Date.now();
              while(Date.now()-started<10000){
                const candidates=[reg.installing,reg.waiting,reg.active,navigator.serviceWorker.controller].filter(Boolean);
                for(const w of candidates){
                  const st=await getStatus(w);
                  if(st&&st.ready===true&&st.build===EXPECT){go();return;}
                }
                await wait(250);
              }
              go();
            }catch(e){go();}
          })();
          </script>
          </body>
          </html>
          EOF_APP

          cat > update-fast6-staffpass.html <<'EOF_UPD'
          <!doctype html>
          <html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cập nhật FAST6</title>
          <style>body{font-family:Arial,sans-serif;text-align:center;padding:40px 18px}#s{font-size:18px;font-weight:700;line-height:1.5}</style></head>
          <body><div id="s">Đang đưa ứng dụng về đúng FAST6 Stable…</div>
          <script>
          (async()=>{
            const s=document.getElementById('s');
            const SW='./water-offline-sw.js?v=878-fast6-staff-ui-pass1';
            const TARGET='./v87-background.html?build=878-fast6-staff-ui-pass1';
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            function status(w){return new Promise(resolve=>{try{const c=new MessageChannel();const t=setTimeout(()=>resolve(null),900);c.port1.onmessage=e=>{clearTimeout(t);resolve(e.data||null)};w.postMessage('WATER_OFFLINE_STATUS',[c.port2])}catch(e){resolve(null)}})}
            try{
              if(!('serviceWorker' in navigator)){location.replace(TARGET);return;}
              const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
              try{await reg.update()}catch(e){}
              const start=Date.now();
              while(Date.now()-start<12000){
                const ws=[reg.installing,reg.waiting,reg.active,navigator.serviceWorker.controller].filter(Boolean);
                for(const w of ws){const st=await status(w);if(st&&st.ready===true&&st.build==='878-fast6'){s.textContent='✓ FAST6 Stable đã sẵn sàng';await wait(700);location.replace(TARGET);return;}}
                await wait(250);
              }
              s.textContent='Đã cập nhật. Đang mở ứng dụng…';
              location.replace(TARGET);
            }catch(e){s.textContent='Đang mở ứng dụng…';location.replace(TARGET)}
          })();
          </script></body></html>
          EOF_UPD

          # Sanity checks: core is exact Stable except Staff UI appended to HTML.
          test "$(git show c4210230fa901b8b80ebf3eb4ddbed679db90647:water-offline-sw.js | git hash-object --stdin)" = "$(git hash-object water-offline-sw.js)"
          grep -q "indexedDB.open('water_meter_v6',1)" v87-background.html
          grep -q "STAFF_COMPACT_MAIN905 - UI ONLY" v87-background.html
          grep -q "water-offline-sw.js?v=878-fast6-staff-ui-pass1" app.html
          if grep -q "water-ui3.js" app.html; then exit 1; fi

          git config user.name robotglass247
          git config user.email robotglass247@gmail.com
          git add v87-background.html water-offline-sw.js app.html update-fast6-staffpass.html
          if git diff --cached --quiet; then
            echo 'No runtime changes needed'
            exit 0
          fi
          git commit -m "Restore exact FAST6 runtime; keep Staff compact UI only"
          git push
