name: "M&E OPS startup speed fix v1"

on:
  push:
    paths:
      - '.github/workflows/meops-speed-fix-v1-once.yml'
      - '.github/scripts/meops_speed_patch.py'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply startup speed patch
        run: python3 .github/scripts/meops_speed_patch.py
      - name: Commit optimized startup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add me-ops-auto/adapter-v4.js me-ops-auto/master-runtime.js me-ops-auto/result-module-v2.js me-ops-auto/kpi-overview-v1.js me-ops-auto/app.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Speed up M&E OPS startup and defer background RPCs'
          git push
