name: Patch manager tab V2 once

on:
  push:
    paths:
      - '.github/workflows/patch-manager-tab-v2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader to V2 and bump release
        shell: python
        run: |
          from pathlib import Path
          p=Path('r1135-v20-direct.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const RELEASE='20261002-v20-pass-layout-stable-r4-pwa';","const RELEASE='20261003-manager-tab-v2';",1)
          s=s.replace('./water-manager-tab-v1.js?v=1&t=', './water-manager-tab-v2.js?v=2&t=',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r1135-v20-direct.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use robust 2x2 manager tab V2 in V20 app'
          git push
