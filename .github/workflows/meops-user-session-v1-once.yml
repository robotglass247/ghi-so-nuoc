name: ME OPS user session v1

on:
  push:
    paths:
      - '.github/workflows/meops-user-session-v1-once.yml'

permissions:
  contents: write

jobs:
  deploy-user-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime
        run: node --check me-ops-auto/master-runtime.js

      - name: Bump master runtime version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('me-ops-auto/app.html')
          s=p.read_text(encoding='utf-8')
          old='./master-runtime.js?v=progressive-1'
          new='./master-runtime.js?v=user-session-1'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              s=s.replace('./master-runtime.js',new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit app version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add me-ops-auto/app.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Load user session runtime v1"
          git push
