name: ME OPS progressive loading v1

on:
  push:
    paths:
      - '.github/workflows/meops-progressive-load-v1-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prioritized loading scripts
        shell: bash
        run: |
          node --check me-ops-auto/adapter-v4.js
          node --check me-ops-auto/kpi-overview-v1.js

      - name: Bump asset versions in app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('me-ops-auto/app.html')
          s=p.read_text(encoding='utf-8')
          for old in ('./adapter-v4.js?v=progressive-1','./adapter-v4.js?v=speed-1'):
              s=s.replace(old,'./adapter-v4.js?v=speed-2')
          for old in ('./kpi-overview-v1.js?v=progressive-1','./kpi-overview-v1.js?v=speed-1'):
              s=s.replace(old,'./kpi-overview-v1.js?v=speed-2')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit deployment changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add me-ops-auto/app.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use prioritized loading assets speed-2"
          git push
