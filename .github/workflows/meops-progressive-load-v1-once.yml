name: ME OPS progressive loading v1

on:
  push:
    paths:
      - '.github/workflows/meops-progressive-load-v1-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply progressive loading patch
        run: python3 tools/meops_progressive_patch_v1.py

      - name: Commit progressive loading changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add me-ops-auto/adapter-v4.js me-ops-auto/app.html me-ops-auto/today-worktype-v1.js me-ops-auto/kpi-overview-v1.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Make M&E OPS cache-first and refresh dashboard in priority order"
          git push
