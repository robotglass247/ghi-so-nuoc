name: M&E OPS progressive loading v1

on:
  push:
    paths:
      - '.github/workflows/meops-progressive-load-v1-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply progressive cache-first loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

