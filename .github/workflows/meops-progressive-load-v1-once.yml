          s=p.read_text(encoding='utf-8')
          s=s.replace(
              "const DASH_CACHE_MAX_AGE = 6 * 60 * 60 * 1000;",
              "const DASH_CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000;",
              1
          )
          s=s.replace(
              "const PLAN_CACHE_MAX_AGE = 60 * 60 * 1000;",
              "const PLAN_CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000;",
              1
          )

