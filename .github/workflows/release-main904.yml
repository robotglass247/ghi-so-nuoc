name: Release main904
on:
  push:
    paths:
      - '.github/workflows/release-main904.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update production build markers
        run: python3 .github/scripts/release_main904.py
      - name: Verify production build markers
        run: |
          grep -q "879-main904" app.html
          grep -q "879-main904" water-offline-sw-ui3.js
          grep -q "water-v879-main904" water-offline-sw-ui3.js
      - name: Commit release markers
        run: |
          git config user.name 'robotglass247'
          git config user.email 'robotglass247@gmail.com'
          git add app.html water-offline-sw-ui3.js
          git commit -m 'Release tested staff updates to main app'
          git push origin main
