name: M&E OPS AUTO backend source v1

on:
  push:
    paths:
      - '.github/workflows/meops-auto-backend-v1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish central backend source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps-script/me-ops-auto
          mkdir -p apps-script/me-ops-auto
          cat > /tmp/meops-auto-backend.b64 <<'B64'
...
B64
          base64 -d /tmp/meops-auto-backend.b64 > /tmp/meops-auto-backend.tar.gz
          tar -xzf /tmp/meops-auto-backend.tar.gz -C apps-script/me-ops-auto
          rm -f /tmp/meops-auto-backend.b64 /tmp/meops-auto-backend.tar.gz
          find apps-script/me-ops-auto -maxdepth 1 -type f -print
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/me-ops-auto
          git commit -m 'Publish M&E OPS AUTO central backend v1'
          git push
