name: Publish V9 current baseline
on:
  push:
    paths:
      - '.github/workflows/publish-v9-current.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build from latest production frontend
        run: |
          rm -rf v9-current
          mkdir -p v9-current
          cp v87-background.html v9-current/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v9-current/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<meta name="water-build" content="[^"]*">','<meta name="water-build" content="v9-current-901">',s)
          s=s.replace('<title>Ghi số nước V8.7.8</title>','<title>Ghi số nước V9.0.1 TEST</title>')
          s=s.replace('GHI SỐ NƯỚC V8.7.8','GHI SỐ NƯỚC V9.0.1 TEST')
          s=s.replace('V8.7.8 · Lưu ảnh tối ưu','V9.0.1 TEST · Nguồn bản hiện tại')
          s=s.replace('V8.7 · Chưa xác nhận đồng bộ','V9 TEST · Chưa xác nhận đồng bộ')
          s=s.replace("const STAFF_CACHE_KEY='water_staff_list_v1';","const STAFF_CACHE_KEY='water_v9current_ERP_MAIN_staff_list_v1';")
          s=s.replace("'water_capture_v86:'","'water_v9current_ERP_MAIN_capture_v86:'")
          s=s.replace("localStorage.getItem('water_staff')","localStorage.getItem('water_v9current_ERP_MAIN_staff')")
          s=s.replace("localStorage.setItem('water_staff',ma)","localStorage.setItem('water_v9current_ERP_MAIN_staff',ma)")
          s=s.replace("indexedDB.open('water_meter_v6',1)","indexedDB.open('water_v9current_ERP_MAIN_meter_v6',1)")
          s=re.sub(r"const STAFF_FALLBACK=\[[\s\S]*?\];","const STAFF_FALLBACK=[];",s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
          cat > v9-current/water-offline-sw.js <<'EOF'
          const CACHE='water-v9current-ERP_MAIN-901';
          const APP=new URL('./index.html',self.location.href).href;
          const QR='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
          self.addEventListener('install',event=>event.waitUntil((async()=>{
            const c=await caches.open(CACHE);
            try{const r=await fetch(new Request(APP,{cache:'reload'}));if(r&&r.ok)await c.put(APP,r.clone())}catch(e){}
            try{const r=await fetch(new Request(QR,{mode:'cors',cache:'reload'}));if(r&&r.ok)await c.put(QR,r.clone())}catch(e){}
            await self.skipWaiting();
          })()));
          self.addEventListener('activate',event=>event.waitUntil((async()=>{
            const ks=await caches.keys();
            await Promise.all(ks.filter(k=>k.startsWith('water-v9current-ERP_MAIN-')&&k!==CACHE).map(k=>caches.delete(k)));
            await self.clients.claim();
          })()));
          self.addEventListener('message',event=>{
            if(event.data==='WATER_OFFLINE_STATUS'&&event.ports&&event.ports[0]){
              event.ports[0].postMessage({ready:true,build:'v9-current-901'});
            }
          });
          self.addEventListener('fetch',event=>{
            const req=event.request;
            if(req.method!=='GET')return;
            const u=new URL(req.url);
            const inScope=u.origin===self.location.origin&&u.pathname.startsWith(new URL('./',self.location.href).pathname);
            if(!inScope&&req.url!==QR)return;
            event.respondWith((async()=>{
              const c=await caches.open(CACHE);
              if(req.mode==='navigate'){
                try{const f=await fetch(req);if(f&&f.ok)await c.put(APP,f.clone());return f}catch(e){return (await c.match(APP))||Response.error()}
              }
              const hit=await c.match(req);
              if(hit)return hit;
              try{const f=await fetch(req);if(f&&f.ok)await c.put(req,f.clone());return f}catch(e){return Response.error()}
            })());
          });
          EOF
      - name: Verify isolation markers
        run: |
          grep -q 'GHI SỐ NƯỚC V9.0.1 TEST' v9-current/index.html
          grep -q 'water_v9current_ERP_MAIN_meter_v6' v9-current/index.html
          grep -q 'water_v9current_ERP_MAIN_staff' v9-current/index.html
          grep -q 'water-v9current-ERP_MAIN-901' v9-current/water-offline-sw.js
          ! grep -q 'Designed by Mr.Hoa' v9-current/index.html
      - name: Commit isolated current baseline
        run: |
          git config user.name 'robotglass247'
          git config user.email 'robotglass247@gmail.com'
          git add v9-current
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish V9 current baseline from latest production UI'
          git push origin main
