name: Promote SPEED3 PASS to main app
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/promote-speed3-main.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote locked SPEED3 candidate
        run: |
          set -euo pipefail
          cp speed3-app-test.html v87-background.html
          grep -q "indexedDB.open('water_meter_v6',1)" v87-background.html
          grep -q "batchuploadturbo" v87-background.html
          grep -q "WATER_TURBO_UPLOAD_RESULT" v87-background.html
          grep -q "const LANES=2" v87-background.html
          grep -q "const BATCH_SIZE=5" v87-background.html
          mkdir -p checkpoints
          cat > checkpoints/STABLE_2026-09-12_CORE_SPEED3_MAIN_PASS.md <<'EOF'
          # STABLE-2026-09-12-CORE-SPEED3-MAIN-PASS

          Locked production core after user validation.

          Confirmed by user before promotion:
          - Online/Offline capture: PASS
          - Local image save: PASS
          - Pending queue: PASS
          - Automatic sync: PASS
          - 12 queued images automatically synchronized to 0 in integrated app test
          - Turbo benchmark: 20 images / 37.3 s = 1.87 s/image, 32.1 images/min, queue 0

          Promotion rule:
          - v87-background.html is copied exactly from speed3-app-test.html.
          - Keep camera, QR, IndexedDB water_meter_v6, Offline, captureAndSave and local save unchanged.
          - Do not add compact personnel UI until production main regression is confirmed PASS.
          EOF
          git config user.name robotglass247
          git config user.email robotglass247@gmail.com
          git add v87-background.html checkpoints/STABLE_2026-09-12_CORE_SPEED3_MAIN_PASS.md
          git commit -m "Promote validated SPEED3 core to main app"
          git push
