name: Patch manager tab V1 once

on:
  push:
    paths:
      - '.github/workflows/patch-manager-tab-v1-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('r1135-v20-direct.html')
          s=p.read_text(encoding='utf-8')
          old='''      "'<script src=\\\"./dev-r1135-unified/manage-view-summary-label-v1.js?v=1&t="+stamp+"\\\"><\\\\/script>'+"+\n      "'<script src=\\\"./water-progress-authority-v1.js?v=1&t="+stamp+"\\\"><\\\\/script>'+"+'''
          new='''      "'<script src=\\\"./dev-r1135-unified/manage-view-summary-label-v1.js?v=1&t="+stamp+"\\\"><\\\\/script>'+"+\n      "'<script src=\\\"./water-manager-tab-v1.js?v=1&t="+stamp+"\\\"><\\\\/script>'+"+\n      "'<script src=\\\"./water-progress-authority-v1.js?v=1&t="+stamp+"\\\"><\\\\/script>'+"+'''
          if 'water-manager-tab-v1.js' in s:
              print('already patched')
          elif old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('patched')
          else:
              raise SystemExit('target block not found')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r1135-v20-direct.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable role-gated manager tab in V20 app'
          git push
