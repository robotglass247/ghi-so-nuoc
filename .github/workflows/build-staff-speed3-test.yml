name: Build STAFF PASS on SPEED3 test
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-staff-speed3-test.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build staff-only candidate
        run: |
          set -euo pipefail
          git fetch origin stable/staff-main905-pass-20260912 --depth=1
          git show origin/stable/staff-main905-pass-20260912:v87-background.html > /tmp/staff-pass-v87.html
          git show origin/stable/staff-main905-pass-20260912:water-ui3.js > /tmp/staff-pass-ui.js
          cp v87-background.html staff-speed3-test.html
          cp v87-background.html /tmp/core-before.html
          python3 - <<'PY'
          from pathlib import Path

          cur=Path('staff-speed3-test.html').read_text(encoding='utf-8')
          ref=Path('/tmp/staff-pass-v87.html').read_text(encoding='utf-8')
          ui=Path('/tmp/staff-pass-ui.js').read_text(encoding='utf-8')

          def function_block(src,name):
              marker=f'function {name}('
              s=src.index(marker)
              b=src.index('{',s)
              depth=0
              quote=None
              esc=False
              i=b
              while i < len(src):
                  ch=src[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in ('\"',"'",'`'): quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              return src[s:i+1]
                  i+=1
              raise RuntimeError('Unclosed '+name)

          def replace_func(dst,name):
              old=function_block(dst,name)
              new=function_block(ref,name)
              return dst.replace(old,new,1)

          # 1) Chỉ thay cấu hình cache/fallback Nhân sự theo mốc MAIN905 PASS.
          a='const STAFF_CACHE_KEY='
          b='let stream=null;'
          cs=cur.index(a); ce=cur.index(b,cs)
          rs=ref.index(a); re=ref.index(b,rs)
          cur=cur[:cs]+ref[rs:re]+cur[ce:]

          # 2) Biến theo dõi cập nhật từ server, chỉ phục vụ Nhân sự.
          if 'let staffRemoteUpdatedAt=0;' not in cur:
              cur=cur.replace('let staffLoadTimer=null;','let staffLoadTimer=null;\nlet staffRemoteUpdatedAt=0;',1)

          # 3) Chỉ thay đúng các hàm Nhân sự đã PASS.
          for fn in ['setStaffList','loadStaff','renderStaff','openStaff','saveStaff','updateStaffName']:
              cur=replace_func(cur,fn)

          # Hàm fit kích thước là hàm mới của STAFF PASS.
          if 'function fitStaffSelectSize()' not in cur:
              fit=function_block(ref,'fitStaffSelectSize')
              pos=cur.index('function openStaff(){')
              cur=cur[:pos]+fit+'\n\n'+cur[pos:]

          # 4) Ghép đúng khối HTML compact đã PASS. Không ghép UI3/POST bridge khác.
          marker='/* STAFF_COMPACT_MAIN905 */'
          staff_compact=ui[ui.index(marker):].strip()
          if marker not in cur:
              cur=cur.replace('</body>', '<script>\n'+staff_compact+'\n</script>\n</body>',1)

          cur=cur.replace('content="879-speed3-app-test"','content="879-speed3-staff-test"',1)
          cur=cur.replace('SPEED3 APP TEST · ','SPEED3 + STAFF TEST · ',1)
          Path('staff-speed3-test.html').write_text(cur,encoding='utf-8')
          PY

          # Khóa lõi: các dấu hiệu camera/DB/SPEED3 phải còn nguyên.
          grep -q "indexedDB.open('water_meter_v6',1)" staff-speed3-test.html
          grep -q "async function captureAndSave()" staff-speed3-test.html
          grep -q "const TURBO_LANES=2" staff-speed3-test.html
          grep -q "const TURBO_BATCH_SIZE=5" staff-speed3-test.html
          grep -q "batchuploadturbo" staff-speed3-test.html
          grep -q "STAFF_COMPACT_MAIN905" staff-speed3-test.html
          grep -q "byId('staffName').textContent=x?x.ten" staff-speed3-test.html
          grep -q "staffRemoteUpdatedAt=Date.now()" staff-speed3-test.html

          git config user.name robotglass247
          git config user.email robotglass247@gmail.com
          git add staff-speed3-test.html
          git commit -m "test: apply locked STAFF MAIN905 only on SPEED3 core"
          git push
