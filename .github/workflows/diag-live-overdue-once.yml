name: Diagnose live M&E OPS overdue count

on:
  push:
    paths:
      - '.github/workflows/diag-live-overdue-once.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query live Apps Script dashboard
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re, html

          url = 'https://script.google.com/macros/s/AKfycbzKYMiU5uAJGjihZ6cOTe-0JUkAvce1WEZjmOWI7j9KhNfnYIPlEjJAv5cgh-ThOTFt/exec'
          form = urllib.parse.urlencode({
              'api':'meopsrpc','requestId':'diag_overdue_current',
              'action':'getDashboardData','args':'[true]'
          }).encode()
          req = urllib.request.Request(url, data=form, method='POST', headers={'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'})
          with urllib.request.urlopen(req, timeout=60) as r:
              body = html.unescape(r.read().decode('utf-8','replace'))

          n = body
          for a,b in [('&quot;','"'),('\\u0022','"'),('\\x22','"'),('\\"','"'),('\\u003c','<'),('\\u003e','>')]:
              n = n.replace(a,b)

          low=n.lower()
          checks={
            'GETDASHBOARD_UNDEFINED':'getdashboarddata is not defined' in low,
            'REFERENCE_ERROR':'referenceerror' in low,
            'SCRIPT_FUNCTION_NOT_FOUND':'script function not found' in low,
            'PERMISSION_ERROR':'permission' in low or 'access denied' in low,
            'RPC_OK_TRUE':bool(re.search(r'["\']ok["\']\s*:\s*true',n)),
            'RPC_OK_FALSE':bool(re.search(r'["\']ok["\']\s*:\s*false',n)),
          }
          for k,v in checks.items(): print(k+'='+('yes' if v else 'no'))

          for label,pat in [
            ('KPI_OVERDUE',r'["\']kpi["\']\s*:\s*\{.*?["\']overdue["\']\s*:\s*(\d+)'),
            ('COUNTS_OVERDUE',r'["\']counts["\']\s*:\s*\{.*?["\']overdue["\']\s*:\s*(\d+)'),
            ('DASH_DATE',r'["\']date["\']\s*:\s*["\']([^"\']+)')]:
              m=re.search(pat,n,re.S)
              print(label+'='+(m.group(1) if m else 'not-found'))

          # Show only RPC object's field names/booleans, with quoted values scrubbed.
          p=n.find('MEOPS_RPC_RESULT')
          if p>=0:
              seg=n[max(0,p-200):p+900]
              seg=re.sub(r'(:\s*)["\']([^"\']*)["\']',r'\1"<value>"',seg)
              seg=re.sub(r'[A-Za-zÀ-ỹ0-9_]{18,}','<long>',seg)
              print('RPC_STRUCTURE='+seg.replace('\n',' ')[:1100])
          PY
