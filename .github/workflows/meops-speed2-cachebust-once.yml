name: MEOPS speed2 cache bust

on:
  push:
    paths:
      - '.github/workflows/meops-speed2-cachebust-once.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS and bump browser asset versions
        shell: bash
        run: |
          node --check me-ops-auto/adapter-v4.js
          node --check me-ops-auto/kpi-overview-v1.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('me-ops-auto/app.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./adapter-v4.js?v=progressive-1','./adapter-v4.js?v=speed-2')
          s=s.replace('./kpi-overview-v1.js?v=progressive-1','./kpi-overview-v1.js?v=speed-2')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add me-ops-auto/app.html
          if git diff --cached --quiet; then
            echo 'No cache-bust changes needed'
          else
            git commit -m 'Use prioritized loading assets speed-2'
            git push
          fi