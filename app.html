<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Ghi số nước</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#boot{padding:24px;font-size:16px;line-height:1.5}
</style>
</head>
<body>
<div id="boot">Đang mở ứng dụng…</div>
<script>
(async()=>{
  const BUILD='879-main907';
  const SW='./water-offline-sw-ui3.js?v='+BUILD;
  const TARGET='./v87-background.html?build='+BUILD;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const go=()=>location.replace(TARGET);

  function getStatus(worker){
    return new Promise(resolve=>{
      try{
        const ch=new MessageChannel();
        const timer=setTimeout(()=>resolve(null),700);
        ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
        worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);
      }catch(e){resolve(null);}
    });
  }

  try{
    if(!('serviceWorker' in navigator)){
      go();
      return;
    }

    const controller=navigator.serviceWorker.controller;
    if(controller){
      const st=await getStatus(controller);
      if(st&&st.ready===true&&st.build===BUILD){
        go();
        return;
      }
    }

    // Khi Offline: worker đã cài sẽ phục vụ TARGET từ cache.
    if(!navigator.onLine){
      go();
      return;
    }

    // Khi Online nhưng máy còn worker cũ: cài recover1 rồi mới chuyển trang.
    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}

    const started=Date.now();
    while(Date.now()-started<7000){
      if(reg.waiting){try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}}
      const candidates=[reg.active,reg.waiting,reg.installing,navigator.serviceWorker.controller].filter(Boolean);
      for(const worker of candidates){
        if(worker.state&&worker.state!=='activated'&&worker.state!=='installed')continue;
        const st=await getStatus(worker);
        if(st&&st.ready===true&&st.build===BUILD){
          go();
          return;
        }
      }
      await wait(200);
    }

    go();
  }catch(err){
    console.error(err);
    go();
  }
})();
</script>
</body>
</html>
