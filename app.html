<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ghi số nước</title>
<style>html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden}body{visibility:hidden}</style>
</head>
<body>
<script>
(async()=>{
  const BUILD='878-ui3e';
  const SW='./water-offline-sw-ui3.js?build='+BUILD;
  const TARGET='./v87-background.html?build='+BUILD+'&t='+Date.now();
  const RELOAD_KEY='water_app_boot_'+BUILD;
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const go=()=>location.replace(TARGET);

  function controllerIsCurrent(){
    const c=navigator.serviceWorker&&navigator.serviceWorker.controller;
    if(!c)return false;
    try{
      return String(c.scriptURL||'').includes('water-offline-sw-ui3.js') &&
             String(c.scriptURL||'').includes('build='+BUILD);
    }catch(e){
      return false;
    }
  }

  function waitForController(maxMs){
    if(controllerIsCurrent())return Promise.resolve(true);
    return new Promise(resolve=>{
      let done=false;
      const finish=value=>{
        if(done)return;
        done=true;
        clearTimeout(timer);
        navigator.serviceWorker.removeEventListener('controllerchange',onChange);
        resolve(value);
      };
      const onChange=()=>{
        if(controllerIsCurrent())finish(true);
      };
      const timer=setTimeout(()=>finish(controllerIsCurrent()),maxMs);
      navigator.serviceWorker.addEventListener('controllerchange',onChange);
      onChange();
    });
  }

  try{
    if(!('serviceWorker' in navigator)){
      go();
      return;
    }

    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}

    if(reg.waiting){
      try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
    }

    const worker=reg.installing||reg.waiting;
    if(worker && worker.state!=='activated'){
      await Promise.race([
        new Promise(resolve=>{
          const done=()=>{
            if(worker.state==='activated'||worker.state==='redundant')resolve();
          };
          worker.addEventListener('statechange',done);
          done();
        }),
        wait(8000)
      ]);
    }

    if(reg.waiting){
      try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
    }

    const controlled=await waitForController(5000);
    if(controlled){
      try{sessionStorage.removeItem(RELOAD_KEY);}catch(e){}
      go();
      return;
    }

    // Lần đầu sau khi nâng bản: nạp lại launcher một lần để SW đã active
    // có thể kiểm soát trang trước khi chuyển sang v87-background.html.
    let reloaded=false;
    try{reloaded=sessionStorage.getItem(RELOAD_KEY)==='1';}catch(e){}
    if(!reloaded){
      try{sessionStorage.setItem(RELOAD_KEY,'1');}catch(e){}
      location.replace('./app.html?boot='+BUILD+'&t='+Date.now());
      return;
    }

    // Chỉ đến đây khi trình duyệt không phát controllerchange như mong đợi.
    // Chờ thêm ngắn rồi mới vào trang ứng dụng.
    await wait(1500);
    go();
  }catch(err){
    console.error(err);
    await wait(500);
    go();
  }
})();
</script>
</body>
</html>
