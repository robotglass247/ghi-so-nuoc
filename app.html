<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Ghi số nước</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
#boot{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="boot"></div>
<script>
(async()=>{
  const BUILD='878-ui3h';
  const CACHE='water-v878-offline-ui3h';
  const SW='./water-offline-sw-ui3.js';
  const PAGE=new URL('./v87-background.html',location.href).href;
  const UI=new URL('./water-ui3.js',location.href).href;
  const GUIDE=new URL('./water-shot-guide.js',location.href).href;
  const QR='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  function safeScript(text){
    return String(text||'').replace(/<\/(script)/gi,'<\\/$1');
  }

  async function newestUsableCache(){
    const keys=await caches.keys();
    if(keys.includes(CACHE))return CACHE;
    const old=keys.filter(k=>k.startsWith('water-v878-offline-ui3')).sort().reverse();
    return old[0]||'';
  }

  async function renderFromCache(cacheName){
    if(!cacheName)return false;
    const cache=await caches.open(cacheName);
    const pageRes=await cache.match(PAGE);
    if(!pageRes)return false;

    let html=await pageRes.text();
    const uiRes=await cache.match(UI);
    const guideRes=await cache.match(GUIDE);
    const qrRes=await cache.match(QR);

    const uiText=uiRes?await uiRes.text():'';
    const guideText=guideRes?await guideRes.text():'';
    const qrText=qrRes?await qrRes.text():'';

    if(qrText){
      html=html.replace(
        new RegExp('<script[^>]+src=["\\\']https://cdn\\.jsdelivr\\.net/npm/jsqr@1\\.4\\.0/dist/jsQR\\.js["\\\'][^>]*><\\/script>','gi'),
        '<scr'+'ipt>'+safeScript(qrText)+'</scr'+'ipt>'
      );
    }

    if(uiText){
      html=html.replace(
        new RegExp('<script[^>]+src=["\\\']\\./water-ui3\\.js[^"\\\']*["\\\'][^>]*><\\/script>','gi'),
        '<scr'+'ipt>'+safeScript(uiText)+'</scr'+'ipt>'
      );
    }

    if(guideText){
      html=html.replace(
        new RegExp('<script[^>]+src=["\\\']\\./water-shot-guide\\.js[^"\\\']*["\\\'][^>]*><\\/script>','gi'),
        '<scr'+'ipt>'+safeScript(guideText)+'</scr'+'ipt>'
      );
    }

    document.open();
    document.write(html);
    document.close();
    return true;
  }

  async function installCurrent(){
    if(!('serviceWorker' in navigator))return false;
    try{
      const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
      try{await reg.update();}catch(e){}
      if(reg.waiting){try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}}

      const started=Date.now();
      while(Date.now()-started<10000){
        const keys=await caches.keys();
        if(keys.includes(CACHE)){
          const c=await caches.open(CACHE);
          if(await c.match(PAGE))return true;
        }
        await wait(250);
      }
    }catch(e){console.error(e);}
    return false;
  }

  try{
    if(navigator.onLine){
      await installCurrent();
    }

    let cacheName=await newestUsableCache();
    if(await renderFromCache(cacheName))return;

    if(navigator.onLine){
      await installCurrent();
      cacheName=await newestUsableCache();
      if(await renderFromCache(cacheName))return;
      location.replace('./v87-background.html?build='+BUILD+'&online=1');
      return;
    }

    document.getElementById('boot').textContent='Chưa có bản ứng dụng đã lưu trên thiết bị. Hãy mở app.html một lần khi có Internet.';
  }catch(err){
    console.error(err);
    document.getElementById('boot').textContent=navigator.onLine?'Đang tải lại ứng dụng…':'Chưa mở được bản offline đã lưu.';
    if(navigator.onLine)setTimeout(()=>location.reload(),1200);
  }
})();
</script>
</body>
</html>
