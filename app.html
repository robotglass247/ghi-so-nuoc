<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ghi số nước</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden}
body{visibility:hidden}
</style>
</head>
<body>
<script>
(async()=>{
  const BUILD='878-ui3g';
  const SW='./water-offline-sw-ui3.js';
  const TARGET='./v87-background.html?build='+BUILD;
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const go=()=>location.replace(TARGET+(navigator.onLine?'&online=1':'&offline=1'));

  function askWorker(worker,timeoutMs=1800){
    return new Promise(resolve=>{
      if(!worker){resolve(null);return;}
      const ch=new MessageChannel();
      let done=false;
      const finish=value=>{
        if(done)return;
        done=true;
        clearTimeout(timer);
        resolve(value||null);
      };
      const timer=setTimeout(()=>finish(null),timeoutMs);
      ch.port1.onmessage=e=>finish(e.data);
      try{worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);}
      catch(e){finish(null);}
    });
  }

  async function currentReady(){
    const c=navigator.serviceWorker&&navigator.serviceWorker.controller;
    const state=await askWorker(c);
    return !!(state&&state.ready===true&&state.build===BUILD);
  }

  async function waitUntilCurrent(maxMs=10000){
    const started=Date.now();
    while(Date.now()-started<maxMs){
      if(await currentReady())return true;
      await wait(250);
    }
    return false;
  }

  try{
    if(!('serviceWorker' in navigator)){
      go();
      return;
    }

    if(!navigator.onLine){
      // Bình thường nhánh này sẽ không chạy vì UI3G Service Worker
      // trả thẳng trang ứng dụng đã cache cho app.html khi offline.
      if(await waitUntilCurrent(2500)){
        go();
        return;
      }
      document.body.style.visibility='visible';
      document.body.innerHTML='<div style="font-family:Arial,sans-serif;color:#fff;text-align:center;padding:32px 18px;font-size:16px;line-height:1.5">Thiết bị chưa lưu bản UI3G để dùng offline.<br>Hãy mở link này một lần khi có Internet.</div>';
      return;
    }

    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}

    if(reg.waiting){
      try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
    }

    const worker=reg.installing||reg.waiting;
    if(worker&&worker.state!=='activated'){
      await Promise.race([
        new Promise(resolve=>{
          const done=()=>{
            if(worker.state==='activated'||worker.state==='redundant')resolve();
          };
          worker.addEventListener('statechange',done);
          done();
        }),
        wait(10000)
      ]);
    }

    if(reg.waiting){
      try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
    }

    if(await waitUntilCurrent(10000)){
      go();
      return;
    }

    const key='water_ui3g_reload';
    if(sessionStorage.getItem(key)!=='1'){
      sessionStorage.setItem(key,'1');
      location.reload();
      return;
    }

    sessionStorage.removeItem(key);
    go();
  }catch(err){
    console.error(err);
    if(navigator.onLine)go();
  }
})();
</script>
</body>
</html>
