<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Ghi số nước</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#boot{padding:24px;font-size:16px;line-height:1.5}
</style>
</head>
<body>
<div id="boot">Đang mở ứng dụng…</div>
<script>
(()=>{
  const BUILD='878-ui3j';
  const TARGET='./v87-background.html?build='+BUILD;

  // Cài/cập nhật offline ở nền, tuyệt đối không chặn thời gian mở ứng dụng.
  if('serviceWorker' in navigator && navigator.onLine){
    navigator.serviceWorker.register('./water-offline-sw-ui3.js?v='+BUILD,{
      scope:'./',
      updateViaCache:'none'
    }).then(reg=>{
      try{reg.update();}catch(e){}
      if(reg.waiting){try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}}
    }).catch(()=>{});
  }

  // Mở giao diện ngay lập tức. Offline sẽ được Service Worker hiện hành phục vụ.
  location.replace(TARGET+(navigator.onLine?'&online=1&t='+Date.now():'&offline=1'));
})();
</script>
</body>
</html>
