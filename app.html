<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ghi số nước</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden}
body{visibility:hidden}
</style>
</head>
<body>
<script>
(async()=>{
  const BUILD='878-ui3e';
  const go=()=>location.replace('./v87-background.html?build='+BUILD+'&t='+Date.now());

  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(
        keys.filter(k=>k.startsWith('water-v878-offline-')).map(k=>caches.delete(k))
      );
    }

    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));

      const reg=await navigator.serviceWorker.register(
        './water-offline-sw-ui3.js?build='+BUILD+'&t='+Date.now(),
        {scope:'./',updateViaCache:'none'}
      );

      if(reg.installing){
        await new Promise(resolve=>{
          const w=reg.installing;
          const done=()=>{
            if(w.state==='activated'||w.state==='redundant')resolve();
          };
          w.addEventListener('statechange',done);
          done();
        });
      }

      if(reg.waiting){
        try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
      }

      await navigator.serviceWorker.ready;
    }

    go();
  }catch(err){
    console.error(err);
    go();
  }
})();
</script>
</body>
</html>
