<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Ghi số nước</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#boot{padding:24px;font-size:16px;line-height:1.5}
</style>
</head>
<body>
<div id="boot">Đang mở ứng dụng…</div>
<script>
(async()=>{
  const BUILD='879-core1';
  const SW='./water-offline-sw-ui3.js';
  const TARGET='./v87-background.html?build='+BUILD;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const go=()=>location.replace(TARGET);

  function getStatus(worker){
    return new Promise(resolve=>{
      try{
        const ch=new MessageChannel();
        const timer=setTimeout(()=>resolve(null),900);
        ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
        worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);
      }catch(e){resolve(null);}
    });
  }

  try{
    if(!('serviceWorker' in navigator)){
      go();
      return;
    }

    const controller=navigator.serviceWorker.controller;
    if(controller){
      const st=await getStatus(controller);
      if(st&&st.ready===true&&st.build===BUILD){
        if(navigator.onLine){
          navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'})
            .then(reg=>reg.update().catch(()=>{}))
            .catch(()=>{});
        }
        go();
        return;
      }
    }

    if(!navigator.onLine){
      go();
      return;
    }

    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}
    if(reg.waiting){try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}}

    const started=Date.now();
    while(Date.now()-started<5000){
      const worker=reg.active||reg.waiting||reg.installing||navigator.serviceWorker.controller;
      if(worker){
        const st=await getStatus(worker);
        if(st&&st.ready===true&&st.build===BUILD)break;
      }
      await wait(250);
    }
    go();
  }catch(err){
    console.error(err);
    go();
  }
})();
</script>
</body>
</html>
