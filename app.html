<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Ghi số nước</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#boot{padding:24px;font-size:16px;line-height:1.5}
</style>
</head>
<body>
<div id="boot">Đang mở ứng dụng…</div>
<script>
(async()=>{
  const BUILD='878-ui3i';
  const SW='./water-offline-sw-ui3.js';
  const TARGET='./v87-background.html?build='+BUILD;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const go=()=>location.replace(TARGET+(navigator.onLine?'&online=1&t='+Date.now():'&offline=1'));

  try{
    if(!('serviceWorker' in navigator)){
      go();
      return;
    }

    // Khi offline không thực hiện cập nhật. Service Worker đang có sẽ phục vụ
    // trang ứng dụng đã cache cho navigation tiếp theo.
    if(!navigator.onLine){
      go();
      return;
    }

    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}
    if(reg.waiting){
      try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
    }

    await Promise.race([
      navigator.serviceWorker.ready.catch(()=>null),
      wait(6000)
    ]);
    await wait(500);
    go();
  }catch(err){
    console.error(err);
    go();
  }
})();
</script>
</body>
</html>
