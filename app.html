<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ghi số nước</title>
<style>html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden}body{visibility:hidden}</style>
</head>
<body>
<script>
(async()=>{
  const BUILD='878-ui3e';
  const TARGET='./v87-background.html?build='+BUILD+'&t='+Date.now();
  const go=()=>location.replace(TARGET);
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

  // Fallback tuyệt đối: không để launcher treo trắng vô thời hạn.
  const hardFallback=setTimeout(go,6500);

  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('water-v878-offline-')).map(k=>caches.delete(k)));
    }

    if(!('serviceWorker' in navigator)){
      clearTimeout(hardFallback);
      go();
      return;
    }

    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));

    const reg=await navigator.serviceWorker.register(
      './water-offline-sw-ui3.js?build='+BUILD+'&t='+Date.now(),
      {scope:'./',updateViaCache:'none'}
    );

    if(reg.active){
      clearTimeout(hardFallback);
      go();
      return;
    }

    const worker=reg.installing||reg.waiting;
    if(worker){
      await Promise.race([
        new Promise(resolve=>{
          const done=()=>{
            if(worker.state==='activated'||worker.state==='redundant')resolve();
          };
          worker.addEventListener('statechange',done);
          done();
        }),
        wait(5000)
      ]);
    }else{
      await wait(1200);
    }

    if(reg.waiting){
      try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
      await wait(250);
    }

    clearTimeout(hardFallback);
    go();
  }catch(err){
    console.error(err);
    clearTimeout(hardFallback);
    go();
  }
})();
</script>
</body>
</html>
