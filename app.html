<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Ghi số nước</title>
<style>html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;text-align:center}#boot{padding:24px;font-size:16px;line-height:1.5}</style>
</head>
<body>
<div id="boot">Đang mở ứng dụng FAST6…</div>
<script>
(async()=>{
  const SW='./water-offline-sw.js?v=878-fast6-staff-ui-pass1';
  const TARGET='./v87-background.html?build=878-fast6-staff-ui-pass1';
  const EXPECT='878-fast6';
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const go=()=>location.replace(TARGET);
  function getStatus(worker){
    return new Promise(resolve=>{
      try{
        const ch=new MessageChannel();
        const timer=setTimeout(()=>resolve(null),900);
        ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
        worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);
      }catch(e){resolve(null);}
    });
  }
  try{
    if(!('serviceWorker' in navigator)){go();return;}
    if(!navigator.onLine){go();return;}
    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}
    const started=Date.now();
    while(Date.now()-started<10000){
      const candidates=[reg.installing,reg.waiting,reg.active,navigator.serviceWorker.controller].filter(Boolean);
      for(const w of candidates){
        const st=await getStatus(w);
        if(st&&st.ready===true&&st.build===EXPECT){go();return;}
      }
      await wait(250);
    }
    go();
  }catch(e){go();}
})();
</script>
</body>
</html>
