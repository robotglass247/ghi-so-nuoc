<script>

function byId(id){return document.getElementById(id)}

function setStatus(a,b){
  byId('statusMain').textContent=a||'';
  byId('statusSub').textContent=b||'';
}

function toast(msg,ms=1200){
  const el=byId('toast');
  el.textContent=msg;
  el.style.display='block';
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.display='none',ms);
}

function labelFromMeter(meter){
  const m=String(meter||'').trim().toUpperCase();
  const z=m.match(/^(.+?)-(.+?)-N\d+$/i);
  return z?z[1]+'.'+z[2]:m;
}

function normalizeMeterCode(meter){
  let m=String(meter||'').trim().toUpperCase();
  if(!m)return '';

  // Chuẩn mới toàn hệ thống: bỏ hậu tố -N01 / -Nxx.
  // QR cũ vẫn đọc được và được quy về mã ngắn.
  m=m.replace(/-N\d+$/i,'');

  return m;
}

function parseQR(raw){
  const text=String(raw||'').trim();
  if(!text)return null;

  const f={};
  text.split('|').forEach(p=>{
    const i=p.indexOf('=');
    if(i>0)f[p.slice(0,i).trim().toUpperCase()]=p.slice(i+1).trim();
  });

  // Hỗ trợ cả QR mới dạng ngắn:
  // M=P3-201|T=...
  // và QR cũ:
  // WATERQR|V=4|MADH=P3-201-N01|TOKEN=...
  let meter=normalizeMeterCode(f.MADH||f.M||'');
  let token=String(f.TOKEN||f.T||'').trim();

  if(meter&&token){
    return {meter,token,label:labelFromMeter(meter)};
  }

  // Giữ tương thích QR URL cũ.
  try{
    const u=new URL(text);
    meter=normalizeMeterCode(u.searchParams.get('m')||'');
    token=(u.searchParams.get('t')||'').trim();

    if(meter&&token){
      return {meter,token,label:labelFromMeter(meter)};
    }
  }catch(e){}

  const um=text.match(/(?:^|\|)URL=(https?:\/\/[^|\s]+)/i);
  if(um&&um[1]){
    try{
      const u=new URL(um[1]);
      meter=normalizeMeterCode(u.searchParams.get('m')||'');
      token=(u.searchParams.get('t')||'').trim();

      if(meter&&token){
        return {meter,token,label:labelFromMeter(meter)};
      }
    }catch(e){}
  }

  return null;
}


async function initDetector(){
  detector=null;

  if('BarcodeDetector' in window){
    try{
      const formats=await withCameraTimeout(
        BarcodeDetector.getSupportedFormats(),1500,
        'Bộ quét QR chưa phản hồi.');

      if(formats&&formats.includes('qr_code')){
        detector=new BarcodeDetector({formats:['qr_code']});
      }
    }catch(e){}
  }
}

function stopLiveScan(){
  if(liveScanTimer){
    clearTimeout(liveScanTimer);
    liveScanTimer=null;
  }
}

function qrKey(qr){
  if(!qr)return '';
  return String(qr.meter||'')+'|'+String(qr.token||'');
}

function resetLiveQR(){
  liveQR=null;
  lastQRKey='';
  lastQRAt=0;
  lastQRHits=0;
}

function acceptLiveQR(raw,source){
  const qr=parseQR(raw);
  if(!qr)return null;

  const now=Date.now();
  const key=qrKey(qr);

  if(key===lastQRKey && (now-lastQRAt)<1100){
    lastQRHits++;
  }else{
    lastQRKey=key;
    lastQRHits=1;
  }

  lastQRAt=now;

  liveQR={
    raw:String(raw||''),
    qr,
    key,
    at:now,
    hits:lastQRHits,
    source:source||''
  };

  // Hai lần đọc liên tiếp giúp tránh nhận nhầm nhưng vẫn rất nhanh.
  if(lastQRHits>=2){
    byId('debug').textContent=
      '✓ QR OK: '+qr.label+' · có thể CHỤP ngay';

    byId('statusSub').textContent=
      'QR đã nhận chính xác: '+qr.label+' · bấm CHỤP.';
  }

  return liveQR;
}

async function nativeReadValid(source){
  if(!detector)return null;

  try{
    const codes=await detector.detect(source);

    if(codes&&codes.length){
      for(const code of codes){
        const raw=String(code&&code.rawValue||'').trim();
        const qr=parseQR(raw);

        if(qr){
          return {raw,qr,source:'BarcodeDetector'};
        }
      }
    }
  }catch(e){}

  return null;
}

function scanCanvasFromSource(source,sx,sy,sw,sh,targetW,filter=''){
  const c=byId('scanCanvas');

  const sourceW=
    source.videoWidth||
    source.naturalWidth||
    source.width||
    1;

  const sourceH=
    source.videoHeight||
    source.naturalHeight||
    source.height||
    1;

  sx=Math.max(0,Math.min(sourceW-1,sx));
  sy=Math.max(0,Math.min(sourceH-1,sy));
  sw=Math.max(1,Math.min(sourceW-sx,sw));
  sh=Math.max(1,Math.min(sourceH-sy,sh));

  const scale=Math.min(2.2,Math.max(0.25,targetW/sw));

  c.width=Math.max(1,Math.round(sw*scale));
  c.height=Math.max(1,Math.round(sh*scale));

  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.save();

  if(filter)ctx.filter=filter;

  ctx.drawImage(
    source,
    Math.round(sx),
    Math.round(sy),
    Math.round(sw),
    Math.round(sh),
    0,
    0,
    c.width,
    c.height
  );

  ctx.restore();
  return c;
}

function jsQRValid(canvas,attemptBoth=false){
  if(typeof jsQR!=='function')return null;

  try{
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const img=ctx.getImageData(0,0,canvas.width,canvas.height);

    const code=jsQR(
      img.data,
      canvas.width,
      canvas.height,
      {
        inversionAttempts:
          attemptBoth ? 'attemptBoth' : 'dontInvert'
      }
    );

    if(!code||!code.data)return null;

    const raw=String(code.data||'').trim();
    const qr=parseQR(raw);

    if(!qr)return null;

    return {
      raw,
      qr,
      source:'jsQR',
      location:code.location||null
    };
  }catch(e){
    return null;
  }
}

function videoSize(source){
  return {
    w:source.videoWidth||source.width||1,
    h:source.videoHeight||source.height||1
  };
}

async function quickScanSource(source){
  // 1) Native detector: ưu tiên vì nhanh và chính xác nhất trên Chrome Android.
  let hit=await nativeReadValid(source);
  if(hit)return hit;

  const {w,h}=videoSize(source);

  // 2) jsQR toàn ảnh, hạ về ~900 px để quét nhanh.
  let c=scanCanvasFromSource(
    source,
    0,0,w,h,
    900,
    ''
  );

  hit=jsQRValid(c,false);
  if(hit)return hit;

  // 3) Mỗi vòng chỉ quét thêm 1 ô 2x2.
  // Như vậy QR nhỏ vẫn được phóng to nhưng không làm treo máy.
  const tiles=[
    [0,0,.58,.58],
    [.42,0,.58,.58],
    [0,.42,.58,.58],
    [.42,.42,.58,.58]
  ];

  const t=tiles[liveScanCycle%tiles.length];

  c=scanCanvasFromSource(
    source,
    w*t[0],
    h*t[1],
    w*t[2],
    h*t[3],
    820,
    ''
  );

  hit=jsQRValid(c,false);
  if(hit)return hit;

  return null;
}

async function robustScanCaptured(full){
  // Bước 1: native trực tiếp trên ảnh vừa chụp.
  let hit=await nativeReadValid(full);
  if(hit)return hit;

  const w=full.width;
  const h=full.height;

  // Bước 2: toàn ảnh ở độ phân giải hợp lý.
  let c=scanCanvasFromSource(
    full,
    0,0,w,h,
    1350,
    ''
  );

  hit=jsQRValid(c,false);
  if(hit)return hit;

  // Bước 3: toàn ảnh tăng tương phản nhẹ.
  c=scanCanvasFromSource(
    full,
    0,0,w,h,
    1250,
    'grayscale(1) contrast(1.45)'
  );

  hit=jsQRValid(c,false);
  if(hit)return hit;

  // Bước 4: 4 ô chồng nhau để QR nhỏ được phóng lớn.
  const tiles=[
    [0,0,.60,.60],
    [.40,0,.60,.60],
    [0,.40,.60,.60],
    [.40,.40,.60,.60]
  ];

  for(const t of tiles){
    c=scanCanvasFromSource(
      full,
      w*t[0],
      h*t[1],
      w*t[2],
      h*t[3],
      1050,
      ''
    );

    hit=jsQRValid(c,false);
    if(hit)return hit;
  }

  // Bước cuối cùng mới thử ảnh đảo màu để không làm chậm trường hợp bình thường.
  c=scanCanvasFromSource(
    full,
    0,0,w,h,
    1100,
    'grayscale(1) contrast(1.65)'
  );

  hit=jsQRValid(c,true);
  if(hit)return hit;

  return null;
}

function scheduleLiveScan(delayMs=170){
  stopLiveScan();

  liveScanTimer=setTimeout(async ()=>{
    if(!stream||shotRunning){
      scheduleLiveScan(220);
      return;
    }

    if(liveScanBusy){
      scheduleLiveScan(120);
      return;
    }

    const v=byId('video');

    if(!v||v.readyState<2||!v.videoWidth){
      scheduleLiveScan(180);
      return;
    }

    liveScanBusy=true;

    try{
      liveScanCycle++;

      const hit=await quickScanSource(v);

      if(hit){
        acceptLiveQR(hit.raw,hit.source);
      }else if(liveQR && (Date.now()-liveQR.at)>1300){
        // QR đã ra khỏi khung: bỏ trạng thái sẵn sàng cũ.
        resetLiveQR();

        byId('debug').textContent=
          'Đưa tem QR rõ vào khung · hệ thống đang quét tự động';

        byId('statusSub').textContent=
          'Để đồng hồ + QR rõ trong khung. Khi hiện QR OK thì bấm CHỤP.';
      }
    }catch(e){
    }finally{
      liveScanBusy=false;
      scheduleLiveScan(170);
    }
  },delayMs);
}

async function waitLiveScanIdle(maxMs=220){
  const t0=Date.now();

  while(liveScanBusy && (Date.now()-t0)<maxMs){
    await sleep(20);
  }
}

function withCameraTimeout(promise,ms,message,onLate){
  return new Promise((resolve,reject)=>{
    let finished=false;
    const timer=setTimeout(()=>{
      finished=true;
      const error=new Error(message);
      error.name='TimeoutError';
      reject(error);
    },ms);
    Promise.resolve(promise).then(value=>{
      if(finished){if(onLate)onLate(value);return;}
      finished=true;
      clearTimeout(timer);
      resolve(value);
    },error=>{
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      reject(error);
    });
  });
}

async function startCamera(){
  if(cameraStarting)return;
  const staff=getStaffCode();

  if(!staff){
    openStaff();
    return;
  }

  cameraStarting=true;
  let waitingForPlayback=false;
  byId('startBtn').disabled=true;
  byId('startBtn').textContent='ĐANG MỞ CAMERA…';
  try{
    stopLiveScan();
    if(stream && !stream.getVideoTracks().some(track=>track.readyState==='live')){
      stream.getTracks().forEach(track=>track.stop());
      stream=null;
    }
    setStatus('ĐANG KẾT NỐI CAMERA','Nếu Chrome hỏi quyền camera, hãy chọn Cho phép.');

    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error('Trình duyệt không hỗ trợ camera trực tiếp.');
    }

    // 1080p cho kết quả thực tế tốt hơn 4K:
    // nét nhanh hơn, FPS ổn định hơn và xử lý QR nhẹ hơn nhiều.
    const common={
      facingMode:{ideal:'environment'},
      width:{ideal:1920},
      height:{ideal:1080},
      frameRate:{ideal:30,max:30}
    };

    if(!stream)stream=await withCameraTimeout(
      navigator.mediaDevices.getUserMedia({video:common,audio:false}),
      15000,
      'Chrome chưa trả camera sau 15 giây. Kiểm tra quyền camera và đóng ứng dụng khác đang dùng camera, rồi thử lại.',
      lateStream=>lateStream.getTracks().forEach(track=>track.stop())
    );

    const v=byId('video');
    setStatus('ĐANG HIỂN THỊ CAMERA','Đã kết nối camera; đang chờ hình ảnh.');
    v.muted=true;
    v.playsInline=true;
    if(v.srcObject!==stream)v.srcObject=stream;
    waitingForPlayback=true;
    try{
      await withCameraTimeout(v.play(),6000,'Camera đã kết nối nhưng Chrome chưa phát hình. Bấm Bắt đầu để thử lại.');
    }catch(e){
      // Chrome có thể ngắt play() trong lúc nguồn video vừa được gắn.
      // Thử lại trên cùng nguồn, không mở thêm luồng camera.
      if(e.name!=='AbortError' || v.srcObject!==stream)throw e;
      await sleep(150);
      await withCameraTimeout(v.play(),4000,'Chrome vẫn chưa phát được hình camera. Bấm Bắt đầu để thử lại.');
    }
    waitingForPlayback=false;
    v.controls=false;

    try{
      const track=stream.getVideoTracks()[0];
      const caps=track.getCapabilities
        ? track.getCapabilities()
        : {};

      const adv={};

      if(
        Array.isArray(caps.focusMode) &&
        caps.focusMode.includes('continuous')
      ){
        adv.focusMode='continuous';
      }

      if(
        Array.isArray(caps.exposureMode) &&
        caps.exposureMode.includes('continuous')
      ){
        adv.exposureMode='continuous';
      }

      if(
        Array.isArray(caps.whiteBalanceMode) &&
        caps.whiteBalanceMode.includes('continuous')
      ){
        adv.whiteBalanceMode='continuous';
      }

      if(Object.keys(adv).length){
        await withCameraTimeout(track.applyConstraints({
          advanced:[adv]
        }),1000,'Camera chưa áp dụng chế độ lấy nét.');
      }
    }catch(e){}

    resetLiveQR();

    byId('startBtn').style.display='none';
    byId('shotBtn').style.display='block';

    setStatus(
      'SẴN SÀNG CHỤP',
      'Để đồng hồ + QR rõ trong khung. Khi hiện QR OK thì bấm CHỤP.'
    );

    byId('debug').textContent=
      detector
        ? 'Đang quét QR tự động · chế độ nhanh'
        : 'Đang quét QR tự động · chế độ tương thích';

    scheduleLiveScan(80);

  }catch(err){
    stopLiveScan();
    if(waitingForPlayback && stream && stream.getVideoTracks().some(track=>track.readyState==='live')){
      byId('startBtn').style.display='block';
      byId('shotBtn').style.display='none';
      byId('video').controls=true;
      setStatus('BẤM HIỂN THỊ CAMERA','Camera đã kết nối. Bấm nút bên dưới để Chrome phát hình.');
      return;
    }
    waitingForPlayback=false;
    if(stream){
      stream.getTracks().forEach(track=>track.stop());
      stream=null;
    }
    byId('video').srcObject=null;
    byId('startBtn').style.display='block';
    byId('shotBtn').style.display='none';
    setStatus(
      'KHÔNG MỞ ĐƯỢC CAMERA',
      String(err&&err.message?err.message:err)
    );

    alert(
      'Không mở được camera: '+
      (err&&err.message?err.message:err)
    );
  }finally{
    cameraStarting=false;
    byId('startBtn').disabled=false;
    byId('startBtn').textContent=waitingForPlayback?'HIỂN THỊ CAMERA':'BẮT ĐẦU GHI SỐ';
  }
}

function captureFrame(){
  const v=byId('video');
  const full=byId('shotCanvas');

  const scale=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));
  full.width=Math.round(v.videoWidth*scale);
  full.height=Math.round(v.videoHeight*scale);

  const ctx=full.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(v,0,0,full.width,full.height);

  return full;
}

async function captureQRFastAndAccurate(){
  stopLiveScan();

  // Chụp ảnh TRƯỚC, sau đó xác nhận QR.
  // Như vậy mã dùng để lưu gắn với đúng ảnh vừa chụp.
  const full=captureFrame();

  // Nếu QR nền vừa được xác nhận 2 lần liên tiếp,
  // chỉ cần kiểm tra nhanh trên chính ảnh vừa chụp.
  const cached=
    liveQR &&
    liveQR.hits>=2 &&
    (Date.now()-liveQR.at)<950
      ? liveQR
      : null;

  if(cached){
    // Native xác nhận lại thường chỉ mất rất ít thời gian.
    let hit=await nativeReadValid(full);

    if(hit && qrKey(hit.qr)===cached.key){
      return {full,raw:hit.raw,qr:hit.qr};
    }

    // Nếu native không đọc lại được vì đúng lúc ảnh rung,
    // dùng QR nền rất mới (<0,95 s) đã được đọc 2 lần liên tiếp.
    return {
      full,
      raw:cached.raw,
      qr:cached.qr
    };
  }

  // QR chưa sẵn sàng: tiếp tục quét nền, không giữ nút chụp
  // để chạy nhiều lượt xử lý ảnh có thể làm máy chậm.
  return {
    full,
    raw:'',
    qr:null
  };
}


function scheduleAutoSync(delayMs=650){
  if(!navigator.onLine || !db)return;

  clearTimeout(autoSyncTimer);

  autoSyncTimer=setTimeout(async ()=>{
    // Gửi ảnh đã lưu độc lập với việc chụp ảnh tiếp theo.
    await syncQueue({auto:true});
  },delayMs);
}

async function captureAndSave(){
  if(shotRunning)return;

  const staff=getStaffCode();
  if(!staff){
    openStaff();
    return;
  }

  const v=byId('video');
  if(!v.videoWidth||!v.videoHeight){
    alert('Camera chưa sẵn sàng.');
    return;
  }

  if(!liveQR || liveQR.hits<2 || Date.now()-liveQR.at>=950){
    toast('ĐỢI QR OK RỒI BẤM CHỤP',1400);
    return;
  }

  shotRunning=true;
  const captureStarted=performance.now();
  let choiceWaitMs=0;
  byId('shotBtn').disabled=true;

  try{
    setStatus(
      'ĐANG CHỤP...',
      'Đang xác nhận QR trên đúng ảnh vừa chụp.'
    );

    const shot=await captureQRFastAndAccurate();
    const full=shot.full;
    const qr=shot.qr;

    if(!qr){
      throw new Error(
        'Chưa nhận được QR hợp lệ. Giữ máy yên, tránh lóa và đưa QR rõ hơn trong khung.'
      );
    }

    const capturedAt=new Date().toISOString();
    const previous=readCaptureReceipt(qr.meter,capturedAt);
    let replaceClientId='';
    if(previous){
      const choiceStarted=performance.now();
      const replace=await askDuplicate(qr.meter,capturedAt);
      choiceWaitMs+=performance.now()-choiceStarted;
      if(!replace){
        setStatus('ĐÃ GIỮ ẢNH CŨ','Tiếp tục với đồng hồ tiếp theo.');
        resetLiveQR();
        scheduleLiveScan(120);
        return;
      }
      replaceClientId=String(previous.clientId||'').trim();
      if(!replaceClientId)throw new Error('Thiếu mã ảnh cũ. Ảnh thay thế chưa được lưu.');
    }

    setStatus('ĐÃ NHẬN '+qr.label,'Đang lưu ảnh đồng hồ...');

    // Khung chụp đã có đúng kích thước lưu; không vẽ lại lần thứ hai.
    const save=full;

    const blob=await new Promise((resolve,reject)=>{
      save.toBlob(b=>b?resolve(b):reject(new Error('Không tạo được ảnh.')),'image/jpeg',0.84);
    });

    const clientId=qr.meter+'_'+Date.now()+'_'+Math.random().toString(36).slice(2);

    const record={
      clientId,
      meter:normalizeMeterCode(qr.meter),
      token:qr.token,
      label:qr.label,
      staff,
      capturedAt,
      replaceClientId,
      sentAt:0,
      image:blob
    };
    await dbPut(record);
    byId('captureEvidence').textContent='V8.7.8 · '+(record.replaceClientId?'CHỤP THAY THẾ':'ẢNH MỚI')+' · '+record.meter+' · Mã gửi: '+record.clientId+(record.replaceClientId?' · Thay ảnh: '+record.replaceClientId:'');
    rememberCapture(record);

    await updatePending();
    const savedSeconds=(Math.max(0,performance.now()-captureStarted-choiceWaitMs)/1000).toFixed(1);
    toast('✓ '+qr.label+' - ĐÃ LƯU '+savedSeconds+' GIÂY',1800);
    setStatus('SẴN SÀNG ĐỒNG HỒ TIẾP THEO','Đưa đồng hồ + QR tiếp theo vào khung. Khi hiện QR OK thì bấm CHỤP.');

    // Luôn lưu local trước. ONLINE thì đồng bộ nền; OFFLINE giữ trong Chờ.
    lastCaptureAt=Date.now();

    resetLiveQR();
    scheduleLiveScan(120);

    if(navigator.onLine){
      byId('debug').textContent='ĐÃ LƯU · tự đồng bộ nền, tiếp tục chụp đồng hồ tiếp theo.';
      scheduleAutoSync(100);
    }else{
      byId('debug').textContent='OFFLINE · đã lưu an toàn trong Chờ.';
    }

  }catch(err){
    setStatus('CHƯA LƯU',''+(err&&err.message?err.message:err));
    alert(err&&err.message?err.message:err);

    resetLiveQR();
    scheduleLiveScan(120);
  }finally{
    shotRunning=false;
    byId('shotBtn').disabled=false;
  }
}

const captureReceipts=new Map();
let duplicateDialogChain=Promise.resolve();

function capturePeriod(date){
  const d=new Date(date);
  if(!Number.isFinite(d.getTime()))throw new Error('Thời gian chụp không hợp lệ.');
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',month:'2-digit',year:'numeric'}).formatToParts(d);
  return parts.find(p=>p.type==='month').value+'/'+parts.find(p=>p.type==='year').value;
}
function captureKey(meter,date){return 'water_capture_v86:'+normalizeMeterCode(meter)+':'+capturePeriod(date);}
function readCaptureReceipt(meter,date){
  const key=captureKey(meter,date);
  try{
    const saved=JSON.parse(localStorage.getItem(key)||'null');
    if(saved&&saved.clientId)return saved;
  }catch(e){}
  return captureReceipts.get(key)||null;
}
function rememberCapture(record){
  const key=captureKey(record.meter,record.capturedAt);
  const saved={clientId:record.clientId,capturedAt:record.capturedAt};
  captureReceipts.set(key,saved);
  try{localStorage.setItem(key,JSON.stringify(saved));}catch(e){}
}
function restoreQueuedReceipts(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('queue','readonly');
    const req=tx.objectStore('queue').openCursor();
    req.onsuccess=()=>{
      const cursor=req.result;
      if(!cursor)return;
      const item=cursor.value;
      try{
        const old=readCaptureReceipt(item.meter,item.capturedAt);
        if(!old||Date.parse(old.capturedAt)<Date.parse(item.capturedAt))rememberCapture(item);
      }catch(e){}
      cursor.continue();
    };
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}
function askDuplicate(meter,date){
  const result=duplicateDialogChain.then(()=>new Promise(resolve=>{
    byId('duplicateDetail').textContent=normalizeMeterCode(meter)+' đã có ảnh trong kỳ '+capturePeriod(date)+'. Chọn thay thế nếu ảnh vừa chụp rõ hơn. Ảnh mới sẽ thay ảnh cũ sau khi Google đọc hợp lệ; ảnh lỗi sẽ được giữ để kiểm tra.';
    byId('duplicateModal').style.display='flex';
    const finish=replace=>{
      byId('duplicateModal').style.display='none';
      byId('keepPhotoBtn').onclick=null;
      byId('replacePhotoBtn').onclick=null;
      resolve(replace);
    };
    byId('keepPhotoBtn').onclick=()=>finish(false);
    byId('replacePhotoBtn').onclick=()=>finish(true);
  }));
  duplicateDialogChain=result.catch(()=>{});
  return result;
}

  }catch(e){}

  if(Array.isArray(cached)&&cached.length){
    setStaffList(cached,'Cache');
    return;

  // Dự phòng hiện tại lấy theo sheet NHAN_SU_THUC_HIEN.

window.addEventListener('message',event=>{
  const d=event.data;
  if(d&&d.type==='WATER_STAFF_LIST'){
    setStaffList(d.staff,'Google iframe');
    return;
  }

  if(!d||d.type!=='WATER_UPLOAD_RESULT'||!awaitingUpload)return;
  let trustedOrigin=false;
  try{
    const origin=new URL(event.origin);
    trustedOrigin=event.origin===location.origin ||
      (origin.protocol==='https:' &&
       (origin.hostname==='script.google.com' ||
        origin.hostname.endsWith('-script.googleusercontent.com')));
  }catch(e){}
  if(!trustedOrigin)return;
  if(String(d.clientId||'')!==String(awaitingUpload.clientId||''))return;

  clearTimeout(awaitingUpload.timer);
  const ok=d.ok;
  const resolve=awaitingUpload.resolve;
  const reject=awaitingUpload.reject;
  awaitingUpload=null;

  if(ok===true)resolve(d);
  else reject(new Error(d.error||'Đồng bộ lỗi.'));
});

// Chủ sở hữu đã cho phép xóa ảnh test của mã đã bỏ ngày 08/09/2026.
// Giới hạn thời điểm để không xóa ảnh chụp mới trong tương lai.
function isApprovedOldTest(record){
  if(normalizeMeterCode(record.meter)!=='P3-3SH1')return false;
  const captured=Date.parse(record.capturedAt);
  return Number.isFinite(captured) && captured<=Date.parse('2026-09-08T16:38:10Z');
}

function removeApprovedOldTests(){
  return new Promise((resolve,reject)=>{
    let removed=0;
    const tx=db.transaction('queue','readwrite');
    const req=tx.objectStore('queue').openCursor();
    req.onsuccess=()=>{
      const cursor=req.result;
      if(!cursor)return;
      if(isApprovedOldTest(cursor.value)){
        cursor.delete();
        removed++;
      }
      cursor.continue();
    };
    tx.oncomplete=()=>resolve(removed);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error||new Error('Chưa dọn được ảnh test.'));
  });
}

function sleep(ms){

}

function checkServerBatch(clientIds,timeoutMs=15000,signal){
  return new Promise((resolve,reject)=>{
    const ids=(clientIds||[])
      .map(x=>String(x||'').trim())
      .filter(Boolean)
      .slice(0,50);

    if(!ids.length){
      resolve(new Set());
      return;
    }

    const cb=
      'waterBatch_'+
      Date.now()+'_'
      +Math.random().toString(36).slice(2);

    let done=false;
    const script=document.createElement('script');

    const cleanup=()=>{
      if(signal)signal.removeEventListener('abort',abort);
      try{delete window[cb]}catch(e){}
      if(script.parentNode)script.parentNode.removeChild(script);
    };
    const abort=()=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();
      reject(new Error('Đã kết thúc đối chiếu.'));
    };

    const timer=setTimeout(()=>{
      if(done)return;
      done=true;
      cleanup();
      reject(new Error('Máy chủ không trả kết quả đối chiếu.'));
    },timeoutMs);

    window[cb]=(data)=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();

      if(!data||data.ok!==true||!Array.isArray(data.synced)){
        reject(new Error('Kết quả đối chiếu không hợp lệ.'));
        return;
      }

      resolve(
        new Set(
          data.synced.map(x=>String(x||'').trim())
        )
      );
    };

    script.async=true;
    script.src=
      BACKEND_URL+
      '?api=batchstatus'+
      '&ids='+encodeURIComponent(ids.join('~'))+
      '&callback='+encodeURIComponent(cb)+
      '&_='+Date.now();

    script.onerror=()=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      cleanup();
      reject(new Error('Không gọi được API đối chiếu.'));
    };

    if(signal){
      if(signal.aborted){abort();return;}
      signal.addEventListener('abort',abort,{once:true});
    }
    document.head.appendChild(script);
  });
}

async function waitOneClientSynced(clientId,maxMs=70000){
  const started=Date.now();

  while(Date.now()-started<maxMs){
    try{
      const set=await checkServerBatch([clientId],12000);
      if(set.has(clientId))return true;
    }catch(e){}

    await sleep(1800);
  }

  return false;
}


async function waitClientSyncedFast(clientId,maxMs=40000,signal){
  const started=Date.now();
  let receivedReply=false;
  let lastError='';

  while(Date.now()-started<maxMs){
    if(signal&&signal.aborted)throw new Error('Đã kết thúc đối chiếu.');
    try{
      // Apps Script thực tế có thể cần 12-15 giây khi khởi động nguội.
      const set=await checkServerBatch([clientId],18000,signal);
      receivedReply=true;
      if(set.has(clientId))return true;
    }catch(e){
      if(signal&&signal.aborted)throw e;
      lastError=String(e&&e.message||e);
    }

    await sleep(900);
  }

  throw new Error(receivedReply
    ? 'Máy chủ trả lời nhưng chưa có bản ghi này trong nhật ký'
    : 'Không nhận được phản hồi đối chiếu: '+lastError);
}

      replaceClientId:item.replaceClientId||'',
    image:imageData
  };

  // Dùng biểu mẫu ẩn làm kênh chính. fetch(mode:'no-cors') chỉ trả về
  // opaque response nên có thể báo thành công dù Apps Script không nhận POST.
  // Lịch sử trên thiết bị này cho thấy POST biểu mẫu đã tới được máy chủ.
  postRecordByHiddenForm(values);
}


function postRecordAndWaitAck(item,imageData,timeoutMs=25000){
  return new Promise((resolve,reject)=>{
    // Chỉ xử lý 1 bản ghi mỗi lượt nên không để 2 ACK chồng nhau.
    if(awaitingUpload){
      reject(new Error('Đang chờ xác nhận bản ghi trước.'));
      return;
    }

    const frame=byId('uploadFrame');
    let frameLoadHandler=null;

    const cleanup=()=>{
      if(frameLoadHandler){
        frame.removeEventListener('load',frameLoadHandler);
      }
    };

    const timer=setTimeout(()=>{
      if(!awaitingUpload)return;

      const current=awaitingUpload;
      awaitingUpload=null;
      cleanup();

      current.reject(
        new Error('Máy chủ chưa gửi xác nhận về trình duyệt.')
      );
    },timeoutMs);

    awaitingUpload={
      clientId:item.clientId,
      timer,
      resolve:(data)=>{
        cleanup();
        resolve(data);
      },
      reject:(err)=>{
        cleanup();
        reject(err);
      }
    };

    // Fallback: nếu backend vẫn chuyển được sang ack.html thì cũng nhận.
    frameLoadHandler=()=>{
      try{
        const href=frame.contentWindow.location.href;
        const u=new URL(href);

        if(
          u.pathname.endsWith('/ghi-so-nuoc/ack.html') &&
          u.searchParams.get('ok')==='1' &&
          u.searchParams.get('clientId')===item.clientId
        ){
          if(awaitingUpload &&
             String(awaitingUpload.clientId)===String(item.clientId)){
            clearTimeout(awaitingUpload.timer);
            const r=awaitingUpload.resolve;
            awaitingUpload=null;
            cleanup();
            r({ok:true,clientId:item.clientId,via:'ack-page'});
          }
        }
      }catch(e){}
    };

    frame.addEventListener('load',frameLoadHandler);

    const form=document.createElement('form');
    form.method='POST';
    form.action=BACKEND_URL;
    form.target='uploadFrame';
    form.style.display='none';

    const values={
      clientId:item.clientId,
      meter:normalizeMeterCode(item.meter),
      token:item.token,
      staff:item.staff,
      capturedAt:item.capturedAt,
      replaceClientId:item.replaceClientId||'',
      image:imageData
    };



    Object.keys(values).forEach(k=>{
      const input=document.createElement('textarea');
      input.name=k;
      input.value=values[k]==null?'':String(values[k]);
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();

    setTimeout(()=>{
      try{form.remove()}catch(e){}
    },60000);
  });
}


async function uploadAndConfirm(item,data){
  const controller=new AbortController();
  let statusTimer;
  const ack=postRecordAndWaitAck(item,data,20000).then(result=>{
    if(!result||result.ok!==true)throw new Error('Chưa xác nhận lưu ảnh.');
    return true;
  });
  const status=new Promise((resolve,reject)=>{
    statusTimer=setTimeout(()=>{
      waitClientSyncedFast(item.clientId,40000,controller.signal).then(resolve,reject);
    },3000);
  });
  try{
    return await Promise.any([ack,status]);
  }catch(e){
    throw new Error('Chưa nhận xác nhận lưu từ máy chủ. Ảnh vẫn trong hàng chờ.');
  }finally{
    clearTimeout(statusTimer);
    controller.abort();
    if(awaitingUpload&&awaitingUpload.clientId===item.clientId){
      const pending=awaitingUpload;
      awaitingUpload=null;
      clearTimeout(pending.timer);
      pending.reject(new Error('Đã kết thúc lượt gửi.'));
    }
  }
}

const TURBO_LANES=2;
const TURBO_BATCH_SIZE=5;
const TURBO_MAX_BATCH_DATA_CHARS=7000000;
const TURBO_ACK_TIMEOUT_MS=90000;
const turboActiveRequests=new Map();

function turboTrustedMessageOrigin(origin){
  try{
    const u=new URL(origin);
    return u.protocol==='https:' &&
      (u.hostname==='script.google.com' ||
       u.hostname.endsWith('-script.googleusercontent.com'));
  }catch(e){
    return false;
  }
}

window.addEventListener('message',event=>{
  const d=event.data;
  if(!d||d.type!=='WATER_TURBO_UPLOAD_RESULT')return;
  if(!turboTrustedMessageOrigin(event.origin))return;

  const requestId=String(d.requestId||'');
  const current=turboActiveRequests.get(requestId);
  if(!current)return;

  turboActiveRequests.delete(requestId);
  clearTimeout(current.timer);
  try{current.frame.remove()}catch(e){}

  if(d.ok===true)current.resolve(d);
  else current.reject(new Error(d.error||'Turbo backend lỗi.'));
});

function turboSendBatch(payload,lane){
  return new Promise((resolve,reject)=>{
    const requestId='ta'+Date.now()+'_'+lane+'_'+Math.random().toString(36).slice(2);
    const frameName='waterTurboAppFrame_'+requestId;

    const frame=document.createElement('iframe');
    frame.name=frameName;
    frame.title='speed3 lane '+lane;
    frame.style.display='none';
    document.body.appendChild(frame);

    const timer=setTimeout(()=>{
      const current=turboActiveRequests.get(requestId);
      if(!current)return;
      turboActiveRequests.delete(requestId);
      try{frame.remove()}catch(e){}
      reject(new Error('Lane '+(lane+1)+' chưa ACK sau 90 giây.'));
    },TURBO_ACK_TIMEOUT_MS);

    turboActiveRequests.set(requestId,{timer,frame,resolve,reject});

    const form=document.createElement('form');
    form.method='POST';
    form.action=BACKEND_URL;
    form.target=frameName;
    form.style.display='none';

    const fields={
      api:'batchuploadturbo',
      requestId,
      batch:JSON.stringify(payload)
    };

    Object.keys(fields).forEach(k=>{
      const input=document.createElement('textarea');
      input.name=k;
      input.value=fields[k];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    setTimeout(()=>{try{form.remove()}catch(e){}},TURBO_ACK_TIMEOUT_MS);
  });
}

async function turboBuildPayload(records){
  const dataList=await Promise.all(
    records.map(item=>blobToDataURL(item.image))
  );

  const payload=[];
  let totalChars=0;

  for(let i=0;i<records.length;i++){
    const item=records[i];
    const data=String(dataList[i]||'');
    const nextChars=data.length;

    if(payload.length && totalChars+nextChars>TURBO_MAX_BATCH_DATA_CHARS)break;

    payload.push({
      clientId:String(item.clientId||''),
      meter:String(item.meter||''),
      token:String(item.token||''),
      staff:String(item.staff||''),
      capturedAt:item.capturedAt,
      replaceClientId:String(item.replaceClientId||''),
      image:data
    });

    totalChars+=nextChars;
    if(payload.length>=TURBO_BATCH_SIZE)break;
  }

  return payload;
}

async function syncQueue(options={}){
  const manualMode=!!(options&&options.manual);

  if(!db){
    byId('syncStatus').textContent='Chưa mở được bộ nhớ ảnh. Không xóa dữ liệu trình duyệt.';
    return;
  }

  if(syncRunning){
    syncRequested=true;
    if(manualMode){
      manualSyncRequested=true;
      byId('syncStatus').textContent='SPEED3 đang đồng bộ ('+Math.round((Date.now()-syncStartedAt)/1000)+' giây). Đã nhận yêu cầu kiểm tra lại.';
    }
    return;
  }

  clearTimeout(autoSyncTimer);

  if(!navigator.onLine){
    byId('syncStatus').textContent='OFFLINE · dữ liệu đang nằm an toàn trong Chờ.';
    return;
  }

  syncRequested=false;
  syncRunning=true;
  syncStartedAt=Date.now();
  byId('syncBtn').textContent='ĐANG ĐỒNG BỘ…';

  const started=performance.now();
  let sent=0;
  let waves=0;

  try{
    const initial=await dbCount();
    if(!initial){
      await updatePending();
      byId('syncStatus').textContent='✓ SPEED3 · ĐÃ GỬI HẾT ẢNH';
      return;
    }

    while(navigator.onLine){
      const remaining=await dbCount();
      if(!remaining)break;

      const rows=await dbAll(TURBO_LANES*TURBO_BATCH_SIZE);
      if(!rows.length)break;

      const laneRecords=[];
      for(let lane=0;lane<TURBO_LANES;lane++){
        const chunk=rows.slice(lane*TURBO_BATCH_SIZE,(lane+1)*TURBO_BATCH_SIZE);
        if(chunk.length)laneRecords.push({lane,chunk});
      }

      const built=await Promise.all(
        laneRecords.map(async x=>({lane:x.lane,payload:await turboBuildPayload(x.chunk)}))
      );
      const ready=built.filter(x=>x.payload.length);
      if(!ready.length)throw new Error('Không tạo được dữ liệu SPEED3.');

      waves++;
      byId('syncStatus').textContent=
        'SPEED3 TURBO · wave '+waves+
        ' · '+ready.reduce((n,x)=>n+x.payload.length,0)+' ảnh'+
        ' · còn '+remaining+' trong Chờ…';

      const settled=await Promise.allSettled(
        ready.map(x=>turboSendBatch(x.payload,x.lane))
      );

      const errors=[];
      let ackThisWave=0;

      for(const s of settled){
        if(s.status==='rejected'){
          errors.push(String(s.reason&&s.reason.message||s.reason));
          continue;
        }

        const result=s.value;
        const results=Array.isArray(result.results)?result.results:[];

        for(const r of results){
          if(r&&r.ok===true&&r.clientId){
            await dbDelete(String(r.clientId));
            ackThisWave++;
            sent++;
          }else if(r){
            errors.push(String(r.clientId||'?')+': '+String(r.error||'Không rõ lỗi'));
          }
        }
      }

      await updatePending();

      if(!ackThisWave){
        throw new Error(errors[0]||'SPEED3 không xác nhận ảnh nào.');
      }
      if(errors.length){
        throw new Error('Đã nhận '+ackThisWave+' ảnh; ảnh chưa ACK vẫn giữ trong Chờ. '+errors[0]);
      }

      // Nhường giao diện/camera một nhịp trước wave tiếp theo.
      await sleep(60);
    }

    const remaining=await dbCount();
    await updatePending();

    if(!remaining){
      const seconds=(performance.now()-started)/1000;
      const rate=sent?seconds/sent:0;
      byId('syncStatus').textContent=
        '✓ SPEED3 ĐÃ GỬI HẾT '+sent+' ẢNH · '+seconds.toFixed(1)+' giây · '+
        (rate?rate.toFixed(2)+' giây/ảnh':'Chờ = 0');
    }else{
      byId('syncStatus').textContent='SPEED3 tạm dừng · còn '+remaining+' ảnh an toàn trong Chờ.';
      if(navigator.onLine)scheduleAutoSync(1500);
    }

  }catch(e){
    await updatePending();
    byId('syncStatus').textContent='Lỗi SPEED3: '+String(e&&e.message||e)+'. Ảnh vẫn giữ trong Chờ.';
    if(navigator.onLine)scheduleAutoSync(3000);
  }finally{
    syncRunning=false;
    byId('syncBtn').textContent='ĐỒNG BỘ NGAY';
    if(manualSyncRequested){
      manualSyncRequested=false;
      clearTimeout(autoSyncTimer);
      autoSyncTimer=setTimeout(()=>syncQueue({manual:true}),450);
    }else if(syncRequested){
      syncRequested=false;
      scheduleAutoSync(100);
    }
  }
}

        const channel=new MessageChannel();

          clearTimeout(guideTimer);
          guideHold=false;
          showGuide('NHẤN ĐỂ CHỤP','2. QR + mặt số đã nhận. Nhấn CHỤP.');
        }
      }catch(e){}
      return result;
    };

    window.acceptLiveQR=acceptLiveQRUI3C;
    try{acceptLiveQR=acceptLiveQRUI3C;}catch(e){}
  }

  // Base camera có vài chỗ ghi trực tiếp statusSub, không đi qua setStatus.
  // Observer này chỉ sửa câu chữ hiển thị, không can thiệp QR/camera.
  const statusSub=el('statusSub');
  if(statusSub&&window.MutationObserver){
    new MutationObserver(function(){
      if(guideWriting)return;

      if(guideHold){
        showGuide('ĐÃ LƯU ẢNH','3. Ảnh đã lưu an toàn.');
        return;
      }

      const t=String(statusSub.textContent||'');
      if(t.indexOf('QR đã nhận chính xác:')>=0 ||
         t.indexOf('có thể CHỤP')>=0){
        showGuide('NHẤN ĐỂ CHỤP','2. QR + mặt số đã nhận. Nhấn CHỤP.');
        return;
      }

      if(t.indexOf('Để đồng hồ + QR rõ trong khung')>=0 ||
         t.indexOf('Đưa tem QR rõ vào khung')>=0){
        showReadyGuide();
      }
    }).observe(statusSub,{childList:true,characterData:true,subtree:true});
  }

  // Trạng thái đầu tiên khi mở ứng dụng.
  showGuide('SẴN SÀNG CHỤP','1. Đưa mặt đồng hồ + QR hiện rõ trong khung ảnh.');

  /* ================================================================
   * NHÂN SỰ + TIẾN ĐỘ QUA POST BRIDGE
   * ================================================================ */
  let bridgeFrame=null;
  let bridgeTimer=null;
  let bridgeSeq=0;
  let expectedRequestId='';

  function cleanupBridge(){
    clearTimeout(bridgeTimer);
    bridgeTimer=null;
    if(bridgeFrame){
      try{bridgeFrame.remove();}catch(e){}
      bridgeFrame=null;
    }
  }

  function hiddenInput(form,name,value){
    const i=document.createElement('input');
    i.type='hidden';
    i.name=name;
    i.value=String(value==null?'':value);
    form.appendChild(i);
  }

  function submitUiState(reason){
    if(!navigator.onLine){
      renderCachedProgress();
      return;
    }

    const seq=++bridgeSeq;
    cleanupBridge();

    const requestId='u'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
    expectedRequestId=requestId;

    const frame=document.createElement('iframe');
    const frameName='waterUiBridge_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    frame.name=frameName;
    frame.id=frameName;
    frame.style.display='none';
    frame.setAttribute('aria-hidden','true');
    document.body.appendChild(frame);
    bridgeFrame=frame;

    const form=document.createElement('form');
    form.method='POST';
    form.action=BACKEND;
    form.target=frameName;
    form.style.display='none';

    hiddenInput(form,'api','uistate');
    hiddenInput(form,'period',periodNow());
    hiddenInput(form,'requestId',requestId);
    hiddenInput(form,'reason',reason||'auto');

    document.body.appendChild(form);
    setActivity('Đang cập nhật nhân sự…');

    try{
      form.submit();
    }catch(err){
      try{form.remove();}catch(e){}
      cleanupBridge();
      setActivity('Không cập nhật được nhân sự. Ảnh vẫn được giữ an toàn.');
      return;
    }

    setTimeout(function(){try{form.remove();}catch(e){}},200);

    bridgeTimer=setTimeout(function(){
      if(seq!==bridgeSeq||expectedRequestId!==requestId)return;
      expectedRequestId='';
      cleanupBridge();
      renderCachedProgress();
      setActivity('Chưa nhận được dữ liệu mới từ Apps Script.');
    },20000);
  }

  function applyStaff(list){
    if(!Array.isArray(list)||!list.length)return false;

    try{
      if(typeof setStaffList==='function'){
        setStaffList(list,'POST bridge');
      }else if(typeof staffList!=='undefined'){
        staffList=list;
      }
    }catch(e){
      try{if(typeof staffList!=='undefined')staffList=list;}catch(_){}
    }

    try{if(typeof staffPrimaryLoaded!=='undefined')staffPrimaryLoaded=true;}catch(e){}
    try{if(typeof renderStaff==='function')renderStaff();}catch(e){}
    try{if(typeof updateStaffName==='function')updateStaffName();}catch(e){}
    return true;
  }

  window.addEventListener('message',function(event){
    const d=event&&event.data;
    if(!d||typeof d!=='object'||d.type!=='WATER_UI_STATE')return;
    if(!d.requestId||d.requestId!==expectedRequestId)return;

    const staffOk=applyStaff(d.staff);
    const progressOk=renderProgress(d.progress);

    expectedRequestId='';
    cleanupBridge();

    if(staffOk&&progressOk){
      setActivity('✓ Đã cập nhật '+d.staff.length+' nhân sự · kỳ '+displayPeriod(d.progress.period||periodNow()));
    }else if(staffOk){
      setActivity('✓ Đã cập nhật '+d.staff.length+' nhân sự.');
    }else if(progressOk){
      setActivity('✓ Đã cập nhật tiến độ ghi số.');
    }else{
      setActivity('Dữ liệu phản hồi chưa hợp lệ.');
    }
  });

  function loadStaffUI3(force){
    try{if(typeof staffLoadTimer!=='undefined')clearTimeout(staffLoadTimer);}catch(e){}

    try{
      if(typeof staffList!=='undefined'&&!staffList.length&&typeof loadLocalStaffFirst==='function'){
        loadLocalStaffFirst();
      }
      if(typeof renderStaff==='function')renderStaff();
      if(typeof updateStaffName==='function')updateStaffName();
    }catch(e){}

    if(force)setActivity('Đang cập nhật nhân sự…');
    submitUiState(force?'staff_manual':'staff_auto');
  }

  try{loadStaff=loadStaffUI3;}catch(e){}
  window.loadStaff=loadStaffUI3;
  window.loadWaterProgress=function(){submitUiState('progress');};
  window.loadWaterUiState=submitUiState;

  try{if(typeof staffLoadTimer!=='undefined')clearTimeout(staffLoadTimer);}catch(e){}

  renderCachedProgress();
  setTimeout(function(){submitUiState('startup');},800);
  setInterval(function(){submitUiState('interval');},30000);

  window.addEventListener('online',function(){
    setTimeout(function(){submitUiState('online');},600);
  });

  window.addEventListener('pageshow',function(){
    setTimeout(function(){submitUiState('pageshow');},900);
  });

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){
      setTimeout(function(){submitUiState('visible');},700);
    }
  });

  const sync=el('syncBtn');
  if(sync)sync.addEventListener('click',function(){
    setTimeout(function(){submitUiState('after_sync');},3500);
    setTimeout(function(){submitUiState('after_sync_2');},9000);
  });

  const shot=el('shotBtn');
  if(shot)shot.addEventListener('click',function(){
    setTimeout(function(){submitUiState('after_shot');},3500);
    setTimeout(function(){submitUiState('after_shot_2');},9000);
  });

  // Nếu các dòng phụ được tạo động sau khi UI3C chạy, ẩn chúng ngay.
  if(window.MutationObserver){
    new MutationObserver(function(){
      ['debug','captureEvidence','offlineReady'].forEach(function(id){
        const node=el(id);
        if(node)node.style.display='none';
      });
      document.querySelectorAll('.bottom > div').forEach(function(node){
        if(String(node.textContent||'').trim()==='TRẠNG THÁI THỰC HIỆN')node.style.display='none';
      });
    }).observe(document.body,{childList:true,subtree:true});
  }
})();

  function data(){

    }catch(e){}
    try{return String(localStorage.getItem('water_staff')||'').trim().toUpperCase();}catch(e){return '';}
  }

  function ensureList(){
    addStyle();
    const sel=document.getElementById('staffSelect');
    if(!sel)return null;

      list=document.createElement('div');
      list.id=LIST_ID;
      list.setAttribute('role','listbox');
      sel.insertAdjacentElement('afterend',list);
    }
    return list;
  }

  function measure(text,font){
    const c=document.createElement('canvas');
    const ctx=c.getContext('2d');
    ctx.font=font||'16px Arial';
    return ctx.measureText(String(text||'')).width;
  }

  function fitCompactStaff(){
    const list=ensureList();
    if(!list)return;
    const rows=data();
    let longest=0;
    rows.forEach(x=>{longest=Math.max(longest,measure(String(x.ten||'').trim(),'16px Arial'));});
    const nameWidth=Math.ceil(longest+16+5+18);
    const maxList=Math.max(180,window.innerWidth-56);
    const listWidth=Math.min(Math.max(nameWidth,180),maxList);
    list.style.width=listWidth+'px';

    const title=document.querySelector('#staffModal .modalTitle');
    const titleWidth=title?Math.ceil(measure(title.textContent||'','700 16px Arial')+8):0;
    const modal=document.querySelector('#staffModal .modalIn');
    if(modal){
      const modalWidth=Math.min(Math.max(listWidth+28,titleWidth+28),window.innerWidth-24);
      modal.style.width=modalWidth+'px';
    }

    sel.innerHTML='<option value="">-- Chọn nhân sự --</option>';

      op.value=String(x.ma||'').trim().toUpperCase();
      op.textContent=String(x.ten||'').trim();
      sel.appendChild(op);

    list.innerHTML='';

      const empty=document.createElement('div');
      empty.textContent='Đang tải danh sách nhân sự...';

        const ten=String(x.ten||'').trim();
        const b=document.createElement('button');
        b.type='button';
        b.className='staffCompactItem'+(ma===old?' isSelected':'');
        b.dataset.ma=ma;
        b.setAttribute('role','option');
        b.setAttribute('aria-selected',ma===old?'true':'false');

        const check=document.createElement('span');
        check.className='staffCompactCheck';
        check.textContent=ma===old?'✓':'';
        const name=document.createElement('span');
        name.className='staffCompactName';
        name.textContent=ten;
        b.append(check,name);

        b.addEventListener('click',()=>{
          sel.value=ma;
          list.querySelectorAll('.staffCompactItem').forEach(node=>{
            const on=node.dataset.ma===ma;
            node.classList.toggle('isSelected',on);
            node.setAttribute('aria-selected',on?'true':'false');
            const c=node.querySelector('.staffCompactCheck');
            if(c)c.textContent=on?'✓':'';
          });
        });
        list.appendChild(b);
      });
    }
    requestAnimationFrame(fitCompactStaff);
  }

  addStyle();
  window.renderStaff=renderCompactStaff;
  window.fitStaffSelectSize=fitCompactStaff;
  try{renderStaff=renderCompactStaff;}catch(e){}
  try{fitStaffSelectSize=fitCompactStaff;}catch(e){}
  window.addEventListener('resize',()=>requestAnimationFrame(fitCompactStaff));
  setTimeout(renderCompactStaff,0);
})();

<script>
(function(){
  'use strict';

  function el(id){return document.getElementById(id);}
  function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

  let startPromise=null;

  function streamIsLive(s){
    try{return !!(s&&s.getVideoTracks().some(t=>t.readyState==='live'));}catch(e){return false;}
  }

  function stopStream(s){
    try{if(s)s.getTracks().forEach(t=>t.stop());}catch(e){}
  }

  function cameraBusyError(err){
    const name=String(err&&err.name||'');
    const msg=String(err&&err.message||err||'').toLowerCase();
    return name==='NotReadableError' ||
      msg.includes('could not start video source') ||
      msg.includes('could not start video') ||
      msg.includes('device in use') ||
      msg.includes('track start');
  }

  function withTimeout(promise,ms,message,onLate){
    return new Promise((resolve,reject)=>{
      let finished=false;
      const timer=setTimeout(()=>{
        finished=true;
        const e=new Error(message);
        e.name='TimeoutError';
        reject(e);
      },ms);
      Promise.resolve(promise).then(value=>{
        if(finished){try{if(onLate)onLate(value);}catch(e){};return;}
        finished=true;
        clearTimeout(timer);
        resolve(value);
      },err=>{
        if(finished)return;
        finished=true;
        clearTimeout(timer);
        reject(err);
      });
    });
  }

  async function requestRearCamera(v){
    if(streamIsLive(stream))return stream;

    try{
      if(v&&v.srcObject&&v.srcObject!==stream){
        stopStream(v.srcObject);
        v.srcObject=null;
      }
    }catch(e){}

    try{
      return await withTimeout(
        navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:{ideal:'environment'},
            width:{ideal:1280},
            height:{ideal:720}
          },
          audio:false
        }),
        7000,
        'Camera phản hồi chậm.',
        stopStream
      );
    }catch(err){
      if(!cameraBusyError(err))throw err;

      stopStream(stream);
      stream=null;
      try{if(v){stopStream(v.srcObject);v.srcObject=null;}}catch(e){}
      await wait(450);

      return await withTimeout(
        navigator.mediaDevices.getUserMedia({
          video:{facingMode:{ideal:'environment'}},
          audio:false
        }),
        7000,
        'Camera vẫn đang bận hoặc chưa sẵn sàng.',
        stopStream
      );
    }
  }

  async function startInternal(){
    const staff=(typeof getStaffCode==='function')?getStaffCode():'';
    if(!staff){
      if(typeof openStaff==='function')openStaff();
      return;
    }

    const startBtn=el('startBtn');
    const shotBtn=el('shotBtn');
    const v=el('video');

    if(startBtn)startBtn.style.display='none';
    if(shotBtn){shotBtn.style.display='flex';shotBtn.disabled=true;}

    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error('Trình duyệt không hỗ trợ camera trực tiếp.');
    }

    if(typeof stopLiveScan==='function')stopLiveScan();

    stream=await requestRearCamera(v);

    v.muted=true;
    v.playsInline=true;
    v.controls=false;
    if(v.srcObject!==stream)v.srcObject=stream;

    try{
      await withTimeout(v.play(),2600,'Camera đã kết nối nhưng chưa phát hình.');
    }catch(err){
      if(err&&err.name==='AbortError'){
        await wait(100);
        await withTimeout(v.play(),1800,'Camera đã kết nối nhưng chưa phát hình.');
      }else{
        throw err;
      }
    }

    const t0=Date.now();
    while((!v.videoWidth||!v.videoHeight) && Date.now()-t0<1600){
      await wait(40);
    }
    if(!v.videoWidth||!v.videoHeight){
      throw new Error('Camera chưa trả khung hình đầu tiên.');
    }

    if(typeof resetLiveQR==='function')resetLiveQR();
    if(typeof setStatus==='function')setStatus('SẴN SÀNG CHỤP','Đưa đồng hồ + QR rõ trong khung.');
    if(shotBtn)shotBtn.disabled=false;
    if(typeof scheduleLiveScan==='function')scheduleLiveScan(50);

    setTimeout(()=>{
      try{
        const track=stream&&stream.getVideoTracks()[0];
        if(!track||!track.getCapabilities||!track.applyConstraints)return;
        const caps=track.getCapabilities()||{};
        const adv={};
        if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))adv.focusMode='continuous';
        if(Array.isArray(caps.exposureMode)&&caps.exposureMode.includes('continuous'))adv.exposureMode='continuous';
        if(Array.isArray(caps.whiteBalanceMode)&&caps.whiteBalanceMode.includes('continuous'))adv.whiteBalanceMode='continuous';
        if(Object.keys(adv).length)track.applyConstraints({advanced:[adv]}).catch(()=>{});
      }catch(e){}
    },150);
  }

  function startCameraSafe(){
    if(startPromise)return startPromise;
    if(typeof cameraStarting!=='undefined'&&cameraStarting)return Promise.resolve();

    cameraStarting=true;
    startPromise=Promise.resolve().then(startInternal).catch(err=>{
      if(typeof stopLiveScan==='function')stopLiveScan();
      try{
        if(!streamIsLive(stream)){
          stopStream(stream);
          stream=null;
          const v=el('video');
          if(v)v.srcObject=null;
        }
      }catch(e){}
      const shotBtn=el('shotBtn');
      if(shotBtn)shotBtn.disabled=true;
      if(typeof setStatus==='function')setStatus('CAMERA CHƯA SẴN SÀNG',String(err&&err.message?err.message:err));
      alert('Không mở được camera: '+String(err&&err.message?err.message:err));
    }).finally(()=>{
      cameraStarting=false;
      startPromise=null;
    });
    return startPromise;
  }

  window.startCamera=startCameraSafe;
  try{startCamera=startCameraSafe;}catch(e){}
  window.WATER_CAMERA_FAST_BUILD='879-final7-camera-lock';
})();

</script>

        <div class="waterAdjacentQuestion">Bạn có muốn lưu thay thế không?</div>

        </div>
      </div>`;
    document.body.appendChild(adjacentModal);
    const adjacentYes=el('adjacentSaveYes');
    const adjacentNo=el('adjacentSaveNo');

    function ensureButtonLayout(){
      let title=shotBtn.querySelector('.waterShotTitle');
      let sub=shotBtn.querySelector('.waterShotSub');
      if(!title||!sub){
        shotBtn.textContent='';
        title=document.createElement('span');
        title.className='waterShotTitle';
        sub=document.createElement('span');
        sub.className='waterShotSub';
        shotBtn.appendChild(title);
        shotBtn.appendChild(sub);
      }
      return {title,sub};
    }

    function closeAdjacentModal(){
      adjacentPromptOpen=false;

    function showAdjacentModal(meter){
      const m=formatApartmentCode(meter);
      if(!m||adjacentPromptOpen)return;
      adjacentPromptMeter=m;
      adjacentPromptOpen=true;

      // askDuplicate() của lõi đã mở hộp trùng ảnh và gắn onclick cho 2 nút.

      adjacentModal.style.display='flex';

    function markHandled(meter,fromSavedPhoto){
      const m=formatApartmentCode(meter);

      hasHandledMeter=true;

      if(fromSavedPhoto){
        suppressSameMeter='';
        readyNextAfterNo=false;
        adjacentPromptMeter='';
        closeAdjacentModal();
      }
    }

    function readSavedEvidence(){
      const evidence=el('captureEvidence');
      if(!evidence)return;
      const txt=String(evidence.textContent||'').trim();
      if(!txt||txt===lastEvidenceText)return;
      lastEvidenceText=txt;
      const m=txt.match(/(?:ẢNH MỚI|CHỤP THAY THẾ)\s*·\s*([^·]+?)\s*·\s*Mã gửi:/i);
      if(m&&m[1])markHandled(m[1],true);

    function duplicateMeter(){
      if(!duplicateDetail)return '';
      const txt=String(duplicateDetail.textContent||'').trim();
      const m=txt.match(/^\s*([^\s]+)\s+đã có ảnh/i);
      return m&&m[1]?formatApartmentCode(m[1]):'';

    function duplicateIsOpen(){
      if(!duplicateModal)return false;

    function maybeInterceptAdjacentDuplicate(){
      if(adjacentPromptOpen || !duplicateIsOpen() || !hasHandledMeter || !lastHandledMeter)return;
      const meter=duplicateMeter()||currentMeter();
      if(!meter || meter!==lastHandledMeter)return;

      // Đây đúng là ảnh vừa bấm chụp lại của đồng hồ liền kề.
      showAdjacentModal(meter);

    if(keepPhotoBtn){

          markHandled(meter,false);
          suppressSameMeter=meter;
          readyNextAfterNo=true;

    adjacentYes.addEventListener('click',function(){
      const meter=formatApartmentCode(adjacentPromptMeter||duplicateMeter()||lastHandledMeter);

      // CÓ = tự động chọn THAY THẾ ẢNH CŨ trên Promise askDuplicate()
      // và tiếp tục lưu chính ảnh vừa chụp, không bắt nhân viên bấm thêm.
      suppressSameMeter='';
      readyNextAfterNo=false;

        try{replacePhotoBtn.click();}catch(e){}

      const meter=formatApartmentCode(adjacentPromptMeter||duplicateMeter()||lastHandledMeter);

      if(meter){
        suppressSameMeter=meter;
        readyNextAfterNo=true;
      }
      adjacentPromptMeter='';

      // KHÔNG = tự động chọn GIỮ ẢNH CŨ trên Promise askDuplicate().
      // Lõi sẽ reset QR; lớp hiển thị chuyển sang đồng hồ tiếp theo.
      if(keepPhotoBtn){
        setTimeout(function(){
          try{keepPhotoBtn.click();}catch(e){}
          setTimeout(mirror,0);

        mirror();

    function clearNoSuppressionWhenDifferentMeter(){
      if(!suppressSameMeter || !qrReadyNow())return;
      const meter=currentMeter();
      if(meter && meter!==suppressSameMeter){
        suppressSameMeter='';
        readyNextAfterNo=false;
      }
    }

    function state(){
      const main=String(statusMain.textContent||'').trim();

      if(qrReadyNow()){
        const apt=getApartmentCode();
        const meter=currentMeter();

        if(meter && suppressSameMeter===meter){
          return {
            title:'HÃY CHỌN ĐỒNG HỒ KHÁC ĐỂ CHỤP',
            sub:'Đồng hồ này vừa chụp xong.'
          };
        }

        // Không cảnh báo trước. Cùng QR vừa chụp vẫn cho bấm CHỤP;
        // chỉ sau khi lõi phát hiện trùng mới mở hộp CÓ / KHÔNG.
        return {
          title:'BẤM ĐỂ CHỤP',
          sub:(apt ? apt+': ' : '')+'Đã nhận rõ, Bấm để chụp'
        };
      }

      const readyState=(
        main==='ĐÃ GIỮ ẢNH CŨ' ||
        main==='SẴN SÀNG CHỤP' ||
        main==='SẴN SÀNG ĐỒNG HỒ TIẾP THEO' ||
        main==='SẴN SÀNG CHỤP ĐỒNG HỒ' ||
        main==='SẴN SÀNG CHỤP ẢNH TIẾP THEO' ||
        main==='SẴN SÀNG CHỤP ĐỒNG HỒ TIẾP THEO' ||
        main==='NHẤN ĐỂ CHỤP' ||
        main==='ĐANG KẾT NỐI CAMERA' ||
        main==='ĐANG HIỂN THỊ CAMERA' ||
        main==='BẤM HIỂN THỊ CAMERA'
      );

      if(readyState){
        if(readyNextAfterNo){
          return {
            title:'SẴN SÀNG CHỤP ĐỒNG HỒ TIẾP THEO',
            sub:'Đưa đồng hồ + QR tiếp theo vào khung.'
          };
        }
        if(hasHandledMeter){
          return {
            title:'SẴN SÀNG CHỤP ẢNH TIẾP THEO',
            sub:'Đưa đồng hồ + QR tiếp theo vào khung.'
          };
        }
        return {
          title:'SẴN SÀNG CHỤP ĐỒNG HỒ',
          sub:'Đưa đồng hồ + QR vào khung.'
        };
      }

      return {
        title:main||(hasHandledMeter?'SẴN SÀNG CHỤP ẢNH TIẾP THEO':'SẴN SÀNG CHỤP ĐỒNG HỒ'),
        sub:cleanGuideText(statusSub.textContent)
      };
    }

    function shotButtonVisible(){
      return getComputedStyle(shotBtn).display!=='none';
    }

    function isOfflineNow(){
      if(window.WATER_REAL_ONLINE===false)return true;
      if(window.WATER_REAL_ONLINE===true)return false;
      return !navigator.onLine;
    }

    function beginOfflineNoticeIfNeeded(){
      if(!isOfflineNow()||offlineNoticeShown||!shotButtonVisible())return;
      offlineNoticeShown=true;
      offlineNoticeUntil=Date.now()+1800;
      clearTimeout(offlineNoticeTimer);
      offlineNoticeTimer=setTimeout(mirror,1850);
    }

    function cameraReady(){
      try{
        return !!(
          video && video.videoWidth>0 && video.videoHeight>0 &&
          typeof stream!=='undefined' && stream &&
          stream.getVideoTracks().some(track=>track.readyState==='live')
        );
      }catch(e){return false;}
    }

    function captureBusy(){
      try{return typeof shotRunning!=='undefined'&&shotRunning;}catch(e){return false;}
    }

    function applyShotLock(){
      const meter=currentMeter();

      if(adjacentPromptOpen){
        shotBtn.disabled=true;
        return;
      }
      if(qrReadyNow() && meter && suppressSameMeter===meter){
        shotBtn.disabled=true;
        return;
      }
      if(captureBusy()){
        shotBtn.disabled=true;
        return;
      }
      if(cameraReady())shotBtn.disabled=false;
    }

    function mirror(){
      readSavedEvidence();
      maybeInterceptAdjacentDuplicate();
      clearNoSuppressionWhenDifferentMeter();
      beginOfflineNoticeIfNeeded();

      const parts=ensureButtonLayout();
      if(offlineNoticeUntil>Date.now()){
        parts.title.textContent='✓ ĐÃ SẴN SÀNG LÀM VIỆC OFFLINE';
        parts.sub.textContent='Ảnh sẽ được lưu trên thiết bị và đồng bộ khi có mạng.';
        applyShotLock();
        return;
      }

      const meter=currentMeter();
      const sameMeterWarning=!!(qrReadyNow() && meter && suppressSameMeter===meter);
      shotBtn.classList.toggle('waterSameMeterWarning',sameMeterWarning);

      const s=state();
      parts.title.textContent=s.title;
      parts.sub.textContent=s.sub;
      applyShotLock();
    }

    function hasStaff(){
      try{return typeof getStaffCode==='function' && !!getStaffCode();}catch(e){return false;}
    }

    function watchCameraReady(){
      clearInterval(readyWatchTimer);
      readyWatchTimer=setInterval(function(){
        if(cameraReady()){
          clearInterval(readyWatchTimer);
          readyWatchTimer=null;
          applyShotLock();
          mirror();
        }
      },60);
    }

    function autoStartCamera(){
      if(cameraReady()){
        applyShotLock();
        return;
      }
      if(!hasStaff()){
        try{if(typeof openStaff==='function')openStaff();}catch(e){}
        return;
      }
      try{
        if(typeof cameraStarting!=='undefined' && cameraStarting)return;
      }catch(e){}
      if(typeof startCamera!=='function')return;

      shotBtn.disabled=true;
      watchCameraReady();
      Promise.resolve(startCamera()).catch(function(){});
    }

    mirror();

    if(window.MutationObserver){
      const obs=new MutationObserver(mirror);
      obs.observe(statusMain,{childList:true,characterData:true,subtree:true});
      obs.observe(statusSub,{childList:true,characterData:true,subtree:true});

      const displayObserver=new MutationObserver(function(){
        if(shotBtn.style.display==='block')shotBtn.style.display='flex';
        mirror();
      });
      displayObserver.observe(shotBtn,{attributes:true,attributeFilter:['style']});

      const evidence=el('captureEvidence');
      if(evidence){
        const evidenceObserver=new MutationObserver(mirror);
        evidenceObserver.observe(evidence,{childList:true,characterData:true,subtree:true});
      }

      if(duplicateModal){
        const duplicateObserver=new MutationObserver(function(){
          maybeInterceptAdjacentDuplicate();
        });
        duplicateObserver.observe(duplicateModal,{attributes:true,attributeFilter:['style']});
      }
    }

    setInterval(mirror,180);

    if(startBtn)startBtn.style.display='none';
    shotBtn.style.display='flex';
    shotBtn.disabled=true;
    mirror();
    setTimeout(autoStartCamera,0);

    const baseSaveStaff=window.saveStaff;
    if(typeof baseSaveStaff==='function'){
      const saveStaffAutoCamera=function(){
        const result=baseSaveStaff.apply(this,arguments);
        setTimeout(function(){if(hasStaff())autoStartCamera();},0);
        return result;
      };
      window.saveStaff=saveStaffAutoCamera;
      try{saveStaff=saveStaffAutoCamera;}catch(e){}
    }

    if(statusBox)statusBox.setAttribute('aria-hidden','true');
    window.WATER_POSTCAPTURE_CONFIRM_BUILD='879-final10-postcapture-r4';
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
})();

<script>

  function selectedName(){

<script>
(function(){
  'use strict';

  const BUILD='879-final10-postcapture-r6-liveprogress';
  const BACKEND='https://script.google.com/macros/s/AKfycbxAH_a9-AcsKFAzEKkwhv_6xGOHrYyJwJbirqBuMhIP-39xZl-Cwg8ZuLclXkAFOM8/exec';
  const POLL_MS=4000;

  let frame=null;
  let form=null;
  let timer=null;
  let debounceTimer=null;
  let requestId='';
  let running=false;
  let queued=false;
  let lastPending=null;

  function el(id){return document.getElementById(id);}

  function periodNow(){
    try{
      const parts=new Intl.DateTimeFormat('en-GB',{
        timeZone:'Asia/Ho_Chi_Minh',month:'2-digit',year:'numeric'
      }).formatToParts(new Date());
      return parts.find(x=>x.type==='month').value+'/'+parts.find(x=>x.type==='year').value;
    }catch(e){
      const d=new Date();
      return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
    }
  }

  function displayPeriod(value){
    const p=String(value||periodNow()).trim();
    const m=/^(0?[1-9]|1[0-2])\/(\d{4})$/.exec(p);
    return m ? String(Number(m[1]))+'/'+m[2] : p;
  }

  function displayCount(n){
    return String(Math.max(0,Math.floor(Number(n)||0)));
  }

  function renderProgress(data){
    if(!data||data.ok!==true)return false;

    const total=Math.max(0,Number(data.total)||0);
    const done=Math.max(0,Math.min(total,Number(data.captured)||0));
    const left=Number.isFinite(Number(data.remaining))
      ? Math.max(0,Number(data.remaining))
      : Math.max(0,total-done);

    if(el('progressTotal'))el('progressTotal').textContent=displayCount(total);
    if(el('progressDone'))el('progressDone').textContent=displayCount(done);
    if(el('progressLeft'))el('progressLeft').textContent=displayCount(left);
    if(el('progressPeriod'))el('progressPeriod').textContent=displayPeriod(data.period);

    try{localStorage.setItem('water_progress_ui3',JSON.stringify(data));}catch(e){}
    return true;
  }

  function cleanup(){
    clearTimeout(timer);
    timer=null;
    if(form){
      try{form.remove();}catch(e){}
      form=null;
    }
    if(frame){
      try{frame.remove();}catch(e){}
      frame=null;
    }
    requestId='';
    running=false;
  }

  function hiddenInput(target,name,value){
    const i=document.createElement('input');
    i.type='hidden';
    i.name=name;
    i.value=String(value==null?'':value);
    target.appendChild(i);
  }

  function requestProgress(reason){
    if(!navigator.onLine)return;

    if(running){
      queued=true;
      return;
    }

    running=true;
    queued=false;

    const id='p'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
    requestId=id;

    const target='waterProgressLive_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    const f=document.createElement('iframe');
    f.name=target;
    f.id=target;
    f.style.display='none';
    f.setAttribute('aria-hidden','true');
    document.body.appendChild(f);
    frame=f;

    const frm=document.createElement('form');
    frm.method='POST';
    frm.action=BACKEND;
    frm.target=target;
    frm.style.display='none';

    hiddenInput(frm,'api','uistate');
    hiddenInput(frm,'period',periodNow());
    hiddenInput(frm,'requestId',id);
    hiddenInput(frm,'reason',reason||'progress_live');

    document.body.appendChild(frm);
    form=frm;

    try{
      frm.submit();
    }catch(e){
      cleanup();
      return;
    }

    setTimeout(function(){
      if(form===frm){
        try{frm.remove();}catch(e){}
        form=null;
      }
    },200);

    timer=setTimeout(function(){
      if(requestId!==id)return;
      const rerun=queued;
      cleanup();
      queued=false;
      if(rerun)setTimeout(function(){requestProgress('retry_after_timeout');},250);
    },8000);
  }

  function schedule(reason,delay){
    clearTimeout(debounceTimer);
    debounceTimer=setTimeout(function(){requestProgress(reason);},Math.max(0,Number(delay)||0));
  }

  function burst(reason){
    schedule(reason,150);
    setTimeout(function(){requestProgress(reason+'_confirm');},1300);
  }

  window.addEventListener('message',function(event){
    const d=event&&event.data;
    if(!d||typeof d!=='object'||d.type!=='WATER_UI_STATE')return;
    if(!d.requestId||d.requestId!==requestId)return;

    renderProgress(d.progress);

    const rerun=queued;
    cleanup();
    queued=false;

    if(rerun)setTimeout(function(){requestProgress('queued_refresh');},180);
  });

  const syncStatus=el('syncStatus');
  if(syncStatus&&window.MutationObserver){
    new MutationObserver(function(){
      const t=String(syncStatus.textContent||'').trim();
      if(/✓\s*SPEED3.*GỬI HẾT/i.test(t)){
        burst('sync_complete');
      }
    }).observe(syncStatus,{childList:true,characterData:true,subtree:true});
  }

  const pending=el('pending');
  if(pending){
    const readPending=function(){
      const n=Math.max(0,Number(String(pending.textContent||'').replace(/[^\d]/g,''))||0);
      if(lastPending===null){
        lastPending=n;
        return;
      }
      if(lastPending>0&&n===0&&navigator.onLine){
        burst('pending_zero');
      }
      lastPending=n;
    };

    readPending();

    if(window.MutationObserver){
      new MutationObserver(readPending)

<script>
(function(){
  'use strict';

  const BUILD='879-r12.1-project-module';
  const PROJECT_CACHE_KEY='water_project_row2';
  const PROJECT_NOTE_CACHE_KEY='water_project_note_v1';
  const PROJECT_IMAGE_CACHE_KEY='water_project_image_v1';
  const PROGRESS_CACHE_KEY='water_progress_ui3';

  let projectRaw='';
  let projectNote='';
  let projectImage='';
  let progress=null;
  let renderTimer=0;
  let lastKey='';

  function el(id){ return document.getElementById(id); }
  function txt(v){ return String(v==null?'':v).trim(); }
  function esc(v){ return txt(v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function norm(v){ return txt(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,' ').trim(); }
  function num(v){ const n=Number(v); return Number.isFinite(n)?Math.max(0,Math.floor(n)):0; }
  function pct(done,total){ return total>0?Math.max(0,Math.min(100,Math.round(done*100/total))):0; }

  function parseProject(raw){
    const out={name:'',code:'',address:'',unit:'',owner:'',status:'',start:'',end:'',duration:''};
    const value=txt(raw);
    if(!value)return out;

    value.split(/\s*[·|\n]\s*/).map(txt).filter(Boolean).forEach(function(part){
      const m=part.match(/^\s*([^:：]{1,50})\s*[:：]\s*(.+)\s*$/);
      if(!m)return;
      const key=norm(m[1]), val=txt(m[2]);
      if(!val)return;
      if(/^(du an|ten du an|project|project name)$/.test(key))out.name=val;
      else if(/^(ma|ma du an|project code|code)$/.test(key))out.code=val;
      else if(/^(dia chi|address)$/.test(key))out.address=val;
      else if(/^(don vi qlvh|don vi quan ly|don vi quan ly van hanh|qlvh|ban quan ly|management unit)$/.test(key))out.unit=val;
      else if(/^(nguoi phu trach|nguoi quan ly|phu trach|responsible|owner)$/.test(key))out.owner=val;
      else if(/^(trang thai|status)$/.test(key))out.status=val;
      else if(/^(ngay bat dau|bat dau|start)$/.test(key))out.start=val;
      else if(/^(ngay ket thuc|ket thuc|end)$/.test(key))out.end=val;
      else if(/^(han ghi|han ghi ngay|duration)$/.test(key))out.duration=val.replace(/\s*ngày\s*$/i,'');
    });

    if(!out.name && value.indexOf('·')<0 && value.indexOf('|')<0){
      out.name=value.replace(/^\s*dự\s*án\s*[:：]\s*/i,'').trim();
    }
    return out;

<script>
(function(){
  'use strict';

  const BUILD='879-r10.4-project-image-once-per-open';
  const SHEET_ID='1YeXaSA03l3wPntaP_aNKeR_aMrjCnenHtLAiALSwxpY';
  const SHEET_NAME='THONG_TIN_DU_AN';
  const CACHE_KEY='water_project_info_sheet_v2';
  const NOTE_CACHE_KEY='water_project_note_v1';
  const IMAGE_CACHE_KEY='water_project_image_v1';

  let directRaw='';
  let directNote='';
  let directImage='';
  let loading=false;
  let loaded=false;
  let imageCheckedThisOpen=false;

  function txt(v){return String(v==null?'':v).trim();}

  function cell(row,i){
    const c=row&&row.c&&row.c[i];
    if(!c)return '';
    return txt(c.f!=null?c.f:c.v);
  }

  function jsonp(sheet,query){
    return new Promise(function(resolve,reject){
      const cb='__waterGviz_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const script=document.createElement('script');
      let done=false;

      const timer=setTimeout(function(){
        finish(new Error('Hết thời gian đọc Google Sheets.'));
      },12000);

      function finish(err,data){
        if(done)return;
        done=true;
        clearTimeout(timer);

        try{delete window[cb];}
        catch(e){window[cb]=undefined;}

        if(script.parentNode)script.parentNode.removeChild(script);
        err?reject(err):resolve(data);
      }

      window[cb]=function(data){finish(null,data);};
      script.onerror=function(){finish(new Error('Không đọc được Google Sheets.'));};

      script.src='https://docs.google.com/spreadsheets/d/'
        +encodeURIComponent(SHEET_ID)
        +'/gviz/tq?sheet='+encodeURIComponent(sheet)
        +'&headers=1&tqx=responseHandler:'+encodeURIComponent(cb)
        +'&tq='+encodeURIComponent(query)
        +'&_='+Date.now();

      document.head.appendChild(script);
    });
  }

  function parseRow(row,includeImage){
    const p={
      code:cell(row,0),
      name:cell(row,1),
      address:cell(row,2),
      unit:cell(row,3),
      owner:cell(row,4),
      status:cell(row,5),
      start:cell(row,6),
      end:cell(row,7),
      duration:cell(row,8),
      note:cell(row,9),
      image:includeImage?cell(row,11):directImage
    };

    const parts=[];
    if(p.name)parts.push('Dự án: '+p.name);
    if(p.code)parts.push('Mã dự án: '+p.code);
    if(p.address)parts.push('Địa chỉ: '+p.address);
    if(p.unit)parts.push('Đơn vị QLVH: '+p.unit);
    if(p.owner)parts.push('Người phụ trách: '+p.owner);
    if(p.status)parts.push('Trạng thái: '+p.status);
    if(p.start)parts.push('Ngày bắt đầu: '+p.start);
    if(p.end)parts.push('Ngày kết thúc: '+p.end);
    if(p.duration)parts.push('Hạn ghi: '+p.duration+' ngày');

    return {
      raw:parts.join(' · '),
      note:p.note,
      image:p.image
    };
  }

  function publish(raw,note,image){
    raw=txt(raw);
    note=txt(note);
    image=txt(image);

    if(!raw)return;

    directRaw=raw;
    directNote=note;
    directImage=image;

    try{
      localStorage.setItem(CACHE_KEY,raw);
      localStorage.setItem('water_project_row2',raw);
      localStorage.setItem(NOTE_CACHE_KEY,note);
      localStorage.setItem(IMAGE_CACHE_KEY,image);
    }catch(e){}

    window.postMessage({
      type:'WATER_UI_STATE',
      project:raw,
      projectNote:note,
      projectImage:image,
      _r104Project:true
    },'*');
  }

  function loadCache(){
    try{
      const c=txt(localStorage.getItem(CACHE_KEY));
      const n=txt(localStorage.getItem(NOTE_CACHE_KEY));
      const i=txt(localStorage.getItem(IMAGE_CACHE_KEY));

      if(c){
        directRaw=c;
        directNote=n;
        directImage=i;
        publish(c,n,i);
      }
    }catch(e){}
  }

  async function load(includeImage){
    if(loading)return;

    includeImage=!!includeImage && !imageCheckedThisOpen;
    loading=true;

    try{
      const query=includeImage
        ? "select A,B,C,D,E,F,G,H,I,J,K,L where B is not null limit 1"
        : "select A,B,C,D,E,F,G,H,I,J,K where B is not null limit 1";

      const data=await jsonp(SHEET_NAME,query);
      const row=data&&data.table&&data.table.rows&&data.table.rows[0];
      const parsed=parseRow(row,includeImage);

      if(includeImage)imageCheckedThisOpen=true;

      if(parsed.raw){
        loaded=true;
        publish(parsed.raw,parsed.note,parsed.image);
      }

    }catch(e){
      // Giữ cache/backend nếu Google Sheets tạm thời không phản hồi.
      // Nếu lần đọc ảnh đầu tiên lỗi, không ép tải lại liên tục trong cùng phiên.
      if(includeImage)imageCheckedThisOpen=true;
    }finally{
      loading=false;
    }
  }

  window.addEventListener('message',function(ev){
    const d=ev&&ev.data;
    if(!d||typeof d!=='object'||d.type!=='WATER_UI_STATE')return;
    if(d._r104Project)return;

    if(directRaw){
      setTimeout(function(){
        publish(directRaw,directNote,directImage);
      },0);
    }else if(!loaded){
      setTimeout(function(){load(false);},0);
    }
  });

  function start(){
    loadCache();
    // Chỉ lần này mới đọc cột ẢNH DỰ ÁN trong mỗi lần mở App.
    load(true);
  }

  // Các lần quay lại App chỉ làm mới thông tin chữ, không đọc/tải lại ảnh.
  window.addEventListener('pageshow',function(){
    setTimeout(function(){load(false);},100);
  });

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){
      setTimeout(function(){load(false);},100);
    }
  });

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',start,{once:true});
  }else{
    start();
  }

  window.WATER_PROJECT_SHEET_BUILD=BUILD;
})();

</script>

      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c];
    });

  function num(v, fallback){
    const n=Number(v);
    return Number.isFinite(n)?n:(fallback==null?0:fallback);
  }

  function norm(v){
    return txt(v)
      .toLowerCase()
      .normalize('NFD')

      .replace(/đ/g,'d')

    return {

    if(scheduleLocked){

    if(!d || typeof d!=='object')return;

    const incomingStaffName=currentStaffNameFromState(d);

        'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
      ];

      let i=0;

      function next(){
        if(window.XLSX){
          resolve(window.XLSX);
          return;
        }

        if(i>=urls.length){
          reject(new Error('Không tải được thư viện Excel.'));
          return;
        }

        const s=document.createElement('script');
        s.src=urls[i++];
        s.async=true;

        s.onload=function(){
          if(window.XLSX){
            resolve(window.XLSX);
          }else{
            next();
          }
        };

        s.onerror=next;
        document.head.appendChild(s);
      }

      next();
    });

        String(index+1),
        vals[0],

        vals[2],
        vals[3],

    ws['!merges']=[
      {
        s:{r:0,c:0},

    ws['!cols']=[
