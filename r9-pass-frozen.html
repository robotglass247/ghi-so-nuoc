    ];

    ws['!rows']=[
      {hpt:24},
      {hpt:18},
      {hpt:30}
    ];

    // Giữ TT/Tòa/Tầng/Căn hộ/Mã đồng hồ dạng text để không mất số 0 đầu.
    for(let r=3;r<aoa.length;r++){
      for(let c=0;c<=4;c++){
        const addr=XLSX.utils.encode_cell({r:r,c:c});
        if(ws[addr]){
          ws[addr].t='s';
          ws[addr].v=String(ws[addr].v==null?'':ws[addr].v);
          ws[addr].z='@';
        }
      }
    }

    if(aoa.length>=4){
      ws['!autofilter']={
        ref:'A3:H'+aoa.length
      };
    }

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(
      wb,
      ws,
      ('CHI_SO_'+period.replace('/','_')).slice(0,31)
    );

    return wb;
  }

  async function downloadSelected(){
    const select=el('waterExportMonthR118');
    const link=el('waterDownloadR118');
    const period=txt(select&&select.value);

    if(!period){
      status('Anh chọn tháng cần tải trước.','err');
      return;
    }

    if(!navigator.onLine){
      status(
        'Thiết bị đang OFFLINE. Cần Internet để tải file.',
        'err'
      );
      return;
    }

    /*
      R11.24 MOBILE DOWNLOAD TRANSPORT
      Mở cửa sổ nhận file NGAY trong thao tác bấm của người dùng.
      Việc này giữ user gesture trên Android trong khi phía sau còn phải
      chờ đọc Google Sheet và tạo XLSX.
      Core R11.8: chọn tháng / query / 8 cột / không ảnh giữ nguyên.
    */
    const isMobile=
      /Android|iPhone|iPad|iPod|Mobile/i.test(
        String(navigator.userAgent||'')
      );

    let downloadWindow=null;

    if(isMobile){
      try{
        downloadWindow=window.open('about:blank','_blank');

        if(downloadWindow && downloadWindow.document){
          downloadWindow.document.open();
          downloadWindow.document.write(
            '<!doctype html><html><head><meta charset="utf-8">'
            +'<meta name="viewport" content="width=device-width,initial-scale=1">'
            +'<title>Đang tạo file...</title></head>'
            +'<body style="font-family:Arial,sans-serif;padding:24px;text-align:center">'
            +'<h3>Đang tạo file chỉ số nước...</h3>'
            +'<p>Vui lòng chờ vài giây.</p>'
            +'</body></html>'
          );
          downloadWindow.document.close();
        }
      }catch(_e){
        downloadWindow=null;
      }
    }

    setDisabled(true);

    const old=link?link.textContent:'Tải File';

    if(link){
      link.textContent='Đang tạo...';
    }

    status(
      'Đang tạo file...',
      ''
    );

    try{
      /*
        B:H = 7 cột dữ liệu xuất file (không xuất cột ảnh).
        J = Kỳ dùng để lọc.
        KHÔNG tham chiếu bất kỳ Sheet hàng đợi nào.
      */
      const q=
        "select B,C,D,E,F,G,H where J = '" 
        +period.replace(/'/g,"''")
        +"'";

      const data=await jsonp(q);

      const rows=
        data &&
        data.table &&
        Array.isArray(data.table.rows)
          ? data.table.rows
          : [];

      if(!rows.length){
        throw new Error(
          'Không có dữ liệu của tháng '+period+'.'
        );
      }

      const XLSX=await loadXlsx();
      const wb=buildRealXls(period,rows,XLSX);

      const ws=wb.Sheets[wb.SheetNames[0]];
      const range=XLSX.utils.decode_range(ws['!ref']||'A1:A1');
      if(range.e.c!==7){
        throw new Error('Khóa xuất R11.8 phát hiện file không đúng 8 cột.');
      }
      for(let rr=0;rr<=range.e.r;rr++){
        const addr='I'+(rr+1);
        if(ws[addr]){
          throw new Error('Khóa xuất R11.8 phát hiện cột I/Ảnh.');
        }
      }

      const fileName=
        'R118_KHONG_ANH_'
        +safeName(period.replace('/','-'))
        +'.xlsx';

      const bytes=XLSX.write(
        wb,
        {
          bookType:'xlsx',
          type:'array',
          compression:true
        }
      );

      const blob=new Blob(
        [bytes],
        {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
      );
      const url=URL.createObjectURL(blob);

      function safeHtml(v){
        return String(v==null?'':v).replace(/[&<>"']/g,function(c){
          return {
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
          }[c];
        });
      }

      let handedToMobile=false;

      /*
        Android/mobile: dùng cửa sổ đã mở trong user gesture.
        Tự click một lần; nếu Chrome/Samsung chặn, người dùng vẫn có
        nút thật để chạm tải file.
      */
      if(downloadWindow && !downloadWindow.closed){
        try{
          const fileEsc=safeHtml(fileName);
          const urlEsc=safeHtml(url);

          downloadWindow.document.open();
          downloadWindow.document.write(
            '<!doctype html><html><head><meta charset="utf-8">'
            +'<meta name="viewport" content="width=device-width,initial-scale=1">'
            +'<title>Tải file chỉ số</title></head>'
            +'<body style="font-family:Arial,sans-serif;padding:24px;text-align:center">'
            +'<h3>File đã sẵn sàng</h3>'
            +'<a id="waterMobileDownload" href="'+urlEsc+'" download="'+fileEsc+'" '
            +'style="display:inline-flex;align-items:center;justify-content:center;'
            +'min-height:48px;padding:0 22px;border:1px solid #225b91;border-radius:10px;'
            +'font-weight:800;text-decoration:none;color:#225b91">'
            +'TẢI FILE '+fileEsc+'</a>'
            +'<p style="font-size:13px;color:#596774;margin-top:16px">'
            +'Nếu máy chưa tự tải, chạm nút TẢI FILE ở trên.</p>'
            +'<button id="waterBackToApp" type="button" '
            +'style="display:flex;align-items:center;justify-content:center;width:100%;'
            +'max-width:336px;min-height:46px;margin:22px auto 0;padding:0 18px;'
            +'border:1px solid #9aa8b5;border-radius:10px;background:#fff;'
            +'font-size:15px;font-weight:800;color:#263746">'
            +'← QUAY LẠI ỨNG DỤNG</button>'
            +'<script>'
            +'var back=document.getElementById("waterBackToApp");'
            +'if(back){back.onclick=function(){'
            +'try{if(window.opener&&!window.opener.closed){window.opener.focus();}}catch(e){}'
            +'try{window.close();}catch(e){}'
            +'};}'
            +'setTimeout(function(){'
            +'var a=document.getElementById("waterMobileDownload");'
            +'if(a){try{a.click();}catch(e){}}'
            +'},120);</'+'script>'
            +'</body></html>'
          );
          downloadWindow.document.close();
          handedToMobile=true;
        }catch(_e){
          handedToMobile=false;
        }
      }

      /*
        Desktop hoặc mobile popup bị chặn: giữ cơ chế R11.8 cũ.
        Đồng thời đặt một link dự phòng thật trong dòng trạng thái.
      */
      if(!handedToMobile){
        const a=document.createElement('a');
        a.href=url;
        a.download=fileName;
        a.style.display='none';
        document.body.appendChild(a);

        try{ a.click(); }catch(_e){}

        setTimeout(function(){
          if(a.parentNode)a.parentNode.removeChild(a);
        },1500);

        const n=el('waterExportR118Status');
        if(n){
          n.className='ok';
          n.innerHTML='';

          const t=document.createElement('span');
          t.textContent='File đã sẵn sàng tải • ';

          const manual=document.createElement('a');
          manual.href=url;
          manual.download=fileName;
          manual.textContent='NHẤN ĐỂ LƯU FILE';
          manual.style.fontWeight='900';
          manual.style.textDecoration='underline';

          n.appendChild(t);
          n.appendChild(manual);
        }
      }else{
        status(
          'File đã sẵn sàng tải.',
          'ok'
        );
      }

      // Giữ Blob đủ lâu để người dùng có thể chạm link dự phòng trên mobile.
      setTimeout(function(){
        try{URL.revokeObjectURL(url);}catch(e){}
      },60000);

    }catch(e){
      try{
        if(downloadWindow && !downloadWindow.closed){
          downloadWindow.close();
        }
      }catch(_e){}

      /*
        CỐ Ý KHÔNG FALLBACK.
        Nếu TAI_CHI_SO_THANG lỗi thì dừng tại đây.
      */
      status(
        txt(e&&e.message)||
        'Không tạo được file tải.',
        'err'
      );

    }finally{
      if(link){
        link.textContent=old||'Tải File';
      }

      setDisabled(false);
    }
  }

  function keepMounted(){
    /*
      Nếu module layout khác dựng lại Tab QUẢN LÝ,
      module này sẽ dựng lại card tải mới.
    */
    if(!isCorrectMounted()){
      mount();
    }
  }

  function start(){
    if(mount())return;

    let tries=0;

    const timer=setInterval(function(){
      tries++;

      if(mount() || tries>40){
        clearInterval(timer);
      }
    },200);
  }

  if(window.MutationObserver){
    const obs=new MutationObserver(function(){
      keepMounted();
    });

    obs.observe(
      document.documentElement,
      {
        childList:true,
        subtree:true
      }
    );
  }

  if(document.readyState==='loading'){
    document.addEventListener(
      'DOMContentLoaded',
      start,
      {once:true}
    );
  }else{
    start();
  }

  window.WATER_MANAGE_EXPORT_BUILD=BUILD;
  window.WATER_MANAGE_EXPORT_SOURCE=DATA_SHEET;
})();
</script>
