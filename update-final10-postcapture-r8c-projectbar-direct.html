<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cập nhật FINAL10 R8C PROJECT BAR</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
body{display:flex;align-items:center;justify-content:center;text-align:center}
.box{padding:24px;max-width:430px}
#msg{font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div class="box"><div id="msg">[1/3] Đang cài R8C…</div></div>
<script>
(async()=>{
  const LABEL='879-final10-postcapture-r8c-projectbar-direct';
  const msg=document.getElementById('msg');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const go=()=>location.replace('./v87-background.html?build='+LABEL);

  function statusOf(worker){
    return new Promise(resolve=>{
      if(!worker){resolve(null);return;}
      try{
        const ch=new MessageChannel();
        const timer=setTimeout(()=>resolve(null),700);
        ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
        worker.postMessage('WATER_R8C_STATUS',[ch.port2]);
      }catch(e){resolve(null);}
    });
  }

  try{
    if(!('serviceWorker' in navigator)){go();return;}

    const reg=await navigator.serviceWorker.register(
      './water-offline-sw-final10-postcapture-r8c-projectbar-direct.js?v='+LABEL,
      {scope:'./',updateViaCache:'none'}
    );

    try{await reg.update();}catch(e){}
    msg.textContent='[2/3] Đang kích hoạt R8C…';

    const started=Date.now();
    while(Date.now()-started<18000){
      if(reg.installing)try{reg.installing.postMessage('SKIP_WAITING');}catch(e){}
      if(reg.waiting)try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}

      const ctrl=navigator.serviceWorker.controller;
      const st=await statusOf(ctrl);

      if(st&&st.ready===true&&st.build===LABEL){
        msg.textContent='[3/3] R8C đã sẵn sàng. Đang mở ứng dụng…';
        await wait(250);
        go();
        return;
      }

      await wait(250);
    }

    msg.textContent='Đang mở ứng dụng R8C…';
    await wait(300);
    go();
  }catch(e){
    msg.textContent='Đang mở ứng dụng R8C…';
    setTimeout(go,400);
  }
})();
</script>
</body>
</html>
