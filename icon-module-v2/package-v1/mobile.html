<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#23679d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ghi Chỉ Số Nước">
<link rel="icon" href="../icon-water-meter.svg?v=pkg-v1-3" type="image/svg+xml">
<script>
(function(){
  'use strict';
  window.__waterPwaPrompt=null;
  window.addEventListener('beforeinstallprompt',function(ev){ev.preventDefault();window.__waterPwaPrompt=ev;window.dispatchEvent(new Event('water-pwa-prompt-ready'));});
  try{
    const p=new URLSearchParams(location.search);
    const project=String(p.get('project')||p.get('projectId')||'').trim().toUpperCase();
    if(/^[A-Z0-9_-]{2,40}$/.test(project)&&'serviceWorker' in navigator&&navigator.serviceWorker.controller){
      const l=document.createElement('link');l.rel='manifest';l.setAttribute('data-package-v1-manifest','1');
      l.href='../../manifest-project.webmanifest?project='+encodeURIComponent(project)+'&package=v1&mode=mobile&v=3';document.head.appendChild(l);
    }
  }catch(e){}
})();
</script>
<title>Cài Ghi Chỉ Số Nước trên điện thoại</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}body{display:flex;align-items:center;justify-content:center;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}.card{width:min(430px,100%);background:#fff;border:1px solid #dce5ee;border-radius:22px;padding:20px 16px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}.badge{display:inline-block;margin-bottom:10px;padding:6px 10px;border-radius:999px;background:#eef6ff;color:#23679d;font-size:12px;font-weight:800}.icon{width:92px;height:92px;display:block;margin:0 auto 10px;border-radius:22px}.title{font-size:21px;font-weight:900}.project{margin:7px 0 14px;color:#52657a;font-weight:700}.status,.steps{margin:0 0 10px;padding:12px;border:1px solid #e0e7ef;border-radius:13px;background:#f8fafc;color:#52657a;font-size:14px;line-height:1.55;text-align:left}.steps{display:none;background:#fffdf5;border-color:#f1d896;color:#334155}.steps.show{display:block}.steps b{color:#23679d}button,a.btn{display:block;width:100%;min-height:54px;border-radius:14px;border:1px solid #cfd9e4;padding:15px 12px;margin-top:10px;font:800 16px/1.2 "Segoe UI",Tahoma,Arial,sans-serif;text-decoration:none;cursor:pointer}#installBtn{background:#23679d;color:#fff;border-color:#23679d}#installBtn:disabled{opacity:.55;cursor:not-allowed}#recoverBtn{display:none;background:#f59e0b;color:#172033;border-color:#e7a10d}#openBtn{background:#fff;color:#23679d}.back{display:block;margin-top:12px;color:#60758b;font-size:13px;text-decoration:none}.note{margin-top:12px;font-size:12px;color:#708196}
</style>
</head>
<body>
<div class="card">
 <div class="badge">CÀI TRÊN ĐIỆN THOẠI</div>
 <img class="icon" src="../icon-water-meter.svg?v=pkg-v1-3" alt="Icon Ghi Chỉ Số Nước">
 <div class="title">GHI CHỈ SỐ NƯỚC</div>
 <div id="projectText" class="project">Dự án: ...</div>
 <div id="status" class="status">Đang kiểm tra trạng thái cài đặt...</div>
 <button id="installBtn" type="button" disabled>CÀI ICON TRÊN ĐIỆN THOẠI</button>
 <button id="recoverBtn" type="button">KHÔI PHỤC ICON MÀN HÌNH</button>
 <div id="steps" class="steps"></div>
 <a id="openBtn" class="btn" href="#">MỞ APP</a>
 <a id="backBtn" class="back" href="#">← Chọn lại thiết bị</a>
 <div class="note">Designed by Mr.Hoa - Hotline: 0915176386</div>
</div>
<script>
(function(){
 'use strict';
 const p=new URLSearchParams(location.search);
 const project=String(p.get('project')||p.get('projectId')||'').trim().toUpperCase();
 const projectName=String(p.get('projectName')||'').trim();
 const valid=/^[A-Z0-9_-]{2,40}$/.test(project);
 const status=document.getElementById('status'),installBtn=document.getElementById('installBtn'),recoverBtn=document.getElementById('recoverBtn'),steps=document.getElementById('steps'),openBtn=document.getElementById('openBtn');
 let deferredPrompt=window.__waterPwaPrompt||null,installFinished=false,installedHint=false;
 const appUrl='../../r1135-v20-direct.html?project='+encodeURIComponent(project)+'&from=install-success';
 const q='project='+encodeURIComponent(project)+(projectName?'&projectName='+encodeURIComponent(projectName):'');
 document.getElementById('backBtn').href='./install.html?'+q+'&v=3';
 document.getElementById('projectText').textContent=valid?'Dự án: '+project+(projectName?' - '+projectName:''):'Chưa xác định dự án';
 openBtn.href=valid?appUrl:'../../r1135-v20-direct.html';
 if(!valid){status.textContent='Link cài đặt chưa có PROJECT_ID hợp lệ.';return;}
 try{localStorage.setItem('water_pwa_project',project);sessionStorage.setItem('water_pwa_project',project);installedHint=localStorage.getItem('water_pwa_installed_'+project)==='1';}catch(e){}
 const ua=navigator.userAgent||'';
 const isAndroid=/Android/i.test(ua);
 const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const isChrome=/Chrome|CriOS/i.test(ua)&&!/EdgA|OPR|SamsungBrowser/i.test(ua);
 const isSamsung=/SamsungBrowser/i.test(ua);
 const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
 function showSteps(html){steps.innerHTML=html;steps.classList.add('show');}
 function hideSteps(){steps.classList.remove('show');}
 function showRecovery(){recoverBtn.style.display='block';status.textContent='Ứng dụng có thể đã được cài nhưng icon ngoài màn hình đã mất. Bấm KHÔI PHỤC ICON MÀN HÌNH.';}
 function hideRecovery(){recoverBtn.style.display='none';hideSteps();}
 recoverBtn.addEventListener('click',function(){
   if(isIOS){showSteps('<b>iPhone/iPad:</b><br>Mở Safari → Chia sẻ → <b>Thêm vào Màn hình chính</b>. Nếu icon cũ đã mất, thực hiện lại thao tác này để tạo icon mới.');return;}
   showSteps('<b>Android:</b><br>1. Mở <b>Danh sách ứng dụng / App drawer</b>.<br>2. Tìm <b>Ghi Chỉ Số Nước</b>.<br>3. Nhấn giữ icon → kéo/chọn <b>Thêm vào màn hình chính</b>.<br><br>Nếu không thấy ứng dụng trong App drawer: vào <b>Cài đặt → Ứng dụng</b>, tìm Ghi Chỉ Số Nước. Nếu ứng dụng vẫn còn, gỡ ứng dụng rồi quay lại link này để cài lại.');
 });
 if(standalone){try{localStorage.setItem('water_pwa_installed_'+project,'1');}catch(e){}status.textContent='Đang mở App...';setTimeout(()=>location.replace(appUrl),450);return;}
 function finishInstallAndEnterApp(){if(installFinished)return;installFinished=true;try{localStorage.setItem('water_pwa_installed_'+project,'1');}catch(e){}installBtn.disabled=true;hideRecovery();status.textContent='Đã cài Icon thành công. Đang mở màn hình đăng nhập App...';setTimeout(()=>location.replace(appUrl),1100);}
 function activatePrompt(){if(window.__waterPwaPrompt)deferredPrompt=window.__waterPwaPrompt;if(!deferredPrompt)return;hideRecovery();installBtn.disabled=false;installBtn.textContent='CÀI ICON TRÊN ĐIỆN THOẠI';status.textContent='Sẵn sàng cài đặt. Bấm CÀI ICON TRÊN ĐIỆN THOẠI.';}
 window.addEventListener('water-pwa-prompt-ready',activatePrompt);activatePrompt();
 async function waitForController(){if(navigator.serviceWorker.controller)return true;await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(t);resolve();};const t=setTimeout(finish,3000);navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});});return !!navigator.serviceWorker.controller;}
 async function setupPwa(forceReload){
   if(!('serviceWorker' in navigator))return;
   try{
     const hadManifest=!!document.querySelector('link[data-package-v1-manifest]');
     const reg=await navigator.serviceWorker.register('../../sw-pwa.js?v=package-v1-3',{scope:'../../',updateViaCache:'none'});try{await reg.update();}catch(e){}await navigator.serviceWorker.ready;
     const controlled=await waitForController();if(!controlled)return;
     if(!hadManifest){if(forceReload){const rp=new URLSearchParams(location.search);if(rp.get('_pwa')!=='1'){rp.set('_pwa','1');location.replace(location.pathname+'?'+rp.toString());return;}}const l=document.createElement('link');l.rel='manifest';l.setAttribute('data-package-v1-manifest','1');l.href='../../manifest-project.webmanifest?project='+encodeURIComponent(project)+'&package=v1&mode=mobile&v=3';document.head.appendChild(l);}
     setTimeout(activatePrompt,250);
   }catch(e){}
 }
 if(isIOS){installBtn.disabled=false;installBtn.textContent='THÊM VÀO MÀN HÌNH CHÍNH';status.textContent='iPhone/iPad: dùng Safari để thêm icon vào Màn hình chính.';showSteps('<b>Safari:</b><br>1. Bấm <b>Chia sẻ</b>.<br>2. Chọn <b>Thêm vào Màn hình chính</b>.<br>3. Bấm <b>Thêm</b>.');setupPwa(false);}
 else if(isAndroid){status.textContent='Đang chuẩn bị hộp cài đặt trên Android...';setupPwa(true).then(()=>{setTimeout(activatePrompt,300);setTimeout(function(){if(!deferredPrompt&&!installFinished)showRecovery();},4000);});}
 else{installBtn.disabled=false;status.textContent='Trang này dành cho Android/iPhone. Hãy mở bằng Chrome hoặc Safari.';}
 installBtn.addEventListener('click',async()=>{
   if(isIOS){showSteps('<b>Safari:</b><br>1. Bấm <b>Chia sẻ</b>.<br>2. Chọn <b>Thêm vào Màn hình chính</b>.<br>3. Bấm <b>Thêm</b>.');return;}
   activatePrompt();if(!deferredPrompt){showRecovery();return;}
   const ev=deferredPrompt;deferredPrompt=null;window.__waterPwaPrompt=null;
   try{await ev.prompt();const choice=await ev.userChoice;if(choice&&choice.outcome==='accepted'){installBtn.disabled=true;status.textContent='Đã xác nhận cài đặt. Đang hoàn tất tạo Icon...';setTimeout(function(){if(!installFinished)finishInstallAndEnterApp();},2500);}else{status.textContent='Bạn đã hủy cài đặt.';}}
   catch(e){status.textContent='Không mở được hộp cài.';showRecovery();}
 });
 window.addEventListener('appinstalled',finishInstallAndEnterApp);
 if(installedHint)showRecovery();
 setupPwa(isAndroid);
})();
</script>
</body>
</html>
