<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#23679d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="../icon-water-meter.svg?v=pkg-v1-9" type="image/svg+xml">
<title>Cài Ghi Chỉ Số Nước trên điện thoại</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:"Segoe UI",Tahoma,Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:16px}.card{width:min(430px,100%);background:#fff;border:1px solid #dce5ee;border-radius:22px;padding:22px 18px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}.badge{display:inline-block;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:#eef6ff;color:#23679d;font-size:12px;font-weight:800}.icon{width:96px;height:96px;display:block;margin:0 auto 12px;border-radius:22px}.title{font-size:21px;font-weight:900}.project{margin:7px 0 14px;color:#52657a;font-weight:700}.status{margin:0;padding:12px;border:1px solid #e0e7ef;border-radius:12px;background:#f8fafc;color:#52657a;font-size:13px;line-height:1.55;text-align:left}.note{margin-top:12px;font-size:12px;color:#708196}</style>
</head>
<body><div class="card">
<div class="badge">CÀI TRÊN ĐIỆN THOẠI - v9</div>
<img class="icon" src="../icon-water-meter.svg?v=pkg-v1-9" alt="Icon Ghi Chỉ Số Nước">
<div class="title">GHI CHỈ SỐ NƯỚC</div>
<div id="projectText" class="project">Dự án: ...</div>
<div id="status" class="status">Đang chuẩn bị bộ cài mới...</div>
<div class="note">Mỗi lần mở bộ cài sẽ chuẩn bị một Icon mới độc lập.</div>
</div>
<script>
(function(){
'use strict';
const p=new URLSearchParams(location.search);
const project=String(p.get('project')||p.get('projectId')||'').trim().toUpperCase();
const projectName=String(p.get('projectName')||'').trim();
const valid=/^[A-Z0-9_-]{2,40}$/.test(project);
const status=document.getElementById('status');
const ua=navigator.userAgent||'';
const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
document.getElementById('projectText').textContent=valid?'Dự án: '+project+(projectName?' - '+projectName:''):'Chưa xác định dự án';
if(!valid){status.textContent='Link cài đặt chưa có PROJECT_ID hợp lệ.';return;}
function newInstance(){return 'i'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function goInstaller(){
 const instance=newInstance();
 const qs=new URLSearchParams();qs.set('mode','mobile');qs.set('attempt','0');if(projectName)qs.set('projectName',projectName);if(isIOS)qs.set('ios','1');
 location.replace('./instances/'+encodeURIComponent(project)+'/'+encodeURIComponent(instance)+'/install.html?'+qs.toString());
}
async function ensureV9(){
 if(!('serviceWorker' in navigator)){status.textContent=isIOS?'Hãy mở link bằng Safari.':'Hãy mở link bằng Chrome.';return;}
 try{
   const reg=await navigator.serviceWorker.register('../../sw-pwa.js?v=package-v1-9',{scope:'../../',updateViaCache:'none'});
   try{await reg.update();}catch(e){}
   await navigator.serviceWorker.ready;
   const current=navigator.serviceWorker.controller;
   if(current&&String(current.scriptURL||'').indexOf('package-v1-9')>=0){goInstaller();return;}
   status.textContent='Đang kích hoạt bộ cài v9...';
   let done=false;const go=function(){if(done)return;done=true;goInstaller();};
   navigator.serviceWorker.addEventListener('controllerchange',function(){const c=navigator.serviceWorker.controller;if(c&&String(c.scriptURL||'').indexOf('package-v1-9')>=0)go();});
   setTimeout(function(){const c=navigator.serviceWorker.controller;if(c&&String(c.scriptURL||'').indexOf('package-v1-9')>=0)go();else location.reload();},3500);
 }catch(e){status.textContent='Không kích hoạt được bộ cài. Hãy tải lại trang.';}
}
ensureV9();
})();
</script>
</body></html>
