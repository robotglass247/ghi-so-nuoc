<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23679d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="./icon-water-meter.svg?v=20261004-3" type="image/svg+xml">
<title>Cài Ứng dụng Ghi Chỉ Số Nước - Ghi Chỉ Số Nước</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:center;justify-content:center;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.card{width:min(430px,100%);background:#fff;border:1px solid #dce5ee;border-radius:22px;padding:22px 18px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}
.badge{display:inline-block;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:#eef6ff;color:#23679d;font-size:12px;font-weight:800;letter-spacing:.25px}
.icon{width:96px;height:96px;display:block;margin:0 auto 12px;border-radius:22px}.title{font-size:21px;font-weight:900;line-height:1.25}.project{margin:7px 0 14px;color:#52657a;font-weight:700}.status{margin:0 0 10px;padding:11px 12px;border:1px solid #e0e7ef;border-radius:12px;background:#f8fafc;color:#52657a;font-size:13px;line-height:1.45;text-align:left}
button,a.btn{display:block;width:100%;min-height:52px;border-radius:13px;border:1px solid #cfd9e4;padding:14px 12px;margin-top:10px;font:800 16px/1.2 "Segoe UI",Tahoma,Arial,sans-serif;text-decoration:none;cursor:pointer}
#installBtn{background:#23679d;color:#fff;border-color:#23679d}#installBtn:disabled{opacity:.55;cursor:not-allowed}#openBtn{background:#fff;color:#23679d}.note{margin-top:14px;font-size:12px;line-height:1.5;color:#708196}
</style>
</head>
<body>
<div class="card">
  <div class="badge">CÀI ĐẶT ICON RA MÀN HÌNH</div>
  <img id="appIcon" class="icon" src="./icon-water-meter.svg?v=20261004-3" alt="Icon Ghi Chỉ Số Nước">
  <div class="title">GHI CHỈ SỐ NƯỚC</div>
  <div id="projectText" class="project">Dự án: ...</div>
  <div id="status" class="status">Đang chuẩn bị chế độ cài đặt...</div>
  <button id="installBtn" type="button">CÀI ICON</button>
  <a id="openBtn" class="btn" href="#">MỞ APP</a>
  <div class="note">Designed by Mr.Hoa - Hotline: 0915176386</div>
</div>
<script>
(function(){
  'use strict';
  const BUILD='ICON_MODULE_V2_20261004_INSTALL_FIX_3';
  const params=new URLSearchParams(location.search);
  const project=String(params.get('project')||params.get('projectId')||'').trim().toUpperCase();
  const projectName=String(params.get('projectName')||'').trim();
  const valid=/^[A-Z0-9_-]{2,40}$/.test(project);
  const projectText=document.getElementById('projectText');
  const status=document.getElementById('status');
  const installBtn=document.getElementById('installBtn');
  const openBtn=document.getElementById('openBtn');
  let deferredPrompt=null;
  let manifestAdded=false;

  const repoBase=new URL('../',location.href);
  const appUrl=valid
    ? new URL('r1135-v20-direct.html?project='+encodeURIComponent(project),repoBase).href
    : new URL('r1135-v20-direct.html',repoBase).href;
  openBtn.href=appUrl;

  function setStatus(text){status.textContent=text;}

  function addProjectManifest(){
    if(!valid||manifestAdded)return;
    const old=document.querySelector('link[data-water-project-manifest]');
    if(old)old.remove();
    const link=document.createElement('link');
    link.rel='manifest';
    link.setAttribute('data-water-project-manifest','v2');
    link.href=new URL('manifest-project.webmanifest?project='+encodeURIComponent(project)+'&icon=v2&v=20261004-3',repoBase).href;
    document.head.appendChild(link);
    manifestAdded=true;
  }

  async function setupProjectPwa(){
    if(!valid)return;
    if(!('serviceWorker' in navigator)){
      setStatus('Trình duyệt này không hỗ trợ cài ứng dụng PWA. Hãy mở link bằng Chrome hoặc Edge.');
      return;
    }
    try{
      const swUrl=new URL('sw-pwa.js?v=20261004-icon-v2-fix3',repoBase).href;
      const scope=repoBase.pathname;
      await navigator.serviceWorker.register(swUrl,{scope:scope,updateViaCache:'none'});
      await navigator.serviceWorker.ready;

      if(!navigator.serviceWorker.controller){
        await new Promise(function(resolve){
          let done=false;
          const finish=function(){if(done)return;done=true;clearTimeout(timer);resolve();};
          const timer=setTimeout(finish,3500);
          navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});
        });
      }

      addProjectManifest();
      setStatus('Đã sẵn sàng. Bấm CÀI ICON. Nếu hộp cài chưa hiện ngay, chờ 2–3 giây rồi bấm lại.');
    }catch(e){
      setStatus('Không khởi tạo được chế độ cài đặt. Hãy tải lại trang bằng Chrome/Edge rồi thử lại.');
    }
  }

  if(valid){
    projectText.textContent='Dự án: '+(projectName?projectName+' · ':'')+project;
    try{localStorage.setItem('water_pwa_project',project);}catch(e){}
    setupProjectPwa();
  }else{
    projectText.textContent='Chưa xác định dự án';
    installBtn.disabled=true;
    setStatus('Link cài Icon chưa có PROJECT_ID hợp lệ.');
  }

  window.addEventListener('beforeinstallprompt',function(ev){
    ev.preventDefault();
    deferredPrompt=ev;
    installBtn.disabled=false;
    setStatus('Sẵn sàng cài đặt. Bấm CÀI ICON để đưa ứng dụng ra màn hình.');
  });

  installBtn.addEventListener('click',async function(){
    if(!valid)return;
    if(deferredPrompt){
      const promptEvent=deferredPrompt;
      deferredPrompt=null;
      promptEvent.prompt();
      try{
        const choice=await promptEvent.userChoice;
        if(choice&&choice.outcome==='accepted'){
          setStatus('Đã xác nhận cài đặt. Icon sẽ xuất hiện trên màn hình thiết bị.');
        }else{
          setStatus('Bạn đã hủy cài đặt. Có thể bấm CÀI ICON để thử lại sau khi tải lại trang.');
        }
      }catch(e){
        setStatus('Không mở được hộp cài. Hãy dùng menu ⋮ của Chrome/Edge → Cài đặt ứng dụng.');
      }
      return;
    }

    addProjectManifest();
    setStatus('Chrome/Edge chưa mở hộp cài tự động. Hãy chọn menu ⋮ → Cài đặt ứng dụng / Install app. Nếu chưa thấy mục này, tải lại trang một lần rồi bấm CÀI ICON.');
  });

  window.addEventListener('appinstalled',function(){
    setStatus('ICON đã được cài đặt ra màn hình. Hãy bấm icon Ghi Chỉ Số Nước để chạy App.');
    installBtn.disabled=true;
  });

  window.WATER_ICON_MODULE_V2={BUILD:BUILD,project:project,projectName:projectName,valid:valid,appUrl:appUrl};
})();
</script>
</body>
</html>
