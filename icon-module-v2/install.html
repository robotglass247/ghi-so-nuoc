<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23679d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest?v=20261004-4">
<link rel="icon" href="./icon-water-meter.svg?v=20261004-4" type="image/svg+xml">
<title>Cài Ứng dụng Ghi Chỉ Số Nước</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:center;justify-content:center;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.card{width:min(430px,100%);background:#fff;border:1px solid #dce5ee;border-radius:22px;padding:22px 18px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}
.badge{display:inline-block;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:#eef6ff;color:#23679d;font-size:12px;font-weight:800;letter-spacing:.25px}
.icon{width:96px;height:96px;display:block;margin:0 auto 12px;border-radius:22px}.title{font-size:21px;font-weight:900;line-height:1.25}.project{margin:7px 0 14px;color:#52657a;font-weight:700}.status{margin:0 0 10px;padding:11px 12px;border:1px solid #e0e7ef;border-radius:12px;background:#f8fafc;color:#52657a;font-size:13px;line-height:1.45;text-align:left}
button,a.btn{display:block;width:100%;min-height:52px;border-radius:13px;border:1px solid #cfd9e4;padding:14px 12px;margin-top:10px;font:800 16px/1.2 "Segoe UI",Tahoma,Arial,sans-serif;text-decoration:none;cursor:pointer}
#installBtn{background:#23679d;color:#fff;border-color:#23679d}#installBtn:disabled{opacity:.55;cursor:not-allowed}#openBtn{background:#fff;color:#23679d}.note{margin-top:14px;font-size:12px;line-height:1.5;color:#708196}
</style>
</head>
<body>
<div class="card">
  <div class="badge">CÀI ĐẶT ICON RA MÀN HÌNH</div>
  <img class="icon" src="./icon-water-meter.svg?v=20261004-4" alt="Icon Ghi Chỉ Số Nước">
  <div class="title">GHI CHỈ SỐ NƯỚC</div>
  <div id="projectText" class="project">Dự án: ...</div>
  <div id="status" class="status">Đang kiểm tra khả năng cài đặt...</div>
  <button id="installBtn" type="button">CÀI ICON</button>
  <a id="openBtn" class="btn" href="#">MỞ APP</a>
  <div class="note">Designed by Mr.Hoa - Hotline: 0915176386</div>
</div>
<script>
(function(){
  'use strict';
  const BUILD='ICON_MODULE_V2_20261004_STATIC_MANIFEST_4';
  const params=new URLSearchParams(location.search);
  const project=String(params.get('project')||params.get('projectId')||'').trim().toUpperCase();
  const projectName=String(params.get('projectName')||'').trim();
  const valid=/^[A-Z0-9_-]{2,40}$/.test(project);
  const projectText=document.getElementById('projectText');
  const status=document.getElementById('status');
  const installBtn=document.getElementById('installBtn');
  const openBtn=document.getElementById('openBtn');
  let deferredPrompt=null;

  const repoBase=new URL('../',location.href);
  const appUrl=valid
    ? new URL('r1135-v20-direct.html?project='+encodeURIComponent(project),repoBase).href
    : new URL('r1135-v20-direct.html',repoBase).href;
  openBtn.href=appUrl;

  function setStatus(text){status.textContent=text;}

  async function setupPwa(){
    if(!valid)return;
    try{
      localStorage.setItem('water_pwa_project',project);
      sessionStorage.setItem('water_pwa_project',project);
    }catch(e){}

    if(!('serviceWorker' in navigator)){
      setStatus('Trình duyệt này không hỗ trợ cài ứng dụng. Hãy mở bằng Chrome hoặc Edge.');
      return;
    }

    try{
      const reg=await navigator.serviceWorker.register(new URL('sw-pwa.js?v=20261004-static-manifest-4',repoBase).href,{scope:repoBase.pathname,updateViaCache:'none'});
      await navigator.serviceWorker.ready;
      try{await reg.update();}catch(e){}
      setStatus('Đang chờ Chrome/Edge mở quyền cài đặt. Chờ 2–3 giây rồi bấm CÀI ICON.');
    }catch(e){
      setStatus('Không khởi tạo được chế độ cài đặt. Hãy tải lại trang bằng Chrome/Edge.');
    }
  }

  if(valid){
    projectText.textContent='Dự án: '+(projectName?projectName+' · ':'')+project;
    setupPwa();
  }else{
    projectText.textContent='Chưa xác định dự án';
    installBtn.disabled=true;
    setStatus('Link cài Icon chưa có PROJECT_ID hợp lệ.');
  }

  window.addEventListener('beforeinstallprompt',function(ev){
    ev.preventDefault();
    deferredPrompt=ev;
    installBtn.disabled=false;
    setStatus('Sẵn sàng cài đặt. Bấm CÀI ICON.');
  });

  installBtn.addEventListener('click',async function(){
    if(!valid)return;
    try{
      localStorage.setItem('water_pwa_project',project);
      sessionStorage.setItem('water_pwa_project',project);
    }catch(e){}

    if(deferredPrompt){
      const ev=deferredPrompt;
      deferredPrompt=null;
      try{
        await ev.prompt();
        const choice=await ev.userChoice;
        if(choice&&choice.outcome==='accepted'){
          setStatus('Đã xác nhận cài đặt. Icon sẽ xuất hiện trên màn hình thiết bị.');
        }else{
          setStatus('Bạn đã hủy cài đặt. Tải lại trang nếu muốn cài lại.');
        }
      }catch(e){
        setStatus('Không mở được hộp cài. Hãy dùng menu ⋮ → Cài đặt ứng dụng.');
      }
      return;
    }

    setStatus('Chrome/Edge chưa phát quyền cài. Hãy nhấn Ctrl+R để tải lại trang, chờ 2–3 giây rồi bấm CÀI ICON. Nếu vẫn chưa hiện, mở menu ⋮ → Cài đặt ứng dụng / Install app.');
  });

  window.addEventListener('appinstalled',function(){
    setStatus('ICON đã được cài đặt. Hãy bấm icon Ghi Chỉ Số Nước để chạy App.');
    installBtn.disabled=true;
  });

  window.WATER_ICON_MODULE_V2={BUILD,project,projectName,valid,appUrl};
})();
</script>
</body>
</html>
