<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23679d">
<link rel="icon" href="./icon-water-meter.svg?v=20261004-gateway-4" type="image/svg+xml">
<title>Mở trình duyệt để cài Ghi Chỉ Số Nước - PKG001</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.card{width:min(430px,100%);background:#fff;border:1px solid #dce5ee;border-radius:24px;padding:22px 18px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}
.badge{display:inline-block;margin-bottom:12px;padding:6px 11px;border-radius:999px;background:#eef6ff;color:#23679d;font-size:12px;font-weight:800}.icon{width:96px;height:96px;display:block;margin:0 auto 12px;border-radius:22px}.title{font-size:22px;font-weight:900;line-height:1.25}.project{margin:7px 0 14px;color:#52657a;font-weight:700}.box{margin:10px 0 14px;padding:13px;border:1px solid #d8e5f0;border-radius:13px;background:#f8fbff;color:#334155;font-size:14px;line-height:1.55;text-align:left}.btn{display:block;width:100%;min-height:54px;border:1px solid #23679d;border-radius:14px;background:#23679d;color:#fff;text-decoration:none;padding:16px 12px;font-size:16px;font-weight:900;cursor:pointer}.btn.secondary{margin-top:10px;background:#fff;color:#23679d}.small{margin-top:12px;color:#64748b;font-size:12px;line-height:1.5}.note{margin-top:14px;font-size:12px;color:#708196}
</style>
</head>
<body>
<div class="card">
  <div class="badge">CÀI ĐẶT ICON</div>
  <img class="icon" src="./icon-water-meter.svg?v=20261004-gateway-4" alt="Icon Ghi Chỉ Số Nước">
  <div class="title">GHI CHỈ SỐ NƯỚC</div>
  <div class="project">Dự án: PKG001</div>
  <div id="box" class="box">Đang mở bộ cài...</div>
  <a id="openBtn" class="btn" href="#">MỞ BẰNG CHROME</a>
  <button id="copyBtn" class="btn secondary" type="button" style="display:none">SAO CHÉP LINK</button>
  <div id="small" class="small"></div>
  <div class="note">Designed by Mr.Hoa - Hotline: 0915176386</div>
</div>
<script>
(function(){
  'use strict';
  const ua=navigator.userAgent||'';
  const isZalo=/Zalo/i.test(ua);
  const isAndroid=/Android/i.test(ua);
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const box=document.getElementById('box');
  const openBtn=document.getElementById('openBtn');
  const copyBtn=document.getElementById('copyBtn');
  const small=document.getElementById('small');

  // Đây là bộ cài PASS, đóng băng đúng logic select-2 đã test OK.
  const passUrl=new URL('./install-PKG001-select-pass.html?v=20261004-select-2-pass',location.href).href;

  function chromeIntent(url){
    const u=new URL(url);
    return 'intent://'+u.host+u.pathname+u.search+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(url)+';end';
  }

  async function copyPassLink(){
    try{
      await navigator.clipboard.writeText(passUrl);
      copyBtn.textContent='ĐÃ SAO CHÉP LINK';
      box.innerHTML='Đã sao chép link. Hãy mở <b>Safari</b>, dán link vào thanh địa chỉ và mở.';
    }catch(e){
      const ta=document.createElement('textarea');
      ta.value=passUrl;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');copyBtn.textContent='ĐÃ SAO CHÉP LINK';}catch(err){}
      ta.remove();
    }
  }

  // Không ở Zalo: đi thẳng vào đúng bộ cài PASS.
  if(!isZalo){
    location.replace(passUrl);
    return;
  }

  // Zalo Android: ép mở chính bộ cài PASS bằng Chrome.
  if(isAndroid){
    const intentUrl=chromeIntent(passUrl);
    box.innerHTML='Bạn đang mở trong <b>Zalo</b>. Hệ thống sẽ chuyển sang <b>Chrome</b>, sau đó chạy đúng bộ cài đã test PASS.';
    openBtn.textContent='MỞ BẰNG CHROME';
    openBtn.href=intentUrl;
    small.innerHTML='Nếu Chrome chưa tự mở, bấm <b>MỞ BẰNG CHROME</b>. Không cài trực tiếp trong trình duyệt của Zalo.';
    setTimeout(function(){try{location.href=intentUrl;}catch(e){}},400);
    return;
  }

  // Zalo iPhone/iPad: iOS không cho website ép Safari ổn định.
  if(isIOS){
    box.innerHTML='Bạn đang mở trong <b>Zalo</b>. Hãy bấm dấu <b>…</b> → <b>Mở bằng Safari</b>. Sau khi mở Safari sẽ chạy đúng bộ cài đã test PASS.';
    openBtn.style.display='none';
    copyBtn.style.display='block';
    small.innerHTML='Nếu không thấy “Mở bằng Safari”, bấm <b>SAO CHÉP LINK</b>, rồi mở Safari và dán link.';
    copyBtn.addEventListener('click',copyPassLink);
    return;
  }

  openBtn.textContent='MỞ TRÌNH DUYỆT';
  openBtn.href=passUrl;
  box.textContent='Hãy mở bộ cài bằng trình duyệt bên ngoài Zalo.';
})();
</script>
</body>
</html>
