<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#23679d"><title>Cài Icon - Ghi Chỉ Số Nước</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.card{width:min(460px,100%);background:#fff;border:1px solid #dce5ee;border-radius:24px;padding:22px 18px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}
.badge{display:inline-block;margin-bottom:12px;padding:6px 11px;border-radius:999px;background:#eef6ff;color:#23679d;font-size:12px;font-weight:800}.icon{width:96px;height:96px;display:block;margin:0 auto 12px;border-radius:22px}.title{font-size:22px;font-weight:900;line-height:1.25}.project{margin:7px 0 18px;color:#52657a;font-weight:700}.question{font-size:15px;line-height:1.5;color:#475569;margin-bottom:12px}.option{display:block;width:100%;border:1px solid #cfd9e4;border-radius:16px;padding:16px 14px;margin-top:12px;text-decoration:none;text-align:left;background:#fff;color:#172033}.option.primary{border-color:#23679d;background:#f4f9ff}.opt-title{font-size:17px;font-weight:900;color:#23679d}.opt-desc{margin-top:5px;font-size:13px;line-height:1.45;color:#64748b}.device{font-size:26px;float:right;margin-left:10px}.hint{margin-top:14px;padding:10px 12px;border-radius:12px;background:#f8fafc;color:#64748b;font-size:12px;line-height:1.45}.note{margin-top:14px;font-size:12px;color:#708196}
</style></head><body><div class="card"><div class="badge">CÀI ĐẶT ICON - BẢN PASS</div><img class="icon" src="./icon-water-meter.svg" alt="Ghi Chỉ Số Nước"><div class="title">GHI CHỈ SỐ NƯỚC</div><div class="project" id="project"></div><div class="question">Bạn muốn cài ứng dụng trên thiết bị nào?</div><a class="option" id="pc"><span class="device">💻</span><div class="opt-title">CÀI TRÊN MÁY TÍNH</div><div class="opt-desc">Windows / Chrome / Edge</div></a><a class="option" id="mobile"><span class="device">📱</span><div class="opt-title">CÀI TRÊN ĐIỆN THOẠI</div><div class="opt-desc">Android / Chrome hoặc iPhone / Safari</div></a><div class="hint" id="hint"></div><div class="note">Designed by Mr.Hoa</div></div><script>(function(){const p=String(new URLSearchParams(location.search).get('project')||'').trim().toUpperCase();if(!/^[A-Z0-9_-]{2,40}$/.test(p)){document.getElementById('hint').textContent='Mã dự án không hợp lệ';return;}document.getElementById('project').textContent='Dự án: '+p;for(const [id,mode] of [['pc','desktop'],['mobile','mobile']])document.getElementById(id).href='./install-project-PASS.html?project='+encodeURIComponent(p)+'&mode='+mode;let mobile=/Android|iPhone|iPad|iPod/.test(navigator.userAgent);document.getElementById(mobile?'mobile':'pc').classList.add('primary');document.getElementById('hint').textContent=mobile?'Đã nhận diện điện thoại. Hãy chọn CÀI TRÊN ĐIỆN THOẠI.':'Đã nhận diện máy tính. Hãy chọn CÀI TRÊN MÁY TÍNH.';})();</script></body></html>
