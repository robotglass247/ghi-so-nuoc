<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23679d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest-PKG001.webmanifest?v=20261004-6">
<link rel="icon" href="./icon-water-meter.svg?v=20261004-6" type="image/svg+xml">
<title>Cài Ghi Chỉ Số Nước - PKG001</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:center;justify-content:center;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.card{width:min(430px,100%);background:#fff;border:1px solid #dce5ee;border-radius:22px;padding:22px 18px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}
.badge{display:inline-block;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:#eef6ff;color:#23679d;font-size:12px;font-weight:800;letter-spacing:.25px}.icon{width:96px;height:96px;display:block;margin:0 auto 12px;border-radius:22px}.title{font-size:21px;font-weight:900;line-height:1.25}.project{margin:7px 0 14px;color:#52657a;font-weight:700}.status{margin:0 0 10px;padding:11px 12px;border:1px solid #e0e7ef;border-radius:12px;background:#f8fafc;color:#52657a;font-size:13px;line-height:1.45;text-align:left}button,a.btn{display:block;width:100%;min-height:52px;border-radius:13px;border:1px solid #cfd9e4;padding:14px 12px;margin-top:10px;font:800 16px/1.2 "Segoe UI",Tahoma,Arial,sans-serif;text-decoration:none;cursor:pointer}#installBtn{background:#23679d;color:#fff;border-color:#23679d}#openBtn{background:#fff;color:#23679d}.note{margin-top:14px;font-size:12px;line-height:1.5;color:#708196}
</style>
</head>
<body>
<div class="card">
  <div class="badge">CÀI ĐẶT ICON RA MÀN HÌNH</div>
  <img class="icon" src="./icon-water-meter.svg?v=20261004-6" alt="Icon Ghi Chỉ Số Nước">
  <div class="title">GHI CHỈ SỐ NƯỚC</div>
  <div class="project">Dự án: PKG001</div>
  <div id="status" class="status">Đang kiểm tra môi trường cài đặt...</div>
  <button id="installBtn" type="button">CÀI ICON</button>
  <a id="openBtn" class="btn" href="../r1135-v20-direct.html?project=PKG001">MỞ APP</a>
  <div class="note">Designed by Mr.Hoa - Hotline: 0915176386</div>
</div>
<script>
(function(){
  'use strict';
  const status=document.getElementById('status');
  const installBtn=document.getElementById('installBtn');
  let deferredPrompt=null;

  const baseUrl=location.origin+location.pathname;
  const browserUrl=baseUrl+'?browser=1&v=20261004-6';
  const requestedBrowser=new URLSearchParams(location.search).get('browser')==='1';

  const displayModeApp=
    window.matchMedia('(display-mode: standalone)').matches ||
    window.matchMedia('(display-mode: minimal-ui)').matches ||
    window.matchMedia('(display-mode: fullscreen)').matches ||
    window.matchMedia('(display-mode: window-controls-overlay)').matches ||
    window.navigator.standalone===true;

  let chromeWindowWithoutAddressBar=false;
  try{
    const noLocation=(window.locationbar && window.locationbar.visible===false);
    const noToolbar=(window.toolbar && window.toolbar.visible===false);
    chromeWindowWithoutAddressBar=!!(noLocation&&noToolbar);
  }catch(e){}

  const appWindow=displayModeApp || (!requestedBrowser && chromeWindowWithoutAddressBar);

  function setStatus(t){status.textContent=t;}
  try{localStorage.setItem('water_pwa_project','PKG001');sessionStorage.setItem('water_pwa_project','PKG001');}catch(e){}

  function openNormalBrowser(){
    const w=window.open(browserUrl,'_blank','noopener,noreferrer');
    if(w){
      setStatus('Đã mở trang cài ở cửa sổ mới. Hãy chuyển sang cửa sổ Chrome/Edge có thanh địa chỉ và bấm CÀI ICON.');
      return;
    }
    setStatus('Hãy bấm dấu ⋮ ở góc trên bên phải cửa sổ này và chọn “Mở trong Chrome/Edge” hoặc “Open in browser”.');
  }

  if(appWindow){
    installBtn.textContent='MỞ TRÌNH DUYỆT ĐỂ CÀI';
    setStatus('Bạn đang ở cửa sổ App/shortcut không có thanh địa chỉ. Cửa sổ này không thể cài thêm PWA. Bấm nút dưới để mở trang cài trong trình duyệt bình thường.');
  }else if(!('serviceWorker' in navigator)){
    installBtn.disabled=true;
    setStatus('Trình duyệt này không hỗ trợ cài PWA. Hãy mở bằng Chrome hoặc Edge.');
  }else{
    navigator.serviceWorker.register('./sw-install.js?v=20261004-6',{scope:'./',updateViaCache:'none'})
      .then(function(reg){try{return reg.update();}catch(e){return reg;}})
      .then(function(){return navigator.serviceWorker.ready;})
      .then(function(){
        if(!deferredPrompt)setStatus('Đã mở đúng trình duyệt. Đang chờ Chrome/Edge xác nhận khả năng cài đặt...');
      })
      .catch(function(){setStatus('Không khởi tạo được PWA. Hãy tải lại trang bằng Chrome/Edge.');});
  }

  window.addEventListener('beforeinstallprompt',function(ev){
    ev.preventDefault();
    deferredPrompt=ev;
    installBtn.disabled=false;
    installBtn.textContent='CÀI ICON';
    setStatus('Sẵn sàng cài đặt. Bấm CÀI ICON để tạo biểu tượng trên máy.');
  });

  installBtn.addEventListener('click',async function(){
    if(appWindow){
      openNormalBrowser();
      return;
    }
    if(deferredPrompt){
      const ev=deferredPrompt;
      deferredPrompt=null;
      try{
        await ev.prompt();
        const choice=await ev.userChoice;
        if(choice&&choice.outcome==='accepted'){
          setStatus('Đã xác nhận cài đặt. Icon Ghi Chỉ Số Nước sẽ xuất hiện trên máy.');
          installBtn.disabled=true;
        }else{
          setStatus('Bạn đã hủy cài đặt. Tải lại trang nếu muốn thử lại.');
        }
      }catch(e){
        setStatus('Không mở được hộp cài. Hãy bấm menu ⋮ của Chrome/Edge → Cài đặt ứng dụng / Install app.');
      }
      return;
    }
    setStatus('Chrome/Edge chưa phát hộp cài. Hãy bấm Ctrl+R một lần. Nếu menu ⋮ có “Cài đặt ứng dụng / Install app”, chọn mục đó.');
  });

  window.addEventListener('appinstalled',function(){
    setStatus('Đã cài ICON Ghi Chỉ Số Nước - PKG001 thành công.');
    installBtn.disabled=true;
  });
})();
</script>
</body>
</html>
