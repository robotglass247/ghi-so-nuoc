<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#23679d"><link rel="manifest" href="./manifest.webmanifest?v=2"><title>TEST 02 – Ghi Chỉ Số Nước</title><style>body{font:16px Arial;background:#f4f7fb;padding:25px;color:#142539}main{max-width:470px;margin:auto;background:white;padding:24px;border-radius:20px;text-align:center}img{width:95px}button{background:#23679d;color:white;font-size:19px;font-weight:bold;border:0;padding:16px;width:100%;border-radius:12px}button:disabled{opacity:.45}#status{background:#eef4fa;text-align:left;padding:15px;border-radius:10px;margin:18px 0;line-height:1.6}</style></head><body><main><b>TEST 02 — MANIFEST TĨNH</b><p><img src="../icon-water-meter.svg"></p><h2>GHI CHỈ SỐ NƯỚC</h2><p>Dự án: TEST_GIAM_TRIGGER</p><div id="status">Đang chuẩn bị...</div><button id="install" disabled>CÀI ICON</button><p><small>Bản thử riêng, không sửa Registry hoặc bản PASS</small></p></main><script>
const status=document.getElementById('status'),btn=document.getElementById('install');let prompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e;btn.disabled=false;status.textContent='Chrome đã cấp quyền mở hộp cài. Bấm CÀI ICON.';});
window.addEventListener('appinstalled',()=>{btn.disabled=true;status.textContent='PASS: Chrome xác nhận appinstalled.';});
btn.onclick=async()=>{if(!prompt)return;const e=prompt;prompt=null;btn.disabled=true;try{await e.prompt();const answer=await e.userChoice;status.textContent=answer?.outcome==='accepted'?'Đã xác nhận cài. Chờ Chrome xác nhận appinstalled.':'Đã hủy cài.';}catch(err){status.textContent='Lỗi Chrome: '+err.message;}};
(async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;if(!navigator.serviceWorker.controller){if(!sessionStorage.getItem('test02-reload')){sessionStorage.setItem('test02-reload','1');location.reload();return;}status.textContent='Service Worker chưa kiểm soát trang.';return;}status.textContent='Manifest tĩnh và Service Worker đã sẵn sàng. Đang chờ Chrome kiểm tra điều kiện cài đặt.';setTimeout(()=>{if(!prompt)status.textContent='Chrome vẫn chưa gửi beforeinstallprompt. Hãy mở DevTools → Application → Manifest để xem lỗi cụ thể.';},7500);}catch(err){status.textContent='Lỗi Service Worker: '+err.message}})();
</script></body></html>
