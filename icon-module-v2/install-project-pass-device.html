<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#23679d"><title>Cài Ghi Chỉ Số Nước</title><link rel="icon" href="./icon-water-meter.svg" type="image/svg+xml"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:#f4f7fb;display:grid;place-items:center;font-family:Arial,sans-serif;color:#172033}.card{max-width:450px;width:100%;border:1px solid #dce5ee;border-radius:22px;padding:22px;background:#fff;text-align:center;box-shadow:0 16px 38px #0f172a16}.icon{width:94px;height:94px;border-radius:20px}.badge{display:inline-block;background:#eef6ff;color:#23679d;font-weight:bold;border-radius:30px;padding:8px 12px;font-size:13px}h1{font-size:23px}.project{color:#52657a;font-weight:bold}.btn,button{display:block;width:100%;border-radius:13px;padding:16px;text-decoration:none;font-size:17px;font-weight:bold;border:1px solid #23679d;margin-top:12px;background:#23679d;color:white;cursor:pointer}.secondary{background:white;color:#23679d}.status{background:#f7fafc;padding:12px;border-radius:10px;margin-top:15px;line-height:1.5;text-align:left;color:#445}.small{font-size:12px;color:#64748b;margin-top:15px}</style><script>window.__deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__deferred=e;});</script></head><body><main class="card"><div class="badge">CÀI ĐẶT ICON – MẪU PASS</div><p><img class="icon" src="./icon-water-meter.svg" alt="Icon"></p><h1>GHI CHỈ SỐ NƯỚC</h1><p class="project">Dự án: <span id="pid"></span></p><div id="status" class="status">Đang khởi tạo bộ cài...</div><button id="install">CÀI ICON</button><a id="open" class="btn secondary">MỞ APP</a><a id="back" class="small">← Chọn thiết bị</a></main><script>(async()=>{const project=(new URLSearchParams(location.search).get('project')||'').trim().toUpperCase();const valid=/^[A-Z0-9_-]{2,40}$/.test(project);if(!valid){document.body.textContent='Mã PROJECT_ID không hợp lệ';throw Error('Invalid project');}document.getElementById('pid').textContent=project;const suffix='?project='+encodeURIComponent(project);const mode=new URLSearchParams(location.search).get('mode')==='mobile'?'mobile':'desktop';const app='../r1135-v20-direct.html'+suffix;const status=document.getElementById('status');const btn=document.getElementById('install');document.getElementById('open').href=app;document.getElementById('back').href='install-project-pass.html'+suffix;const link=document.createElement('link');link.rel='manifest';link.href='../manifest-project.webmanifest'+suffix+'&package=v1&mode='+mode+'&v=20261022-generic-pass-1';document.head.appendChild(link);function msg(t){status.textContent=t;}btn.onclick=async()=>{if(window.__deferred){let e=window.__deferred;window.__deferred=null;try{await e.prompt();let choice=await e.userChoice;if(choice&&choice.outcome==='accepted'){msg('Đã xác nhận cài đặt. Mở icon mới trên màn hình để vào dự án '+project+'.');}else msg('Đã hủy cài đặt. Tải lại trang để thử.');}catch(err){msg('Chrome không mở được hộp cài: '+err.message);}}else {msg(/iPhone|iPad/i.test(navigator.userAgent)?'Trên Safari: Chia sẻ → Thêm vào Màn hình chính → Thêm.':'Trong Chrome: nhấn dấu ⋮ → Cài đặt ứng dụng hoặc Thêm vào màn hình chính. Nếu không thấy, tải lại trang.');}};window.addEventListener('appinstalled',()=>msg('Đã cài icon thành công. Mở icon trên màn hình để vào '+project+'.'));if(/Zalo/i.test(navigator.userAgent)){msg('Đang mở trong Zalo. Hãy dùng menu Zalo → Mở bằng Chrome.');return;}try{if('serviceWorker' in navigator){await navigator.serviceWorker.register('../sw-pwa.js?v=20261022-generic-pass-1',{scope:'../',updateViaCache:'none'});await navigator.serviceWorker.ready;}}catch(e){msg('Không khởi tạo được Service Worker: '+e.message);return;}msg('Sẵn sàng. Bấm CÀI ICON; nếu Chrome chưa hiện hộp cài, trang sẽ hướng dẫn thêm vào màn hình chính.');})();</script></body></html>
