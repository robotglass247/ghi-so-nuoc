<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#23679d"><title>Cài icon Ghi Chỉ Số Nước</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:#f4f7fb;display:grid;place-items:center;font-family:Arial,sans-serif;color:#172033}.card{max-width:450px;width:100%;border:1px solid #dce5ee;border-radius:22px;padding:22px;background:#fff;text-align:center;box-shadow:0 16px 38px #0f172a16}.icon{width:94px;height:94px;border-radius:20px}.badge{display:inline-block;background:#eef6ff;color:#23679d;font-weight:bold;border-radius:30px;padding:8px 12px;font-size:13px}h1{font-size:23px}.project{color:#52657a;font-weight:bold}.btn,button{display:block;width:100%;border-radius:13px;padding:16px;text-decoration:none;font-size:17px;font-weight:bold;border:1px solid #23679d;margin-top:12px;background:#23679d;color:white;cursor:pointer}.secondary{background:white;color:#23679d}.status{background:#f7fafc;padding:12px;border-radius:10px;margin-top:15px;line-height:1.5;text-align:left;color:#445}.small{font-size:12px;color:#64748b;margin-top:15px}</style></head><body><main class="card"><div class="badge">CÀI ĐẶT ICON – MẪU PASS</div><p><img class="icon" src="./icon-water-meter.svg" alt="Icon"></p><h1>GHI CHỈ SỐ NƯỚC</h1><p class="project">Dự án: <span id="pid"></span></p><p>Chọn thiết bị muốn cài đặt:</p><a class="btn" id="desktop">💻 CÀI TRÊN MÁY TÍNH</a><a class="btn secondary" id="mobile">📱 CÀI TRÊN ĐIỆN THOẠI</a><p class="small" id="hint"></p></main><script>const project=(new URLSearchParams(location.search).get('project')||'').trim().toUpperCase();const valid=/^[A-Z0-9_-]{2,40}$/.test(project);if(!valid){document.body.textContent='Mã PROJECT_ID không hợp lệ';throw Error('Invalid project');}document.getElementById('pid').textContent=project;const suffix='?project='+encodeURIComponent(project);document.getElementById('desktop').href='install-project-pass-device.html'+suffix+'&mode=desktop';document.getElementById('mobile').href='install-project-pass-device.html'+suffix+'&mode=mobile';document.getElementById('hint').textContent=/Android|iPhone|iPad/i.test(navigator.userAgent)?'Đã nhận diện điện thoại. Chọn CÀI TRÊN ĐIỆN THOẠI.':'Đã nhận diện máy tính. Chọn CÀI TRÊN MÁY TÍNH.';</script></body></html>
