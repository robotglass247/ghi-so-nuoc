<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#23679d"><title>Cài Icon Ghi Chỉ Số Nước</title><link rel="icon" href="./icon-water-meter.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fb;color:#172033;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}

</style><script>window.__installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__installPrompt=e;window.dispatchEvent(new Event('pwa-prompt-ready'));});</script></head><body><div class="card"><div class="badge">CÀI ĐẶT ICON - BẢN PASS</div><img class="icon" src="./icon-water-meter.svg" alt="Ghi Chỉ Số Nước"><div class="title">GHI CHỈ SỐ NƯỚC</div><div class="project" id="project"></div><div id="status" class="status">Đang chuẩn bị bộ cài...</div><button id="installBtn">CÀI ICON</button><div id="steps" class="steps"></div><a class="btn" id="openBtn">MỞ APP</a><a class="back" id="backLink">← Chọn lại thiết bị</a><div class="note">Designed by Mr.Hoa</div></div><script>(async function(){const q=new URLSearchParams(location.search),project=(q.get('project')||'').trim().toUpperCase(),mode=q.get('mode')==='desktop'?'desktop':'mobile',valid=/^[A-Z0-9_-]{2,40}$/.test(project);const $=s=>document.getElementById(s),msg=s=>$('status').textContent=s,steps=s=>{$('steps').innerHTML=s;$('steps').classList.add('show');};$('project').textContent='Dự án: '+project;$('backLink').href='./install-project-PASS-select.html?project='+encodeURIComponent(project);$('openBtn').href='../r1135-v20-direct.html?project='+encodeURIComponent(project);if(!valid){msg('PROJECT_ID không hợp lệ');$('installBtn').disabled=true;return;}if(!('serviceWorker'in navigator)){msg('Trình duyệt không hỗ trợ cài ứng dụng');return;}const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);const isAndroid=/Android/.test(navigator.userAgent);if(matchMedia('(display-mode:standalone)').matches||navigator.standalone===true){msg('Ứng dụng đã được cài. Nhấn MỞ APP.');$('installBtn').disabled=true;return;}function promptReady(){if(window.__installPrompt)msg('Sẵn sàng cài đặt. Bấm CÀI ICON.');}window.addEventListener('pwa-prompt-ready',promptReady);window.addEventListener('appinstalled',()=>{msg('Chrome xác nhận cài thành công.');$('installBtn').disabled=true;});$('installBtn').onclick=async()=>{if(window.__installPrompt){let e=window.__installPrompt;window.__installPrompt=null;try{await e.prompt();const ans=await e.userChoice;msg(ans&&ans.outcome==='accepted'?'Đã xác nhận cài. Chờ Chrome hoàn tất...':'Đã hủy. Tải lại trang nếu muốn thử lại.');}catch(err){msg('Không mở được hộp cài: '+err.message);}return;}if(isIOS){msg('Mở bằng Safari để thêm vào màn hình chính.');steps('<b>iPhone:</b> Safari → Chia sẻ → Thêm vào Màn hình chính → Thêm.');}else{msg('Chrome chưa phát sự kiện cài. Bạn vẫn có thể thêm icon bằng menu trình duyệt.');steps('<b>Android:</b> Bấm ⋮ của Chrome → Cài đặt ứng dụng / Thêm vào màn hình chính → Cài đặt.');}};try{await navigator.serviceWorker.register('../sw-pwa.js?v=project-pass-v1',{scope:'../',updateViaCache:'none'});await navigator.serviceWorker.ready;if(!navigator.serviceWorker.controller){if(q.get('_ready')!=='1'){q.set('_ready','1');location.replace(location.pathname+'?'+q.toString());return;}}let link=document.createElement('link');link.rel='manifest';link.href='../manifest-project.webmanifest?project='+encodeURIComponent(project)+'&package=v1&mode='+mode+'&v=project-pass-v1';document.head.appendChild(link);promptReady();setTimeout(()=>{if(!window.__installPrompt)msg('Nếu Chrome chưa mở hộp cài, hãy bấm CÀI ICON để xem cách cài qua menu Chrome.');},4000);}catch(e){msg('Lỗi khởi tạo cài: '+e.message);}})();</script></body></html>
