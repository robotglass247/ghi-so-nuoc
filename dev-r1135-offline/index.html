<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#174a7e">
<title>WaterOps Pro</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:Arial,sans-serif}
body{visibility:hidden}
</style>
</head>
<body>
<script>
(async function(){
  const SW='./sw-r1135-offline-dev.js?v=15';

  async function ensureDevWorker(){
    if(!('serviceWorker' in navigator))return;
    try{
      const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
      try{reg.update();}catch(e){}

      // Không chặn việc mở App nếu Service Worker đang cập nhật/cài lại.
      // Chờ tối đa 1,2 giây rồi tiếp tục chạy App bằng mạng bình thường.
      try{
        await Promise.race([
          navigator.serviceWorker.ready,
          new Promise(resolve=>setTimeout(resolve,1200))
        ]);
      }catch(e){}
    }catch(e){
      // Service Worker lỗi không được phép làm treo App.
    }
  }

  try{
    await ensureDevWorker();

    const res=await fetch('../r9-direct-1135.html?offlineShell=15&t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    let html=await res.text();

    const pwaHead=''
      +'<base href="../">'
      +'<link rel="manifest" href="./dev-r1135-offline/waterops-pro.webmanifest?v=3">'
      +'<meta name="theme-color" content="#174a7e">'
      +'<meta name="mobile-web-app-capable" content="yes">'
      +'<meta name="apple-mobile-web-app-capable" content="yes">'
      +'<meta name="apple-mobile-web-app-title" content="WaterOps Pro">'
      +'<meta name="apple-mobile-web-app-status-bar-style" content="default">'
      +'<link rel="icon" type="image/svg+xml" href="./dev-r1135-offline/waterops-pro-icon-192.svg?v=1">'
      +'<link rel="apple-touch-icon" href="./dev-r1135-offline/waterops-pro-icon-192.svg?v=1">'
      +'<script src="./dev-r1135-offline/waterops-pwa-install.js?v=5"><\/script>'
      +'<style>#msg{display:none!important}</style>';

    html=html.replace('<head>','<head>'+pwaHead);
    html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>WaterOps Pro</title>');
    html=html.replace('<body>','<body style="visibility:visible">');

    html=html.replace(
      'let html=await res.text();',
      'let html=await res.text(); html=html.replace("<head>","<head><base href=\\"../\\">");'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.style.visibility='visible';
    document.body.innerHTML='<div style="padding:24px;font:600 16px Arial;color:#333">Chưa tải được WaterOps Pro. Kiểm tra kết nối mạng rồi tải lại trang.</div>';
  }
})();
</script>
</body>
</html>
