<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghi số nước R11.35 - Offline DEV</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:Arial,sans-serif}
body{visibility:hidden}
</style>
</head>
<body>
<script>
(async function(){
  const SW='./sw-r1135-offline-dev.js?v=9';

  async function ensureDevWorker(){
    if(!('serviceWorker' in navigator))return;
    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}
    await navigator.serviceWorker.ready;

    const ctl=navigator.serviceWorker.controller;
    if(!ctl||!String(ctl.scriptURL||'').includes('/dev-r1135-offline/sw-r1135-offline-dev.js')){
      await new Promise(resolve=>{
        let finished=false;
        const done=()=>{if(finished)return;finished=true;resolve();};
        navigator.serviceWorker.addEventListener('controllerchange',done,{once:true});
        setTimeout(done,1800);
      });
      location.replace('./index.html?ready='+Date.now());
      throw new Error('reload-for-dev-sw');
    }
  }

  try{
    await ensureDevWorker();

    const res=await fetch('../r9-direct-1135.html?offlineShell=11&t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    let html=await res.text();

    html=html.replace('<head>','<head><base href="../"><style>#msg{display:none!important}</style>');
    html=html.replace('<body>','<body style="visibility:visible">');

    html=html.replace(
      'let html=await res.text();',
      'let html=await res.text(); html=html.replace("<head>","<head><base href=\\"../\\">");'
    );

    /*
     * CHI SUA NGUON DOC DANH SACH THANG CUA R11.8.
     * Giao dien, nut FILE HE THONG, TAI FILE, XEM CHI SO va nguon du lieu export giu nguyen.
     * Ham loadMonths goc van goi jsonp("select J where J is not null").
     * Ta chi chan DUNG truy van nay va lay danh sach ky tu backend; cac truy van tai file
     * van doc TAI_CHI_SO_THANG nhu ban goc.
     */
    const monthPatch = `
const manageCodeFixed=manageCode.replace(
  "function jsonp(query){",
  "function jsonp(query){if(query==='select J where J is not null'){return new Promise(function(resolve,reject){const cb='__waterMonthsApi_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');let done=false;const timer=setTimeout(function(){finish(new Error('Het thoi gian doc danh sach thang.'));},15000);function finish(err,data){if(done)return;done=true;clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);err?reject(err):resolve(data);}window[cb]=function(data){if(!data||data.ok!==true||!Array.isArray(data.months)){finish(new Error('Khong doc duoc danh sach thang.'));return;}finish(null,{table:{rows:data.months.map(function(v){v=String(v||'').trim();return {c:[{v:v,f:v}]};})}});};script.onerror=function(){finish(new Error('Khong doc duoc danh sach thang.'));};script.src='https://script.google.com/macros/s/AKfycbxAH_a9-AcsKFAzEKkwhv_6xGOHrYyJwJbirqBuMhIP-39xZl-Cwg8ZuLclXkAFOM8/exec?api=months&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(script);});}"
);
`;

    html=html.replace(
      'const scripts=capturePass.concat(addons)',
      monthPatch+'\n    const scripts=capturePass.concat(addons)'
    );
    html=html.replace(
      "manageCode+'</'+'script>",
      "manageCodeFixed+'</'+'script>"
    );

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    if(String(err&&err.message)==='reload-for-dev-sw')return;
    document.body.style.visibility='visible';
    document.body.innerHTML='<div style="padding:24px;font:600 16px Arial;color:#333">Chưa khởi tạo được chế độ offline. Hãy mở link này một lần khi có mạng rồi thử lại.</div>';
  }
})();
</script>
</body>
</html>
