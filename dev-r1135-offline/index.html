<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#174a7e">
<title>WaterOps Pro</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:Arial,sans-serif}
body{visibility:hidden}
</style>
</head>
<body>
<script>
(async function(){
  const SW='./sw-r1135-offline-dev.js?v=14';

  async function ensureDevWorker(){
    if(!('serviceWorker' in navigator))return;
    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}
    await navigator.serviceWorker.ready;

    const ctl=navigator.serviceWorker.controller;
    if(!ctl||!String(ctl.scriptURL||'').includes('/dev-r1135-offline/sw-r1135-offline-dev.js')){
      await new Promise(resolve=>{
        let finished=false;
        const done=()=>{if(finished)return;finished=true;resolve();};
        navigator.serviceWorker.addEventListener('controllerchange',done,{once:true});
        setTimeout(done,1800);
      });
      location.replace('./index.html?ready='+Date.now());
      throw new Error('reload-for-dev-sw');
    }
  }

  try{
    await ensureDevWorker();

    const res=await fetch('../r9-direct-1135.html?offlineShell=14&t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    let html=await res.text();

    const pwaHead=''
      +'<base href="../">'
      +'<link rel="manifest" href="./dev-r1135-offline/waterops-pro.webmanifest?v=1">'
      +'<meta name="theme-color" content="#174a7e">'
      +'<meta name="mobile-web-app-capable" content="yes">'
      +'<meta name="apple-mobile-web-app-capable" content="yes">'
      +'<meta name="apple-mobile-web-app-title" content="WaterOps Pro">'
      +'<meta name="apple-mobile-web-app-status-bar-style" content="default">'
      +'<link rel="icon" type="image/svg+xml" href="./dev-r1135-offline/waterops-pro-icon.svg?v=1">'
      +'<link rel="apple-touch-icon" href="./dev-r1135-offline/waterops-pro-icon.svg?v=1">'
      +'<script src="./dev-r1135-offline/waterops-pwa-install.js?v=3"><\/script>'
      +'<style>#msg{display:none!important}</style>';

    html=html.replace('<head>','<head>'+pwaHead);
    html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>WaterOps Pro</title>');
    html=html.replace('<body>','<body style="visibility:visible">');

    html=html.replace(
      'let html=await res.text();',
      'let html=await res.text(); html=html.replace("<head>","<head><base href=\\"../\\">");'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    if(String(err&&err.message)==='reload-for-dev-sw')return;
    document.body.style.visibility='visible';
    document.body.innerHTML='<div style="padding:24px;font:600 16px Arial;color:#333">Chưa khởi tạo được WaterOps Pro. Hãy mở ứng dụng một lần khi có mạng rồi thử lại.</div>';
  }
})();
</script>
</body>
</html>
