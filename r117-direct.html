    html=html.replace(/<script[^>]+src=["']\.\/water-manage-(?:export|data)[^"']*\.js[^"']*["'][^>]*><\/script>\s*/gi,'');

    // Khôi phục đúng phần trình bày cơ sở của mốc FINAL10 R4 PASS.
    const progressHtml='  <div id="progressBar" role="status" aria-live="polite">Tổng: <b id="progressTotal">----</b> · Đã chụp: <b id="progressDone">----</b> · Chưa chụp: <b id="progressLeft">----</b> · Kỳ ghi: <b id="progressPeriod">--/----</b></div>';

    if(!html.includes('#progressBar{')){
      html=html.replace('canvas,iframe{display:none}\n</style>','canvas,iframe{display:none}\n#progressBar{background:#fff;padding:8px 3px;border-bottom:1px solid #ddd;text-align:center;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap;letter-spacing:-.35px;overflow:hidden}\n#progressBar b{font-variant-numeric:tabular-nums}\n#syncStatus{margin-top:7px;border:1px solid #ddd;border-radius:10px;background:#f7f7f7;font-weight:700;text-align:center}\n#debug{padding:3px 5px}\n#appFooter{margin-top:5px;padding-top:5px;border-top:1px solid #eee;font-size:11px;color:#666;text-align:center}\n</style>');
    }

    html=html.replace('<div id="statusMain">GHI SỐ NƯỚC V8.7.8</div>\n      <div id="statusSub">Không cần quét QR riêng. Chụp 1 ảnh có cả đồng hồ + QR.</div>','<div id="statusMain">SẴN SÀNG CHỤP</div>\n      <div id="statusSub">Đưa mặt đồng hồ + QR hiện rõ trong khung ảnh.</div>');
    html=html.replace(/\s*<div[^>]*>\s*V8\.7\.8\s*·[^<]*<\/div>/i,'');

    if(!html.includes('id="appFooter"')){
      html=html.replace('<div id="debug">Trạng thái camera và nhân sự</div>\n  </div>','<div id="debug">Trạng thái camera và nhân sự</div>\n    <div id="appFooter">Designed by Mr.Hoa - Hotline: 0915176386</div>\n  </div>');

    // CHỤP SỐ: gán đúng chuỗi đã PASS, theo thứ tự bắt buộc.
    const capturePass=[

    ];

    // Các module sau chỉ bổ sung header/progress và 3 tab; không thay lõi Chụp số.
    const addons=[

      './water-project-sheet-r93.js?r9direct='+stamp,
      './water-manage-layout-r96.js?r9direct='+stamp,
      // Chỉ dùng 1 module export. Không nạp bản compact cũ vì sẽ ghi đè nguồn TAI_CHI_SO_THANG.
      './water-default-capture-r92.js?r9direct='+stamp
    ];

    const manageR117Code="(function(){\n  'use strict';\n\n  const BUILD='879-r11.7-new-module-no-image';\n  const SHEET_ID='1YeXaSA03l3wPntaP_aNKeR_aMrjCnenHtLAiALSwxpY';\n  const DATA_SHEET='TAI_CHI_SO_THANG';\n  const DATA_RANGE='A3:J40000';\n  const MONTH_CACHE='water_export_months_tai_chi_so_v1';\n  const MANAGER_SHEET_URL='https://docs.google.com/spreadsheets/d/1YUYPIs7YtvM3rXGtI3FoTww_TW9DWDTlItY6tFHv5iw/edit#gid=1754101056&range=A2';\n\n  let loading=false;\n\n  function el(id){ return document.getElementById(id); }\n  function txt(v){ return String(v==null?'':v).trim(); }\n\n  function cell(row,i){\n    const c=row&&row.c&&row.c[i];\n    return c ? (c.f!=null ? c.f : c.v) : '';\n  }\n\n  function esc(v){\n    return txt(v).replace(/[&<>\"']/g,function(c){\n      return {\n        '&':'&amp;',\n        '<':'&lt;',\n        '>':'&gt;',\n        '\"':'&quot;',\n        \"'\":'&#39;'\n      }[c];\n    });\n  }\n\n  function periodScore(v){\n    const m=txt(v).match(/^(\\d{1,2})\\/(\\d{4})$/);\n    return m ? Number(m[2])*12 + Number(m[1]) : 0;\n  }\n\n  function safeName(v){\n    return txt(v)\n      .replace(/[^0-9A-Za-zÀ-ỹ_-]+/g,'_')\n      .replace(/^_+|_+$/g,'');\n  }\n\n  function jsonp(query){\n    return new Promise(function(resolve,reject){\n      const cb='__waterTaiChiSo_'+Date.now()+'_'+Math.random().toString(36).slice(2);\n      const script=document.createElement('script');\n      let done=false;\n\n      const timer=setTimeout(function(){\n        finish(new Error('Hết thời gian đọc TAI_CHI_SO_THANG.'));\n      },20000);\n\n      function finish(err,data){\n        if(done)return;\n        done=true;\n        clearTimeout(timer);\n\n        try{ delete window[cb]; }\n        catch(e){ window[cb]=undefined; }\n\n        if(script.parentNode){\n          script.parentNode.removeChild(script);\n        }\n\n        err ? reject(err) : resolve(data);\n      }\n\n      window[cb]=function(data){\n        finish(null,data);\n      };\n\n      script.onerror=function(){\n        finish(new Error('Không đọc được sheet TAI_CHI_SO_THANG.'));\n      };\n\n      script.src=\n        'https://docs.google.com/spreadsheets/d/'\n        +encodeURIComponent(SHEET_ID)\n        +'/gviz/tq?sheet='\n        +encodeURIComponent(DATA_SHEET)\n        +'&range='\n        +encodeURIComponent(DATA_RANGE)\n        +'&headers=1'\n        +'&tqx=responseHandler:'\n        +encodeURIComponent(cb)\n        +'&tq='\n        +encodeURIComponent(query)\n        +'&_='\n        +Date.now();\n\n      document.head.appendChild(script);\n    });\n  }\n\n  function ensureStyle(){\n    if(el('waterExportR116Style'))return;\n\n    const s=document.createElement('style');\n    s.id='waterExportR116Style';\n\n    s.textContent=`\n      #waterExportR116 .r116Title{\n        margin:0 0 10px;\n        text-align:center;\n        color:#18232d;\n        font-size:15px;\n        font-weight:900;\n        line-height:1.2;\n      }\n\n      #waterExportR116 .r116TopRow,\n      #waterExportR116 .r116ActionRow{\n        display:flex;\n        width:100%;\n        gap:8px;\n        align-items:center;\n        box-sizing:border-box;\n      }\n\n      #waterExportR116 .r116TopRow{\n        margin-bottom:8px;\n      }\n\n      #waterExportR116 .r116SelectWrap{\n        position:relative;\n        flex:1 1 auto;\n        min-width:0;\n        height:38px;\n      }\n\n      #waterExportR116 .r116SelectWrap::after{\n        content:\"▼\";\n        position:absolute;\n        right:11px;\n        top:50%;\n        transform:translateY(-50%);\n        color:#42505d;\n        font-size:10px;\n        pointer-events:none;\n      }\n\n      #waterExportR116 select,\n      #waterExportR116 .r116System,\n      #waterExportR116 .r116Action{\n        height:38px !important;\n        min-height:38px !important;\n        max-height:38px !important;\n        margin:0 !important;\n        border:1px solid #bdc7d1;\n        border-radius:9px;\n        box-sizing:border-box;\n        box-shadow:none;\n        font-family:Arial,sans-serif;\n        font-size:11.5px;\n        font-weight:800;\n      }\n\n      #waterExportR116 select{\n        display:block;\n        width:100%;\n        padding:0 32px 0 10px;\n        outline:none;\n        appearance:none !important;\n        -webkit-appearance:none !important;\n        -moz-appearance:none !important;\n        background:#f7f8fa;\n        color:#18232d;\n      }\n\n      #waterExportR116 .r116System{\n        flex:0 0 34%;\n        min-width:110px;\n        padding:0 8px;\n        background:#eef2f5;\n        color:#4f5b66;\n        cursor:default;\n      }\n\n      #waterExportR116 .r116Action{\n        flex:1 1 50%;\n        display:flex;\n        align-items:center;\n        justify-content:center;\n        padding:0 8px;\n        background:#f7f8fa;\n        color:#18232d;\n        text-decoration:none !important;\n        cursor:pointer;\n        user-select:none;\n        -webkit-tap-highlight-color:transparent;\n      }\n\n      #waterExportR116 .r116Action.disabled{\n        opacity:.5;\n        pointer-events:none;\n      }\n\n      #waterExportR116Status{\n        margin:8px 0 0;\n        min-height:14px;\n        text-align:center;\n        color:#465461;\n        font-size:10.5px;\n        font-weight:700;\n        line-height:1.3;\n      }\n\n      #waterExportR116Status.ok{color:#2a6942}\n      #waterExportR116Status.err{color:#a23a2a}\n\n      @media(max-width:360px){\n        #waterExportR116 .r116Title{font-size:14px}\n        #waterExportR116 .r116TopRow,\n        #waterExportR116 .r116ActionRow{gap:6px}\n\n        #waterExportR116 .r116SelectWrap,\n        #waterExportR116 select,\n        #waterExportR116 .r116System,\n        #waterExportR116 .r116Action{\n          height:36px !important;\n          min-height:36px !important;\n          max-height:36px !important;\n          font-size:10.8px;\n        }\n\n        #waterExportR116 .r116System{\n          min-width:102px;\n          flex-basis:34%;\n        }\n\n        #waterExportR116Status{\n          font-size:10px;\n          margin-top:7px;\n        }\n      }\n    `;\n\n    document.head.appendChild(s);\n  }\n\n  function findTargetCard(){\n    const direct=el('waterManageExportPlaceholder');\n    if(direct)return direct;\n\n    const current=el('waterExportR116');\n    if(current)return current;\n\n    const panel=el('waterManagePanel');\n    if(!panel)return null;\n\n    const cards=panel.querySelectorAll('.waterCard');\n\n    for(let i=0;i<cards.length;i++){\n      const titleNode=cards[i].querySelector(\n        '.waterCardTitle,.r100Title,.r102Title,.r106Title,.r108Title,.r110Title,.r111Title,.r116Title'\n      );\n\n      const title=txt(titleNode&&titleNode.textContent).toLowerCase();\n\n      if(title.indexOf('tải file chỉ số')>=0 || title.indexOf('dữ liệu ghi chỉ số')>=0){\n        return cards[i];\n      }\n    }\n\n    return null;\n  }\n\n  function isCorrectMounted(){\n    return !!(\n      el('waterExportR116') &&\n      el('waterExportMonthR116') &&\n      el('waterDownloadR116') &&\n      el('waterViewR116')\n    );\n  }\n\n  function mount(){\n    if(isCorrectMounted())return true;\n\n    const card=findTargetCard();\n    if(!card)return false;\n\n    ensureStyle();\n\n    card.id='waterExportR116';\n    card.innerHTML=`\n      <div class=\"r116Title\">DỮ LIỆU GHI CHỈ SỐ</div>\n\n      <div class=\"r116TopRow\">\n        <div class=\"r116SelectWrap\">\n          <select id=\"waterExportMonthR116\" aria-label=\"Chọn tháng dữ liệu\">\n            <option value=\"\">Chọn Tháng: Đang tải...</option>\n          </select>\n        </div>\n\n        <button\n          id=\"waterSystemFileR116\"\n          class=\"r116System\"\n          type=\"button\"\n          disabled\n          aria-disabled=\"true\"\n        >FILE HỆ THỐNG</button>\n      </div>\n\n      <div class=\"r116ActionRow\">\n        <a\n          id=\"waterDownloadR116\"\n          class=\"r116Action disabled\"\n          href=\"#\"\n          role=\"button\"\n          aria-disabled=\"true\"\n        >TẢI FILE</a>\n\n        <a\n          id=\"waterViewR116\"\n          class=\"r116Action\"\n          href=\"#\"\n          role=\"button\"\n          aria-label=\"Xem chỉ số trên Google Sheet quản lý\"\n        >XEM CHỈ SỐ</a>\n      </div>\n\n      <div id=\"waterExportR116Status\">\n        R11.7 • Đang đọc dữ liệu hệ thống...\n      </div>\n    `;\n\n    const download=el('waterDownloadR116');\n    const view=el('waterViewR116');\n\n    download.addEventListener('click',function(ev){\n      ev.preventDefault();\n      ev.stopPropagation();\n      if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();\n\n      if(download.classList.contains('disabled'))return false;\n      downloadSelected();\n      return false;\n    },false);\n\n    view.addEventListener('click',function(ev){\n      ev.preventDefault();\n      ev.stopPropagation();\n      if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();\n\n      status(\n        'Đang mở Google Sheet quản lý. Google sẽ kiểm tra quyền tài khoản.',\n        ''\n      );\n\n      window.open(MANAGER_SHEET_URL,'_blank','noopener,noreferrer');\n      return false;\n    },false);\n\n    loadMonths();\n    return true;\n  }\n\n  function status(message,kind){\n    const n=el('waterExportR116Status');\n    if(!n)return;\n\n    n.className=kind||'';\n    n.textContent=message||'';\n  }\n\n  function setDisabled(disabled){\n    const link=el('waterDownloadR116');\n    if(!link)return;\n\n    link.classList.toggle('disabled',!!disabled);\n    link.setAttribute('aria-disabled',disabled?'true':'false');\n  }\n\n  function setMonths(list){\n    const select=el('waterExportMonthR116');\n    if(!select)return;\n\n    list=(list||[])\n      .map(txt)\n      .filter(function(v){\n        return /^\\d{1,2}\\/\\d{4}$/.test(v);\n      })\n      .filter(function(v,i,a){\n        return a.indexOf(v)===i;\n      })\n      .sort(function(a,b){\n        return periodScore(b)-periodScore(a);\n      });\n\n    select.innerHTML='';\n\n    if(!list.length){\n      const o=document.createElement('option');\n      o.value='';\n      o.textContent='Chọn Tháng: Chưa có dữ liệu';\n      select.appendChild(o);\n      setDisabled(true);\n      return [];\n    }\n\n    list.forEach(function(v){\n      const o=document.createElement('option');\n      o.value=v;\n      o.textContent='Chọn Tháng: '+v;\n      select.appendChild(o);\n    });\n\n    setDisabled(false);\n\n    try{\n      localStorage.setItem(MONTH_CACHE,JSON.stringify(list));\n    }catch(e){}\n\n    return list;\n  }\n\n  async function loadMonths(){\n    if(loading)return;\n    loading=true;\n\n    const select=el('waterExportMonthR116');\n\n    if(select)select.disabled=true;\n    setDisabled(true);\n\n    try{\n      /*\n        CHỈ đọc cột J của TAI_CHI_SO_THANG.\n        KHÔNG có bất kỳ fallback nào sang HANG_DOI_ANH_V87.\n      */\n      const data=await jsonp('select J where J is not null');\n\n      const rows=\n        data &&\n        data.table &&\n        Array.isArray(data.table.rows)\n          ? data.table.rows\n          : [];\n\n      const months=rows.map(function(r){\n        return txt(cell(r,0));\n      });\n\n      const list=setMonths(months);\n\n      status(\n        list.length\n          ? 'R11.7 • Nguồn: TAI_CHI_SO_THANG • '+list.length+' tháng dữ liệu'\n          : 'R11.7 • TAI_CHI_SO_THANG chưa có dữ liệu.',\n        list.length?'ok':'err'\n      );\n\n    }catch(e){\n      /*\n        Có thể dùng cache danh sách tháng để hiển thị,\n        NHƯNG download vẫn bắt buộc đọc TAI_CHI_SO_THANG.\n        Không bao giờ đọc Sheet hàng đợi.\n      */\n      let cached=[];\n\n      try{\n        cached=JSON.parse(localStorage.getItem(MONTH_CACHE)||'[]');\n      }catch(_e){}\n\n      const list=setMonths(cached);\n\n      if(list.length){\n        status(\n          'Không đọc được danh sách mới. Nguồn tải vẫn khóa tại TAI_CHI_SO_THANG.',\n          'err'\n        );\n      }else{\n        status(\n          'Không đọc được TAI_CHI_SO_THANG.',\n          'err'\n        );\n      }\n\n    }finally{\n      loading=false;\n\n      if(select){\n        select.disabled=false;\n      }\n    }\n  }\n\n  function loadXlsx(){\n    if(window.XLSX){\n      return Promise.resolve(window.XLSX);\n    }\n\n    return new Promise(function(resolve,reject){\n      const urls=[\n        'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',\n        'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'\n      ];\n\n      let i=0;\n\n      function next(){\n        if(window.XLSX){\n          resolve(window.XLSX);\n          return;\n        }\n\n        if(i>=urls.length){\n          reject(new Error('Không tải được thư viện Excel.'));\n          return;\n        }\n\n        const s=document.createElement('script');\n        s.src=urls[i++];\n        s.async=true;\n\n        s.onload=function(){\n          if(window.XLSX){\n            resolve(window.XLSX);\n          }else{\n            next();\n          }\n        };\n\n        s.onerror=next;\n        document.head.appendChild(s);\n      }\n\n      next();\n    });\n  }\n\n  function buildRealXls(period,rows,XLSX){\n    const aoa=[\n      ['CHI SỐ NƯỚC THÁNG '+period,'','','','','','',''],\n      ['','','','','','','',''],\n      [\n        'TT',\n        'Tòa',\n        'Tầng',\n        'Căn hộ',\n        'Mã đồng hồ',\n        'Chỉ số kỳ trước',\n        'Chỉ số kỳ này',\n        'Tiêu thụ m³'\n      ]\n    ];\n\n    rows.forEach(function(r,index){\n      const vals=[];\n      for(let i=0;i<7;i++){\n        vals.push(txt(cell(r,i)));\n      }\n\n      aoa.push([\n        String(index+1),\n        vals[0],\n        vals[1],\n        vals[2],\n        vals[3],\n        vals[4],\n        vals[5],\n        vals[6]\n      ]);\n    });\n\n    const ws=XLSX.utils.aoa_to_sheet(aoa);\n\n    ws['!merges']=[\n      {\n        s:{r:0,c:0},\n        e:{r:0,c:7}\n      }\n    ];\n\n    ws['!cols']=[\n      {wch:7},\n      {wch:12},\n      {wch:10},\n      {wch:14},\n      {wch:18},\n      {wch:17},\n      {wch:17},\n      {wch:14}\n    ];\n\n    ws['!rows']=[\n      {hpt:24},\n      {hpt:18},\n      {hpt:30}\n    ];\n\n    // Giữ TT/Tòa/Tầng/Căn hộ/Mã đồng hồ dạng text để không mất số 0 đầu.\n    for(let r=3;r<aoa.length;r++){\n      for(let c=0;c<=4;c++){\n        const addr=XLSX.utils.encode_cell({r:r,c:c});\n        if(ws[addr]){\n          ws[addr].t='s';\n          ws[addr].v=String(ws[addr].v==null?'':ws[addr].v);\n          ws[addr].z='@';\n        }\n      }\n    }\n\n    if(aoa.length>=4){\n      ws['!autofilter']={\n        ref:'A3:H'+aoa.length\n      };\n    }\n\n    const wb=XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(\n      wb,\n      ws,\n      ('CHI_SO_'+period.replace('/','_')).slice(0,31)\n    );\n\n    return wb;\n  }\n\n  async function downloadSelected(){\n    const select=el('waterExportMonthR116');\n    const link=el('waterDownloadR116');\n    const period=txt(select&&select.value);\n\n    if(!period){\n      status('Anh chọn tháng cần tải trước.','err');\n      return;\n    }\n\n    if(!navigator.onLine){\n      status(\n        'Thiết bị đang OFFLINE. Cần Internet để tải file.',\n        'err'\n      );\n      return;\n    }\n\n    setDisabled(true);\n\n    const old=link?link.textContent:'Tải File';\n\n    if(link){\n      link.textContent='Đang tạo...';\n    }\n\n    status(\n      'Đang lấy '+period+' từ TAI_CHI_SO_THANG...',\n      ''\n    );\n\n    try{\n      /*\n        B:H = 7 cột dữ liệu xuất file (không xuất cột ảnh).\n        J = Kỳ dùng để lọc.\n        KHÔNG tham chiếu bất kỳ Sheet hàng đợi nào.\n      */\n      const q=\n        \"select B,C,D,E,F,G,H where J = '\" \n        +period.replace(/'/g,\"''\")\n        +\"'\";\n\n      const data=await jsonp(q);\n\n      const rows=\n        data &&\n        data.table &&\n        Array.isArray(data.table.rows)\n          ? data.table.rows\n          : [];\n\n      if(!rows.length){\n        throw new Error(\n          'TAI_CHI_SO_THANG không có dữ liệu kỳ '+period+'.'\n        );\n      }\n\n      const XLSX=await loadXlsx();\n      const wb=buildRealXls(period,rows,XLSX);\n\n      const fileName=\n        'TAI_CHI_SO_THANG_'\n        +safeName(period.replace('/','-'))\n        +'.xlsx';\n\n      XLSX.writeFile(\n        wb,\n        fileName,\n        {\n          bookType:'xlsx',\n          compression:true\n        }\n      );\n\n      status(\n        'R11.7 • Đã tạo Excel '+rows.length+' dòng • Không xuất cột ảnh.',\n        'ok'\n      );\n\n    }catch(e){\n      /*\n        CỐ Ý KHÔNG FALLBACK.\n        Nếu TAI_CHI_SO_THANG lỗi thì dừng tại đây.\n      */\n      status(\n        txt(e&&e.message)||\n        'Không tải được dữ liệu từ TAI_CHI_SO_THANG.',\n        'err'\n      );\n\n    }finally{\n      if(link){\n        link.textContent=old||'Tải File';\n      }\n\n      setDisabled(false);\n    }\n  }\n\n  function keepMounted(){\n    /*\n      Nếu module layout khác dựng lại Tab QUẢN LÝ,\n      module này sẽ dựng lại card tải mới.\n    */\n    if(!isCorrectMounted()){\n      mount();\n    }\n  }\n\n  function start(){\n    if(mount())return;\n\n    let tries=0;\n\n    const timer=setInterval(function(){\n      tries++;\n\n      if(mount() || tries>40){\n        clearInterval(timer);\n      }\n    },200);\n  }\n\n  if(window.MutationObserver){\n    const obs=new MutationObserver(function(){\n      keepMounted();\n    });\n\n    obs.observe(\n      document.documentElement,\n      {\n        childList:true,\n        subtree:true\n      }\n    );\n  }\n\n  if(document.readyState==='loading'){\n    document.addEventListener(\n      'DOMContentLoaded',\n      start,\n      {once:true}\n    );\n  }else{\n    start();\n  }\n\n  window.WATER_MANAGE_EXPORT_BUILD=BUILD;\n  window.WATER_MANAGE_EXPORT_SOURCE=DATA_SHEET;\n})();\n";

    const scripts=capturePass.concat(addons)
      .map(src=>'<script src="'+src+'"></'+'script>')
      .join('\n')
      +'\n<script>'+manageR117Code+'</'+'script>';

    html=html.replace('</body>',scripts+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('msg').textContent='Không mở được R9 trực tiếp: '+String(err&&err.message||err);
  }
})();
