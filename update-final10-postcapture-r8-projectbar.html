<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cập nhật FINAL10 R8 PROJECT BAR</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
body{display:flex;align-items:center;justify-content:center;text-align:center}
.box{padding:24px;max-width:420px}
#msg{font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div class="box"><div id="msg">Đang cập nhật FINAL10 R8…</div></div>

<script>
(async()=>{
  const LABEL='879-final10-postcapture-r8-projectbar';
  const EXPECT=LABEL;
  const msg=document.getElementById('msg');
  const go=()=>location.replace('./app.html?build='+LABEL);
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  try{
    if(!('serviceWorker' in navigator)){go();return;}

    const before=navigator.serviceWorker.controller;

    const reg=await navigator.serviceWorker.register(
      './water-offline-sw-final10-postcapture-r8-projectbar.js?v='+LABEL,
      {scope:'./',updateViaCache:'none'}
    );

    try{await reg.update();}catch(e){}

    const started=Date.now();

    while(Date.now()-started<15000){
      if(reg.waiting){
        try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
      }

      if(reg.installing){
        try{reg.installing.postMessage('SKIP_WAITING');}catch(e){}
      }

      const current=navigator.serviceWorker.controller;
      if(current&&current!==before)await wait(250);

      if(reg.active&&reg.active.state==='activated'){
        try{
          const ch=new MessageChannel();

          const status=await new Promise(resolve=>{
            const timer=setTimeout(()=>resolve(null),800);

            ch.port1.onmessage=e=>{
              clearTimeout(timer);
              resolve(e.data||null);
            };

            reg.active.postMessage(
              'WATER_R8_PROJECT_STATUS',
              [ch.port2]
            );
          });

          if(
            status &&
            status.ready===true &&
            status.build===EXPECT
          ){
            msg.textContent='✓ Đã cập nhật. Đang mở ứng dụng…';
            await wait(250);
            go();
            return;
          }
        }catch(e){}
      }

      await wait(200);
    }

    go();

  }catch(e){
    msg.textContent='Đang mở ứng dụng…';
    setTimeout(go,400);
  }
})();
</script>
</body>
</html>
