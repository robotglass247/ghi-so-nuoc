<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghi số nước - AUTH SHEETS DEV V3.2</title>
<style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}body{display:flex;align-items:center;justify-content:center;text-align:center}#msg{padding:24px;font-size:16px;line-height:1.5}</style>
</head>
<body>
<div id="msg">Đang nạp AUTH SHEETS DEV V3.2...</div>
<script>
(async function(){
  try{
    const url='https://raw.githubusercontent.com/robotglass247/ghi-so-nuoc/main/r9-auth-sheets-dev-v3.html?rawv=20260915-2016';
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const html=await res.text();
    if(html.indexOf('AUTH SHEETS DEV V3.2')<0) throw new Error('Nguồn GitHub chưa phải V3.2');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('msg').textContent='V3.2 chưa nạp được: '+String(err&&err.message||err);
  }
})();
</script>
</body>
</html>
