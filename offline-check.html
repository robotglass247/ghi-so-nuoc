<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kiểm tra offline</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222;padding:24px}
.box{max-width:520px;margin:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#main{font-size:21px;font-weight:800;line-height:1.35}
#detail{margin-top:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;color:#555}
.ok{color:#147a36}.bad{color:#b00020}
button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div id="main">Đang kiểm tra…</div>
  <div id="detail"></div>
  <button id="retry" style="display:none" onclick="location.reload()">KIỂM TRA LẠI</button>
</div>
<script>
(async()=>{
  const BUILD='878-ui3h';
  const SW='./water-offline-sw-ui3.js';
  const main=document.getElementById('main');
  const detail=document.getElementById('detail');
  const retry=document.getElementById('retry');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  function ask(worker,timeout=2500){
    return new Promise(resolve=>{
      if(!worker){resolve(null);return;}
      const ch=new MessageChannel();
      let done=false;
      const finish=v=>{if(done)return;done=true;clearTimeout(timer);resolve(v||null);};
      const timer=setTimeout(()=>finish(null),timeout);
      ch.port1.onmessage=e=>finish(e.data);
      try{worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);}catch(e){finish(null);}
    });
  }

  try{
    if(!('serviceWorker' in navigator))throw new Error('Trình duyệt không hỗ trợ Service Worker.');

    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}
    if(reg.waiting){try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}}

    let state=null;
    for(let i=0;i<50;i++){
      const worker=reg.active||reg.waiting||reg.installing||navigator.serviceWorker.controller;
      state=await ask(worker,800);
      if(state&&state.ready===true&&state.build===BUILD)break;
      await wait(250);
    }

    const controller=navigator.serviceWorker.controller;
    const controllerUrl=controller?String(controller.scriptURL||''):'KHÔNG CÓ';
    const activeUrl=reg.active?String(reg.active.scriptURL||''):'KHÔNG CÓ';

    if(state&&state.ready===true&&state.build===BUILD){
      main.className='ok';
      main.textContent='✓ ĐÃ SẴN SÀNG OFFLINE';
      detail.textContent='Build: '+state.build+'\nService Worker active: '+activeUrl+'\nController hiện tại: '+controllerUrl+'\nQR cache: '+(state.qrCached?'Có':'Chưa có')+'\n\nBây giờ tắt Wi‑Fi/4G rồi mở app.html để thử.';
    }else{
      main.className='bad';
      main.textContent='✕ CHƯA CÀI ĐƯỢC OFFLINE';
      detail.textContent='Build cần: '+BUILD+'\nService Worker active: '+activeUrl+'\nController hiện tại: '+controllerUrl+'\nPhản hồi cache: '+JSON.stringify(state)+'\n\nGiữ Internet và bấm KIỂM TRA LẠI.';
      retry.style.display='block';
    }
  }catch(err){
    main.className='bad';
    main.textContent='✕ CHƯA CÀI ĐƯỢC OFFLINE';
    detail.textContent=String(err&&err.message?err.message:err);
    retry.style.display='block';
  }
})();
</script>
</body>
</html>
