<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cập nhật bộ lọc XEM CHỈ SỐ</title>
<style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}body{display:flex;align-items:center;justify-content:center;text-align:center}.box{padding:24px;max-width:420px;line-height:1.5}b{color:#8fd3ff}</style>
</head>
<body>
<div class="box" id="msg">Đang cập nhật bộ lọc XEM CHỈ SỐ…<br><small>Không xóa dữ liệu ghi số/ảnh đang chờ.</small></div>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>String(r.scope||'').includes('/ghi-so-nuoc/dev-r1135-unified/')).map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>/^r1135-unified-shell-dev-/i.test(k)).map(k=>caches.delete(k)));
    }
    msg.innerHTML='<b>Đã cập nhật V18.</b><br>Đang mở lại ứng dụng…';
  }catch(e){
    msg.textContent='Đang mở lại ứng dụng…';
  }
  setTimeout(function(){
    location.replace('./dev-r1135-unified/index.html?v=18&t='+Date.now());
  },500);
})();
</script>
</body>
</html>
