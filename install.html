<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23679d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="./water-app-icon.svg" type="image/svg+xml">
<title>Cài Ứng dụng Ghi Chỉ Số Nước</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}
body{display:flex;align-items:center;justify-content:center;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.card{width:min(420px,100%);background:#fff;border:1px solid #dfe7ef;border-radius:22px;padding:22px 18px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}
.icon{width:82px;height:82px;margin:0 auto 12px}.title{font-size:21px;font-weight:900}.project{margin:7px 0 18px;color:#64748b;font-weight:700}
button,a.btn{display:block;width:100%;min-height:52px;border-radius:13px;border:1px solid #cfd9e4;padding:14px 12px;margin-top:10px;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}
#installBtn{background:#23679d;color:#fff;border-color:#23679d}#installBtn:disabled{opacity:.55;cursor:not-allowed}#openBtn{background:#fff;color:#23679d}.note{margin-top:14px;font-size:13px;line-height:1.45;color:#64748b}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="./water-app-icon.svg" alt="">
  <div class="title">ỨNG DỤNG GHI CHỈ SỐ NƯỚC</div>
  <div id="projectText" class="project">Dự án: ...</div>
  <button id="installBtn" type="button">CÀI ỨNG DỤNG</button>
  <a id="openBtn" class="btn" href="#">MỞ APP</a>
  <div id="note" class="note">Mỗi dự án được cài thành một ứng dụng riêng theo PROJECT_ID.</div>
</div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const project=String(params.get('project')||params.get('projectId')||'').trim().toUpperCase();
  const projectText=document.getElementById('projectText');
  const openBtn=document.getElementById('openBtn');
  const installBtn=document.getElementById('installBtn');
  const note=document.getElementById('note');
  let deferredPrompt=null;

  function persistProject(){
    if(!project)return;
    try{localStorage.setItem('water_pwa_project',project);}catch(e){}
    try{sessionStorage.setItem('water_pwa_project',project);}catch(e){}
  }

  function addProjectManifest(){
    if(!project)return;
    const old=document.querySelector('link[data-water-project-manifest]');
    if(old)old.remove();
    const link=document.createElement('link');
    link.rel='manifest';
    link.setAttribute('data-water-project-manifest','1');
    link.href='./manifest-project.webmanifest?project='+encodeURIComponent(project)+'&v=20261003-1';
    document.head.appendChild(link);
  }

  async function setupProjectPwa(){
    if(!project||!('serviceWorker' in navigator))return;
    try{
      await navigator.serviceWorker.register('./sw-pwa.js?v=20261003-project-pwa-v1',{scope:'./',updateViaCache:'none'});
      await navigator.serviceWorker.ready;
      if(!navigator.serviceWorker.controller){
        await new Promise(function(resolve){
          let done=false;
          const finish=function(){if(done)return;done=true;clearTimeout(timer);resolve();};
          const timer=setTimeout(finish,2500);
          navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});
        });
      }
      addProjectManifest();
    }catch(e){
      note.textContent='Không khởi tạo được chế độ cài riêng dự án. Hãy tải lại trang rồi thử lại.';
    }
  }

  if(project){
    persistProject();
    projectText.textContent='Dự án: '+project;
    openBtn.href='./r1135-v20-direct.html?project='+encodeURIComponent(project);
    setupProjectPwa();
  }else{
    projectText.textContent='Chưa xác định dự án';
    openBtn.href='./r1135-v20-direct.html';
    installBtn.disabled=true;
    note.textContent='Link cài đặt chưa có PROJECT_ID.';
  }

  window.addEventListener('beforeinstallprompt',function(ev){
    ev.preventDefault();
    deferredPrompt=ev;
    if(project)installBtn.disabled=false;
  });

  installBtn.addEventListener('click',async function(){
    persistProject();
    if(deferredPrompt){
      deferredPrompt.prompt();
      try{await deferredPrompt.userChoice;}catch(e){}
      deferredPrompt=null;
      return;
    }
    note.textContent='Nếu Chrome chưa hiện hộp cài: menu ⋮ → chọn “Cài đặt ứng dụng”. Không chọn tạo shortcut nếu Chrome có cả hai lựa chọn.';
  });

  window.addEventListener('appinstalled',function(){
    persistProject();
    note.textContent='Đã cài ứng dụng riêng cho dự án '+project+'.';
  });
})();
</script>
</body>
</html>
