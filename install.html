<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b91e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="./water-app-icon.svg" type="image/svg+xml">
<title>Cài Ứng dụng Ghi Chỉ Số Nước</title>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const project=String(params.get('project')||params.get('projectId')||'').trim().toUpperCase();
  const projectName=String(params.get('projectName')||'').trim();
  window.__WATER_PROJECT__=project;
  window.__WATER_PROJECT_NAME__=projectName;

  function addManifestNow(){
    if(!project)return;
    if(document.querySelector('link[data-water-project-manifest]'))return;
    const link=document.createElement('link');
    link.rel='manifest';
    link.setAttribute('data-water-project-manifest','1');
    link.href='./manifest-project.webmanifest?project='+encodeURIComponent(project)
      +'&projectName='+encodeURIComponent(projectName)
      +'&v=20261003-desktop-v2';
    document.head.appendChild(link);
  }

  if(!project)return;

  if('serviceWorker' in navigator){
    if(navigator.serviceWorker.controller){
      addManifestNow();
    }else{
      navigator.serviceWorker.register('./sw-pwa.js?v=20261003-desktop-v2',{
        scope:'./',
        updateViaCache:'none'
      }).then(function(){
        return navigator.serviceWorker.ready;
      }).then(function(){
        let reloaded=false;
        const reloadOnce=function(){
          if(reloaded)return;
          reloaded=true;
          const u=new URL(location.href);
          u.searchParams.set('pwaReady','1');
          location.replace(u.toString());
        };
        navigator.serviceWorker.addEventListener('controllerchange',reloadOnce,{once:true});
        setTimeout(function(){
          if(navigator.serviceWorker.controller)reloadOnce();
        },1200);
      }).catch(function(){});
    }
  }
})();
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}
body{display:flex;align-items:center;justify-content:center;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.card{width:min(460px,100%);background:#fff;border:1px solid #dfe7ef;border-radius:22px;padding:22px 18px;box-shadow:0 16px 38px rgba(15,23,42,.10);text-align:center}
.icon{width:96px;height:96px;margin:0 auto 12px;border-radius:22px}.title{font-size:21px;font-weight:900}.project{margin:7px 0 14px;color:#64748b;font-weight:700}
.status{margin:0 0 14px;padding:9px 10px;border-radius:10px;background:#eef6ff;color:#23679d;font-size:13px;font-weight:800}
button,a.btn{display:block;width:100%;min-height:52px;border-radius:13px;border:1px solid #cfd9e4;padding:14px 12px;margin-top:10px;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}
#installBtn{background:#0b91e5;color:#fff;border-color:#0b91e5}#installBtn:disabled{opacity:.55;cursor:not-allowed}#openBtn{background:#fff;color:#0b73bd}.note{margin-top:14px;font-size:13px;line-height:1.5;color:#64748b}.desktopHelp{display:none;margin-top:14px;text-align:left;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px;line-height:1.5}.desktopHelp b{color:#172033}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="./water-app-icon.svg" alt="Ghi chỉ số nước">
  <div class="title">ỨNG DỤNG GHI CHỈ SỐ NƯỚC</div>
  <div id="projectText" class="project">Dự án: ...</div>
  <div id="status" class="status">Đang kiểm tra khả năng cài đặt...</div>
  <button id="installBtn" type="button">CÀI ICON ỨNG DỤNG</button>
  <a id="openBtn" class="btn" href="#">MỞ APP</a>
  <div id="desktopHelp" class="desktopHelp"></div>
  <div id="note" class="note">Mỗi dự án được cài thành một ứng dụng riêng theo PROJECT_ID.</div>
</div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const project=String(window.__WATER_PROJECT__||params.get('project')||params.get('projectId')||'').trim().toUpperCase();
  const projectName=String(window.__WATER_PROJECT_NAME__||params.get('projectName')||'').trim();
  const projectText=document.getElementById('projectText');
  const openBtn=document.getElementById('openBtn');
  const installBtn=document.getElementById('installBtn');
  const note=document.getElementById('note');
  const status=document.getElementById('status');
  const desktopHelp=document.getElementById('desktopHelp');
  let deferredPrompt=null;
  let installed=false;
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const isDesktop=!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const isEdge=/Edg\//i.test(navigator.userAgent);
  const isChrome=/Chrome\//i.test(navigator.userAgent)&&!isEdge;

  function persistProject(){
    if(!project)return;
    try{localStorage.setItem('water_pwa_project',project);}catch(e){}
    try{sessionStorage.setItem('water_pwa_project',project);}catch(e){}
  }

  function showDesktopHelp(){
    if(!isDesktop)return;
    desktopHelp.style.display='block';
    desktopHelp.innerHTML=isEdge
      ? '<b>Microsoft Edge:</b> bấm nút CÀI ICON. Nếu chưa hiện hộp cài, mở menu <b>… → Apps → Install this site as an app</b>. Sau khi cài, Edge có thể cho chọn ghim Taskbar/Start hoặc tạo shortcut.'
      : '<b>Google Chrome:</b> bấm nút CÀI ICON. Nếu chưa hiện hộp cài, nhìn bên phải thanh địa chỉ để chọn biểu tượng cài ứng dụng hoặc mở menu <b>⋮ → Cast, save, and share → Install page as app</b>.';
  }

  function readyForInstall(){
    status.textContent='SẴN SÀNG CÀI TRÊN THIẾT BỊ NÀY';
    installBtn.disabled=false;
    if(isDesktop)installBtn.textContent='CÀI ICON TRÊN MÁY TÍNH';
  }

  if(project){
    persistProject();
    projectText.textContent=projectName ? projectName+' ('+project+')' : 'Dự án: '+project;
    openBtn.href='./r1135-v20-direct.html?project='+encodeURIComponent(project);
  }else{
    projectText.textContent='Chưa xác định dự án';
    openBtn.href='./r1135-v20-direct.html';
    installBtn.disabled=true;
    status.textContent='THIẾU PROJECT_ID';
    note.textContent='Link cài đặt chưa có PROJECT_ID.';
    return;
  }

  if(isStandalone){
    installed=true;
    status.textContent='ỨNG DỤNG ĐÃ ĐƯỢC CÀI';
    installBtn.disabled=true;
    installBtn.textContent='ĐÃ CÀI ỨNG DỤNG';
    note.textContent='Bạn có thể mở dự án từ icon ứng dụng.';
  }else{
    showDesktopHelp();
    setTimeout(function(){
      if(!deferredPrompt&&!installed){
        status.textContent='TRÌNH DUYỆT ĐANG CHỜ ĐỦ ĐIỀU KIỆN CÀI';
        if(isDesktop){
          note.textContent='Hãy bấm một lần vào trang và chờ khoảng 30 giây. Chrome/Edge có thể chỉ bật quyền cài sau khi người dùng đã tương tác với trang.';
        }
      }
    },5000);
  }

  window.addEventListener('beforeinstallprompt',function(ev){
    ev.preventDefault();
    deferredPrompt=ev;
    readyForInstall();
  });

  installBtn.addEventListener('click',async function(){
    persistProject();
    if(installed)return;

    if(deferredPrompt){
      deferredPrompt.prompt();
      try{
        const choice=await deferredPrompt.userChoice;
        if(choice&&choice.outcome==='accepted'){
          status.textContent='ĐANG CÀI ỨNG DỤNG...';
        }else{
          status.textContent='BẠN CHƯA XÁC NHẬN CÀI';
        }
      }catch(e){}
      deferredPrompt=null;
      return;
    }

    status.textContent='CHƯA NHẬN ĐƯỢC QUYỀN CÀI TỪ TRÌNH DUYỆT';
    if(isDesktop){
      note.textContent='Trên máy tính, dùng Chrome hoặc Microsoft Edge bản thường (không dùng cửa sổ Ẩn danh/InPrivate). Bấm vào trang, chờ khoảng 30 giây rồi thử lại; hoặc dùng mục Install trong menu trình duyệt như hướng dẫn phía trên.';
      showDesktopHelp();
    }else{
      note.textContent='Nếu Chrome chưa hiện hộp cài: menu ⋮ → chọn “Cài đặt ứng dụng” hoặc “Thêm vào màn hình chính”.';
    }
  });

  window.addEventListener('appinstalled',function(){
    installed=true;
    persistProject();
    status.textContent='ĐÃ CÀI THÀNH CÔNG';
    installBtn.disabled=true;
    installBtn.textContent='ĐÃ CÀI ỨNG DỤNG';
    note.textContent='Đã cài ứng dụng riêng cho dự án '+project+'. Trên Windows, ứng dụng sẽ xuất hiện trong Start; bạn có thể ghim ra Taskbar/Desktop tùy trình duyệt.';
  });
})();
</script>
</body>
</html>
