<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Xác thực FILE HỆ THỐNG - PASS AUTH DEV</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f4f7fa;color:#18232d}
body{display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
#shell{width:min(430px,100%);background:#fff;border:1px solid #e0e5ea;border-radius:14px;padding:22px 18px;box-sizing:border-box;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.12)}
#shell h1{font-size:18px;margin:0 0 10px;color:#174f7e}
#hint{font-size:13px;line-height:1.5;color:#5c6873;margin-bottom:12px}
#waterExportR118{display:none}
#bridgeMsg{font-size:14px;font-weight:800;line-height:1.5;color:#465461;min-height:22px}
#deny{position:fixed;inset:0;z-index:2147483647;background:rgba(15,22,29,.94);display:none;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
#deny .box{width:min(390px,100%);background:#fff;border-radius:14px;padding:24px 18px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.3)}
#deny .msg{font-size:18px;font-weight:900;color:#a23a2a;line-height:1.45}
#deny .sub{margin-top:9px;font-size:13px;font-weight:700;color:#66727d}
</style>
</head>
<body>
<div id="shell">
  <h1>XÁC THỰC FILE HỆ THỐNG</h1>
  <div id="hint">Sử dụng đúng tài khoản Google đã được cấp quyền. Bộ xác thực bên dưới là bản PASS đã chạy đúng trước đây.</div>
  <div id="bridgeMsg">Đang chuẩn bị xác thực...</div>
</div>

<!-- Minimal DOM expected by unchanged PASS AUTH -->
<div id="waterExportR118">
  <button id="waterSystemFileR118" type="button">FILE HỆ THỐNG</button>
  <a id="waterDownloadR118" href="#">TẢI FILE</a>
  <a id="waterViewR118" href="#">XEM CHỈ SỐ</a>
  <div id="waterExportR118Status"></div>
</div>

<div id="deny"><div class="box"><div class="msg">Tài khoản chưa cấp quyền</div><div class="sub">Tự động trở về màn hình QUẢN LÝ sau 3 giây...</div></div></div>

<script src="./03_manage-core-v1.js?v=pass-bridge-20260915"></script>
<script src="./08_manage-status-v1.js?v=pass-bridge-20260915"></script>
<script src="./09_auth-sheets-config-prod.js?v=pass-bridge-20260915"></script>
<script src="./09_auth-sheets-v1.js?v=PASS_BLOB_UNCHANGED_20260915"></script>
<script>
(function(){
'use strict';
const RETURN_URL='./r9-system-auth-pass-bridge-dev.html?returned=1#manage';
let finished=false;
let ticks=0;

function deny(){
  if(finished)return;
  finished=true;
  const o=document.getElementById('waterAuthSheetsOverlay');
  if(o)o.style.display='none';
  document.getElementById('deny').style.display='flex';
  setTimeout(function(){window.location.replace(RETURN_URL);},3000);
}

function success(){
  if(finished)return;
  finished=true;
  const core=window.WATER_MANAGE_CORE;
  const url=core&&core.CFG&&core.CFG.SYSTEM_SHEET_URL;
  if(!url){deny();return;}
  document.getElementById('bridgeMsg').textContent='Đúng tài khoản QUẢN LÝ · đang mở FILE HỆ THỐNG...';
  window.location.replace(url);
}

const timer=setInterval(function(){
  ticks++;
  try{
    const api=window.WATER_AUTH_SHEETS;
    if(!api||typeof api.getState!=='function')return;
    const st=api.getState();
    if(st&&st.authenticated===true){
      clearInterval(timer);
      if(st.authorized===true&&st.permissions&&st.permissions.system===true)success();
      else deny();
      return;
    }
  }catch(e){}
  if(ticks>1800){clearInterval(timer);deny();}
},100);
})();
</script>
</body>
</html>
