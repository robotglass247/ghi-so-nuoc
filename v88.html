<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ghi số nước V8.8</title></head>
<body style="margin:0;background:#111;color:#fff;font-family:Arial,sans-serif"><div id="boot" style="padding:24px;text-align:center">Đang mở Ghi số nước V8.8...</div>
<script>
(async()=>{
  try{
    const r=await fetch('v83.html?base=stable-v83-88',{cache:'no-store'});
    if(!r.ok)throw new Error('Không tải được nền V8.3');
    let html=await r.text();
    html=html.replaceAll('V8.3','V8.8');
    const patch=String.raw`<script>
// V8.8 PATCH — nền V8.3. Chỉ sửa QR gọn + xác nhận đồng bộ.
function labelFromMeter(meter){
  const m=String(meter||'').trim().toUpperCase();
  let z=m.match(/^(.+?)-(.+?)-N\d+$/i);
  if(z)return z[1]+'.'+z[2];
  z=m.match(/^(.+?)-(.+?)$/i);
  return z?z[1]+'.'+z[2]:m;
}

function parseQR(raw){
  const text=String(raw||'').trim();
  if(!text)return null;
  const f={};
  text.split('|').forEach(p=>{
    const i=p.indexOf('=');
    if(i>0)f[p.slice(0,i).trim().toUpperCase()]=p.slice(i+1).trim();
  });
  let meter=String(f.MADH||f.M||'').trim().toUpperCase();
  let token=String(f.TOKEN||f.T||'').trim();
  if(meter&&token)return{meter,token,label:labelFromMeter(meter)};
  try{
    const u=new URL(text);
    meter=(u.searchParams.get('m')||'').trim().toUpperCase();
    token=(u.searchParams.get('t')||'').trim();
    if(meter&&token)return{meter,token,label:labelFromMeter(meter)};
  }catch(e){}
  const um=text.match(/(?:^|\|)URL=(https?:\/\/[^|\s]+)/i);
  if(um&&um[1]){
    try{
      const u=new URL(um[1]);
      meter=(u.searchParams.get('m')||'').trim().toUpperCase();
      token=(u.searchParams.get('t')||'').trim();
      if(meter&&token)return{meter,token,label:labelFromMeter(meter)};
    }catch(e){}
  }
  return null;
}

function meterForSync88(item){
  let meter=String(item&&item.meter||'').trim().toUpperCase();
  if(!meter)return meter;
  if(!/-N\d+$/i.test(meter))meter+='-N01';
  return meter;
}

function postRecordNoWait(item,imageData){
  const form=document.createElement('form');
  form.method='POST';
  form.action=BACKEND_URL;
  form.target='uploadFrame';
  form.style.display='none';
  const values={
    clientId:item.clientId,
    meter:meterForSync88(item),
    token:item.token,
    staff:item.staff,
    capturedAt:item.capturedAt,
    image:imageData
  };
  Object.keys(values).forEach(k=>{
    const input=document.createElement('textarea');
    input.name=k;
    input.value=values[k]==null?'':String(values[k]);
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  setTimeout(()=>{try{form.remove()}catch(e){}},1200);
}

function checkPublicLogBatch88(clientIds,timeoutMs=4500){
  return new Promise((resolve,reject)=>{
    const ids=(clientIds||[]).map(x=>String(x||'').trim()).filter(Boolean).slice(0,50);
    if(!ids.length){resolve(new Set());return;}
    const cb='waterLog88_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    let done=false;
    const cleanup=()=>{
      try{delete window[cb]}catch(e){}
      if(script.parentNode)script.parentNode.removeChild(script);
    };
    const timer=setTimeout(()=>{
      if(done)return;
      done=true;cleanup();reject(new Error('Nhật ký đồng bộ phản hồi chậm.'));
    },timeoutMs);
    window[cb]=(data)=>{
      if(done)return;
      done=true;clearTimeout(timer);cleanup();
      try{
        if(!data||data.status==='error'||!data.table){
          reject(new Error('Không đọc được Nhật ký đồng bộ.'));return;
        }
        const found=new Set();
        (data.table.rows||[]).forEach(r=>{
          const c=r&&r.c&&r.c[0];
          const v=c&&c.v!=null?String(c.v).trim():'';
          if(v)found.add(v);
        });
        resolve(found);
      }catch(e){reject(e)}
    };
    const safe=id=>id.replace(/'/g,"''");
    const tq='select A where '+ids.map(id=>"A='"+safe(id)+"'").join(' or ');
    script.async=true;
    script.src='https://docs.google.com/spreadsheets/d/1YeXaSA03l3wPntaP_aNKeR_aMrjCnenHtLAiALSwxpY/gviz/tq'
      +'?sheet='+encodeURIComponent('NHAT_KY_DONG_BO')
      +'&headers=1'
      +'&tqx='+encodeURIComponent('responseHandler:'+cb)
      +'&tq='+encodeURIComponent(tq)
      +'&_='+Date.now();
    script.onerror=()=>{
      if(done)return;
      done=true;clearTimeout(timer);cleanup();reject(new Error('Không gọi được Nhật ký đồng bộ.'));
    };
    document.head.appendChild(script);
  });
}

const checkServerBatch83=checkServerBatch;
checkServerBatch=async function(clientIds,timeoutMs=5000){
  try{
    return await checkPublicLogBatch88(clientIds,Math.min(timeoutMs||5000,4500));
  }catch(e){
    return await checkServerBatch83(clientIds,timeoutMs);
  }
};

try{byId('debug').textContent='V8.8 · nền V8.3 · xác nhận trực tiếp từ Nhật ký đồng bộ';}catch(e){}
<\/script>`;
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<b>Không mở được V8.8</b><br><small>'+String(e&&e.message||e)+'</small>';
  }
})();
</script>
</body>
</html>
