<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ghi số nước V8.7</title></head>
<body style="margin:0;background:#111;color:#fff;font-family:Arial,sans-serif"><div id="boot" style="padding:24px;text-align:center">Đang mở Ghi số nước V8.7...</div>
<script>
(async()=>{
  try{
    const r=await fetch('v83.html?base=stable-v83',{cache:'no-store'});
    if(!r.ok)throw new Error('Không tải được nền V8.3');
    let html=await r.text();
    html=html.replaceAll('V8.3','V8.7');

    const patch=String.raw`<script>
// V8.7 PATCH: nền V8.3, chỉ sửa QR gọn + xác nhận đồng bộ.
function parseQR(raw){
  const text=String(raw||'').trim();
  if(!text)return null;
  const f={};
  text.split('|').forEach(p=>{
    const i=p.indexOf('=');
    if(i>0)f[p.slice(0,i).trim().toUpperCase()]=p.slice(i+1).trim();
  });
  let meter=String(f.MADH||f.M||'').trim().toUpperCase();
  let token=String(f.TOKEN||f.T||'').trim();
  if(meter&&token)return{meter,token,label:labelFromMeter(meter)};
  try{
    const u=new URL(text);
    meter=(u.searchParams.get('m')||'').trim().toUpperCase();
    token=(u.searchParams.get('t')||'').trim();
    if(meter&&token)return{meter,token,label:labelFromMeter(meter)};
  }catch(e){}
  const um=text.match(/(?:^|\|)URL=(https?:\/\/[^|\s]+)/i);
  if(um&&um[1]){
    try{
      const u=new URL(um[1]);
      meter=(u.searchParams.get('m')||'').trim().toUpperCase();
      token=(u.searchParams.get('t')||'').trim();
      if(meter&&token)return{meter,token,label:labelFromMeter(meter)};
    }catch(e){}
  }
  return null;
}

function meterForSync87(item){
  let meter=String(item&&item.meter||'').trim().toUpperCase();
  if(!meter)return meter;
  const clientId=String(item&&item.clientId||'').trim().toUpperCase();
  // Cứu QR/bản Chờ V8.5 dạng gọn: token vẫn thuộc mã có -N01.
  if(!/-N\d+$/i.test(meter) && !/-N\d+_/i.test(clientId))meter+='-N01';
  return meter;
}

function postRecordNoWait(item,imageData){
  const form=document.createElement('form');
  form.method='POST';
  form.action=BACKEND_URL;
  form.target='uploadFrame';
  form.style.display='none';
  const values={
    clientId:item.clientId,
    meter:meterForSync87(item),
    token:item.token,
    staff:item.staff,
    capturedAt:item.capturedAt,
    image:imageData
  };
  Object.keys(values).forEach(k=>{
    const input=document.createElement('textarea');
    input.name=k;
    input.value=values[k]==null?'':String(values[k]);
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  setTimeout(()=>{try{form.remove()}catch(e){}},1200);
}

function checkServerOne87(clientId,timeoutMs=3000){
  return new Promise((resolve,reject)=>{
    const id=String(clientId||'').trim();
    if(!id){resolve(false);return;}
    const cb='waterStatus87_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    let done=false;
    const script=document.createElement('script');
    const cleanup=()=>{
      try{delete window[cb]}catch(e){}
      if(script.parentNode)script.parentNode.removeChild(script);
    };
    const timer=setTimeout(()=>{
      if(done)return;
      done=true;cleanup();reject(new Error('status timeout'));
    },timeoutMs);
    window[cb]=(data)=>{
      if(done)return;
      done=true;clearTimeout(timer);cleanup();
      resolve(!!(data&&data.ok===true&&data.synced===true));
    };
    script.async=true;
    script.src=BACKEND_URL+'?api=status&clientId='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
    script.onerror=()=>{
      if(done)return;
      done=true;clearTimeout(timer);cleanup();reject(new Error('status error'));
    };
    document.head.appendChild(script);
  });
}

const checkServerBatch83=checkServerBatch;
checkServerBatch=async function(clientIds,timeoutMs=5000){
  const ids=(clientIds||[]).map(x=>String(x||'').trim()).filter(Boolean).slice(0,50);
  let found=new Set();
  try{
    found=await checkServerBatch83(ids,Math.min(timeoutMs||5000,3000));
  }catch(e){}
  const missing=ids.filter(id=>!found.has(id));
  if(missing.length){
    const results=await Promise.all(missing.slice(0,12).map(async id=>{
      try{return await checkServerOne87(id,2500)?id:''}catch(e){return ''}
    }));
    results.forEach(id=>{if(id)found.add(id)});
  }
  return found;
};

waitClientSyncedFast=async function(clientId,maxMs=10000){
  const started=Date.now();
  while(Date.now()-started<maxMs){
    try{
      const set=await checkServerBatch([clientId],3000);
      if(set.has(clientId))return true;
    }catch(e){}
    await sleep(450);
  }
  return false;
};

try{byId('debug').textContent='V8.7 · đã bật xác nhận đồng bộ kép';}catch(e){}
<\/script>`;

    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<b>Không mở được V8.7</b><br><small>'+String(e&&e.message||e)+'</small>';
  }
})();
</script>
</body>
</html>
