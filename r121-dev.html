<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghi số nước R12.1 DEV</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#msg{padding:24px;font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div id="msg">Đang mở bản R12.1 DEV độc lập…</div>
<script>
(async function(){
  const stamp=Date.now();
  const DEV_BACKEND='https://script.google.com/macros/s/AKfycbzsEfriZTOb76LVncaqMzAEMx5WZCiUW4WMTUooJatZIng4lowL3WlEO5GVO4r1DCk/exec';
  try{
    const res=await fetch('./r9-direct.html?stable='+stamp,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    let html=await res.text();

    // R12.1 DEV lấy lõi PASS hiện tại nhưng mọi phần nâng cấp mới đều tách file riêng.
    // Không sửa các module mà bản STABLE đang gọi.

    // Quan trọng: chèn backend DEV vào bên trong loader con, ngay sau khi loader con
    // tải v87-background. Như vậy mọi upload/staff/progress của R12.1 đi vào backend DEV,
    // còn r9-direct.html và v87-background.html của STABLE không bị sửa.
    const injectAfterFetch = [
      'let html=await res.text();',
      "    html=html.replace(/const BACKEND_URL\\s*=\\s*\\\"[^\\\"]+\\\";/, 'const BACKEND_URL = "+JSON.stringify(DEV_BACKEND)+";');",
      "    html=html.replace('</head>', '<script>window.WATER_R121_BACKEND_URL="+JSON.stringify(DEV_BACKEND)+";<\\/script></head>');"
    ].join('\n');
    html=html.replace('let html=await res.text();',injectAfterFetch);

    // Module tiến độ riêng của DEV: không gọi backend STABLE.
    html=html.replace(
      "'./water-progress-live-r6.js?r9direct='+stamp",
      "'./water-progress-live-r121.js?r121dev='+stamp"
    );

    // Tab dự án + dữ liệu dự án riêng của DEV.
    html=html.replace(
      "'./water-project-tab-r91.js?r9direct='+stamp",
      "'./water-project-tab-r121.js?r121dev='+stamp"
    );
    html=html.replace(
      "'./water-project-sheet-r93.js?r9direct='+stamp",
      "'./water-project-sheet-r121.js?r121dev='+stamp"
    );

    // Nạp LIVE OCR V2 vào chính danh sách module của giao diện con mà r9-direct tạo ra.
    // Không chèn script ở outer loader vì r9-direct sẽ document.write() lại toàn bộ trang.
    html=html.replace(
      "'./water-default-capture-r92.js?r9direct='+stamp",
      "'./water-default-capture-r92.js?r9direct='+stamp,\n      './water-live-ocr-r121-v2.js?r121dev='+stamp"
    );

    // Nhãn build DEV, không phụ thuộc tên build STABLE hiện tại.
    html=html.replace(
      /window\.R119_DIRECT_LOADER='[^']+';/,
      "window.R119_DIRECT_LOADER='R12.1_DEV_ISOLATED_BACKEND_LIVE_OCR_V2';"
    );
    html=html.replace(
      /<title>Ghi số nước[^<]*<\/title>/,
      '<title>Ghi số nước R12.1 DEV - LIVE OCR V2</title>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('msg').textContent='Không mở được R12.1 DEV: '+String(err&&err.message||err);
  }
})();
</script>
</body>
</html>
