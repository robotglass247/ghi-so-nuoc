<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Khôi phục Offline Ghi số nước</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#msg{padding:24px;font-size:17px;line-height:1.55}
.small{display:block;margin-top:12px;font-size:13px;color:#bbb}
</style>
</head>
<body>
<div id="msg">Đang kiểm tra Internet…</div>
<script>
(async()=>{
  const BUILD='879-recover1';
  const SW='./water-offline-sw-ui3.js?v='+BUILD;
  const msg=document.getElementById('msg');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  async function hasRealInternet(){
    if(!navigator.onLine)return false;
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),5000);
    try{
      const r=await fetch('./net-check.txt?t='+Date.now(),{cache:'no-store',signal:ctl.signal});
      return !!(r&&r.ok);
    }catch(e){
      return false;
    }finally{
      clearTimeout(timer);
    }
  }

  function getStatus(worker){
    return new Promise(resolve=>{
      try{
        const ch=new MessageChannel();
        const timer=setTimeout(()=>resolve(null),1200);
        ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
        worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);
      }catch(e){resolve(null);}
    });
  }

  try{
    if(!('serviceWorker' in navigator))throw new Error('Trình duyệt không hỗ trợ Service Worker');

    const internet=await hasRealInternet();
    if(!internet){
      msg.innerHTML='Chưa có Internet thật.<br>Giữ nguyên dữ liệu ảnh trên máy.';
      return;
    }

    msg.innerHTML='Đang khôi phục bản Offline ổn định…<br>Vui lòng chờ.';

    // Không xóa IndexedDB/localStorage. Chỉ cập nhật Service Worker về recover1.
    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}

    const started=Date.now();
    let ready=false;
    let lastStatus=null;
    let installState='';

    while(Date.now()-started<30000){
      if(reg.installing)installState=reg.installing.state||installState;
      if(reg.waiting){
        installState=reg.waiting.state||installState;
        try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}
      }

      const candidates=[reg.active,reg.waiting,reg.installing,navigator.serviceWorker.controller].filter(Boolean);
      for(const worker of candidates){
        if(worker.state&&worker.state!=='activated')continue;
        const st=await getStatus(worker);
        if(st)lastStatus=st;
        if(st&&st.ready===true&&st.build===BUILD){
          ready=true;
          break;
        }
      }
      if(ready)break;
      await wait(300);
    }

    if(!ready){
      const detail=lastStatus
        ? 'Đang có worker '+String(lastStatus.build||'?')+' · ready='+String(!!lastStatus.ready)
        : 'Worker chưa hoàn tất'+(installState?' ('+installState+')':'');
      throw new Error(detail);
    }

    msg.innerHTML='✓ ĐÃ KHÔI PHỤC OFFLINE<br>Đang mở ứng dụng…';
    await wait(700);
    location.replace('./app.html?ready='+BUILD+'&t='+Date.now());
  }catch(err){
    const detail=String(err&&err.message||err||'Không rõ lỗi');
    msg.innerHTML='Chưa khôi phục được Offline.<span class="small">'+detail.replace(/[<>]/g,'')+'</span>';
    console.error(err);
  }
})();
</script>
</body>
</html>
