<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Khôi phục Ghi số nước</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#msg{padding:24px;font-size:17px;line-height:1.55}
</style>
</head>
<body>
<div id="msg">Đang cài bản Offline mới…<br>Vui lòng giữ Internet.</div>
<script>
(async()=>{
  const BUILD='879-stable1';
  const msg=document.getElementById('msg');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  function getStatus(worker){
    return new Promise(resolve=>{
      try{
        const ch=new MessageChannel();
        const timer=setTimeout(()=>resolve(null),1800);
        ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
        worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);
      }catch(e){resolve(null);}
    });
  }

  try{
    if(!navigator.onLine)throw new Error('Cần Internet để cài bản Offline');
    if(!('serviceWorker' in navigator))throw new Error('Trình duyệt không hỗ trợ Service Worker');

    // Gỡ mọi worker/cache cũ của riêng ứng dụng.
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const reg of regs){
      try{
        if(String(reg.scope||'').includes('/ghi-so-nuoc/'))await reg.unregister();
      }catch(e){}
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const key of keys){
        if(String(key).startsWith('water-')){
          try{await caches.delete(key);}catch(e){}
        }
      }
    }

    msg.innerHTML='Đang lưu ứng dụng để dùng Offline…<br>Vui lòng chờ.';

    const reg=await navigator.serviceWorker.register('./water-offline-sw-ui3.js?v='+BUILD+'&t='+Date.now(),{
      scope:'./',
      updateViaCache:'none'
    });

    const started=Date.now();
    let ready=false;
    while(Date.now()-started<20000){
      if(reg.waiting){try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}}
      const worker=reg.active||reg.waiting||reg.installing;
      if(worker && worker.state==='activated'){
        const st=await getStatus(worker);
        if(st && st.ready===true && st.build===BUILD){
          ready=true;
          break;
        }
      }
      await wait(300);
    }

    if(!ready)throw new Error('Bản Offline chưa lưu đủ');

    msg.innerHTML='✓ ĐÃ SẴN SÀNG LÀM VIỆC OFFLINE<br>Đang mở ứng dụng…';
    await wait(900);
    location.replace('./app.html?ready='+BUILD+'&t='+Date.now());
  }catch(err){
    msg.innerHTML='Chưa cài được bản Offline.<br>Giữ Internet và tải lại trang này.';
    console.error(err);
  }
})();
</script>
</body>
</html>
