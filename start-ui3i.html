<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Khôi phục Ghi số nước</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#msg{padding:24px;font-size:17px;line-height:1.55}
</style>
</head>
<body>
<div id="msg">Đang làm sạch bản cũ…<br>Vui lòng chờ vài giây.</div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        try{
          if(String(reg.scope||'').includes('/ghi-so-nuoc/'))await reg.unregister();
        }catch(e){}
      }
    }

    if('caches' in window){
      const keys=await caches.keys();
      for(const key of keys){
        if(String(key).startsWith('water-')){
          try{await caches.delete(key);}catch(e){}
        }
      }
    }

    msg.innerHTML='✓ Đã xóa bản cũ.<br>Đang mở ứng dụng mới…';
    setTimeout(()=>location.replace('./app.html?fresh=879-stable1&t='+Date.now()),500);
  }catch(err){
    msg.innerHTML='Chưa làm sạch được bản cũ.<br>Hãy tải lại trang này khi có Internet.';
    console.error(err);
  }
})();
</script>
</body>
</html>
