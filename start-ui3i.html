<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Cập nhật Ghi số nước</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#msg{padding:24px;font-size:17px;line-height:1.55}
</style>
</head>
<body>
<div id="msg">Đang cập nhật bản Offline mới…<br>Vui lòng chờ vài giây.</div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  const BUILD='878-ui3j';
  const FORCE='878-ui3j-force-20260911';
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const swUrl=new URL('./water-offline-sw-ui3.js?v='+FORCE,location.href).href;

  function getStatus(worker){
    return new Promise(resolve=>{
      try{
        const ch=new MessageChannel();
        const timer=setTimeout(()=>resolve(null),2500);
        ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
        worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);
      }catch(e){resolve(null);}
    });
  }

  try{
    if(!('serviceWorker' in navigator))throw new Error('Trình duyệt không hỗ trợ Service Worker');

    const reg=await navigator.serviceWorker.register('./water-offline-sw-ui3.js?v='+FORCE,{
      scope:'./',
      updateViaCache:'none'
    });
    try{await reg.update();}catch(e){}

    const started=Date.now();
    let ready=false;
    while(Date.now()-started<18000){
      if(reg.waiting){try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){}}
      const active=reg.active;
      if(active && active.state==='activated' && active.scriptURL===swUrl){
        const st=await getStatus(active);
        if(st && st.ready===true && st.build===BUILD){ready=true;break;}
      }
      await wait(350);
      try{await reg.update();}catch(e){}
    }

    if(!ready)throw new Error('UI3J chưa kích hoạt/cache đủ');

    msg.innerHTML='✓ Đã cập nhật bản Offline mới.<br>Đang mở ứng dụng…';
    await wait(500);
    location.replace('./app.html?v=ui3j-ready-'+Date.now());
  }catch(err){
    msg.innerHTML='Chưa cập nhật được bản Offline mới.<br>Giữ Internet và tải lại trang này.';
    console.error(err);
  }
})();
</script>
</body>
</html>
