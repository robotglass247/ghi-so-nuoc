<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5f8f">
<title>Quản lý ghi chỉ số nước V20 R6</title>
</head>
<body>
<div id="boot" style="font:14px 'Segoe UI',Tahoma,Arial,sans-serif;padding:24px;color:#425466">Đang tải Trang Quản lý/BQL R6...</div>
<script>
(async function(){
  const OLD='https://script.google.com/macros/s/AKfycbynFiXNX8wfYunObyMQ2Jp3PbOGhhaqBUfbZuHoNSazmnTiE_kNplRcUXTkOaqqTkxk/exec';
  const STABLE='https://script.google.com/macros/s/AKfycbyGukOADD3lJlR8amVhF3Slw-TLkAJmK77h5zv96wq3M1Z3yRGHIrRQnmS0SyjhGVoGcg/exec';
  try{
    let html=await fetch('./quan-ly-v20-r3.html?src=r6-4-project-name',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
    html=html.split(OLD).join(STABLE);
    html=html.replace('water-auth-bql-v20.js?v=r3-1','water-auth-bql-v20.js?v=b52becd177946d6930c2b5e7716ac34e6f60c0df');
    html=html.replace(/Trang Quản lý\/BQL V20 R3/g,'Trang Quản lý/BQL V20');
    html=html.replace(/Quản lý\/BQL V20 R3/g,'Quản lý/BQL V20');

    const patch='<style id="bqlR63Patch">'+
      '.top{padding:12px 22px 0!important}'+
      '.badge{display:none!important}'+
      '.bqlHeaderRight{gap:0!important}'+
      '.bqlDetailBox{padding-top:0!important;overflow:hidden!important}'+
      '.bqlDetailBox .box h3{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-height:44px!important;margin:0 0 14px!important;padding:10px 16px!important;background:#eaf5fb!important;border:1px solid #c8dce8!important;border-top:0!important;border-radius:0 0 8px 8px!important;color:#173d59!important;font-size:clamp(16px,1.12vw,18px)!important;font-weight:900!important;line-height:1.2!important}'+
      '.bqlDetailBox .f label{font-size:clamp(12px,.86vw,13px)!important;font-weight:800!important;margin-bottom:6px!important}'+
      '.bqlDetailBox .f select,.bqlDetailBox .f input{font-size:clamp(12px,.86vw,13px)!important;padding:10px 9px!important}'+
      '@media(max-width:760px){.top{padding:7px 7px 0!important}.bqlDetailBox .box h3{min-height:40px!important;font-size:14px!important;padding:9px 10px!important}.bqlDetailBox .f label{font-size:12px!important}}'+
      '</style>'+
      '<scr'+'ipt>(function(){'+
        'function clean(){'+
          'var b=document.getElementById("badge");if(b&&b.parentNode)b.parentNode.removeChild(b);'+
          'var s=document.getElementById("subTitle");if(s){var t=String(s.textContent||"").replace(/\\s*•\\s*BQL V20(?:\\s*R3)?/ig,"").replace(/^Dự án\\s+/i,"").trim();if(s.textContent!==t)s.textContent=t;}'+
        '}'+
        'function watch(){clean();var s=document.getElementById("subTitle");if(s)new MutationObserver(clean).observe(s,{childList:true,subtree:true,characterData:true});setTimeout(clean,800);setTimeout(clean,2200);}'+
        'if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",watch,{once:true});else watch();'+
      '})();</scr'+'ipt>';
    html=html.replace('</body>',patch+'</body>');

    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').textContent='Không tải được Trang Quản lý/BQL R6: '+(e&&e.message?e.message:e);
  }
})();
</script>
</body>
</html>
