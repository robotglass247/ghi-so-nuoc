<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Khôi phục fast6</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
#msg{padding:24px;font-size:17px;line-height:1.55}
.small{display:block;margin-top:10px;font-size:13px;color:#bbb}
</style>
</head>
<body>
<div id="msg">Đang khôi phục bản fast6…</div>
<script>
(async()=>{
  const BUILD='878-fast6';
  const SW='./water-offline-sw.js?restore='+BUILD;
  const msg=document.getElementById('msg');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  async function realInternet(){
    if(!navigator.onLine)return false;
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),5000);
    try{
      const r=await fetch('./v87-background.html?probe='+Date.now(),{cache:'no-store',signal:ctl.signal});
      return !!(r&&r.ok);
    }catch(e){return false;}
    finally{clearTimeout(timer);}
  }

  function statusOf(worker){
    return new Promise(resolve=>{
      try{
        const ch=new MessageChannel();
        const timer=setTimeout(()=>resolve(null),1200);
        ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null);};
        worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);
      }catch(e){resolve(null);}
    });
  }

  try{
    if(!('serviceWorker' in navigator))throw new Error('Trình duyệt không hỗ trợ Service Worker');
    if(!(await realInternet()))throw new Error('Cần Internet ổn định để khôi phục fast6');

    msg.innerHTML='Đang gỡ controller giao diện mới…<br>Không xóa ảnh đang Chờ.';

    // Gỡ registration cũ nhưng GIỮ cache tạm thời để fast6 có thể tái dùng jsQR.
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const reg of regs){
      if(String(reg.scope||'').includes('/ghi-so-nuoc/')){
        try{await reg.unregister();}catch(e){}
      }
    }

    msg.innerHTML='Đang cài lại fast6…<br>Vui lòng chờ.';
    const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
    try{await reg.update();}catch(e){}

    let ready=false;
    let lastState='';
    const started=Date.now();
    while(Date.now()-started<25000){
      if(reg.installing)lastState=reg.installing.state||lastState;
      if(reg.waiting)lastState=reg.waiting.state||lastState;
      if(reg.active)lastState=reg.active.state||lastState;

      const worker=reg.active||navigator.serviceWorker.controller;
      if(worker&&worker.state==='activated'){
        const st=await statusOf(worker);
        if(st&&st.ready===true&&st.build===BUILD){ready=true;break;}
      }
      await wait(300);
    }

    if(!ready)throw new Error('fast6 chưa sẵn sàng'+(lastState?' ('+lastState+')':''));

    // Chỉ sau khi fast6 đã READY mới dọn cache giao diện/UI3 cũ.
    if('caches' in window){
      const keys=await caches.keys();
      for(const key of keys){
        if(String(key).startsWith('water-')&&key!=='water-v878-offline-fast6'){
          try{await caches.delete(key);}catch(e){}
        }
      }
    }

    msg.innerHTML='✓ FAST6 ĐÃ SẴN SÀNG<br>Đang mở ứng dụng…';
    await wait(800);
    location.replace('./v87-background.html?build='+BUILD+'&t='+Date.now());
  }catch(err){
    const detail=String(err&&err.message||err||'Không rõ lỗi').replace(/[<>]/g,'');
    msg.innerHTML='Chưa khôi phục được fast6.<span class="small">'+detail+'</span>';
    console.error(err);
  }
})();
</script>
</body>
</html>
