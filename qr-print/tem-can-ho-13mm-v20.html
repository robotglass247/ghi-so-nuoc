<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IN TEM QR NƯỚC V20</title><style>*{box-sizing:border-box}body{font:15px Arial,sans-serif;background:#f2f5f9;padding:16px}.sheet{background:white;max-width:480px;margin:auto;padding:20px;border-radius:12px;text-align:center}#qr{display:block;width:300px;height:300px;margin:0 auto}#unit{font:900 36px/1 Arial,sans-serif;margin:10px auto 0;white-space:nowrap}button{padding:12px 22px;background:#23679d;color:white;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.err{color:#b42318}@media print{@page{margin:0}body{margin:0;padding:0;background:white}.sheet{border:0;border-radius:0;padding:0;max-width:none;width:22mm;margin:0 auto}#qr{width:13mm;height:13mm;margin:0 auto}#unit{width:22mm;font:900 18pt/1 Arial,sans-serif;margin:.5mm auto 0;white-space:nowrap}button,p,h3{display:none}}</style></head><body><div class="sheet"><h3>Tem QR ghi số nước V20</h3><img id="qr" alt="Mã QR"/><div id="unit"></div><p id="status">Bản in 13 mm; chữ căn hộ 18 pt</p><button onclick="window.print()">IN TEM QR</button></div><script>(function(){const q=new URLSearchParams(location.search),payload=q.get('payload')||'',unit=(q.get('unit')||'').trim().toUpperCase();const validPayload=/^WATERQR\|V=5\|PROJECT=[A-Z0-9_-]+\|MADH=[A-Z0-9_-]+\|TOKEN=[A-Za-z0-9_-]+$/.test(payload);const validUnit=/^[A-Z0-9.\-]{1,20}$/.test(unit);if(!validPayload||!validUnit){document.getElementById('status').textContent='Dữ liệu QR hoặc mã căn hộ không hợp lệ.';document.getElementById('status').className='err';return;}document.getElementById('unit').textContent=unit;document.getElementById('qr').src='https://quickchart.io/qr?size=500&margin=4&ecLevel=H&text='+encodeURIComponent(payload);})();</script></body></html>
