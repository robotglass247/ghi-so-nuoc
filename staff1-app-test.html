<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAFF1 App Test</title>
<style>body{font-family:Arial,sans-serif;padding:24px;line-height:1.5}#s{font-size:18px;font-weight:700}.small{font-size:13px;color:#555;margin-top:10px}</style>
</head>
<body>
<div id="s">Đang mở bản STAFF1 PENDING…</div>
<div class="small">Không sửa FAST6/SPEED3 Stable. Chỉ thay lớp tải nhân sự bằng POST uistate.</div>
<script>
(async()=>{
  const s=document.getElementById('s');
  try{
    const r=await fetch('./v87-background.html?staff1='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Không tải được FAST6 Stable');
    let h=await r.text();

    // Dấu nhận diện candidate, không đổi lõi chức năng.
    h=h.replace(/<meta name="water-build" content="[^"]*">/,
      '<meta name="water-build" content="878-fast6-staff1-pending">');

    // Cache nhân sự riêng để test không làm bẩn cache Stable.
    h=h.replace(/const STAFF_CACHE_KEY='water_staff_list_v\d+';/,
      "const STAFF_CACHE_KEY='water_staff_list_staff1_pending';");

    // Fallback đủ 8 người chỉ để Offline; PASS Online vẫn phải đến từ POST.
    h=h.replace(/const STAFF_FALLBACK=\[[\s\S]*?\n\];/,
      "const STAFF_FALLBACK=[\n"+
      "  {ma:'NS001',ten:'Nguyễn Văn Sĩ'},\n"+
      "  {ma:'NS002',ten:'Trần Văn Long'},\n"+
      "  {ma:'NS003',ten:'Nguyễn Ngọc Hóa'},\n"+
      "  {ma:'NS004',ten:'Vũ Văn Tùng'},\n"+
      "  {ma:'NS005',ten:'Minh Trang'},\n"+
      "  {ma:'NS006',ten:'Trần Tuấn Anh'},\n"+
      "  {ma:'NS007',ten:'Hoàng Long'},\n"+
      "  {ma:'NS008',ten:'Hoàng Văn Trần'}\n"+
      "];"
    );

    // Form POST cần target theo name.
    h=h.replace('<iframe id="staffFrame" title="staff"></iframe>',
      '<iframe name="staffFrame" id="staffFrame" title="staff"></iframe>');

    // Biến theo dõi request POST nhân sự.
    h=h.replace('let staffLoadTimer=null;',
      'let staffLoadTimer=null;\nlet staffUiRequestId="";');

    // POST uistate là nguồn động hợp lệ và được cache riêng.
    h=h.replace("if(source==='JSONP'||source==='Google iframe'){
",
      "if(source==='POST uistate'){
");

    // Nhận WATER_UI_STATE trước nhánh ACK upload cũ.
    h=h.replace(
      "window.addEventListener('message',event=>{\n  const d=event.data;\n  if(d&&d.type==='WATER_STAFF_LIST'){\n    setStaffList(d.staff,'Google iframe');\n    return;\n  }",
      "window.addEventListener('message',event=>{\n  const d=event.data;\n  if(d&&d.type==='WATER_UI_STATE'){\n    if(String(d.requestId||'')===String(staffUiRequestId||'') && Array.isArray(d.staff) && d.staff.length){\n      setStaffList(d.staff,'POST uistate');\n    }\n    return;\n  }\n  if(d&&d.type==='WATER_STAFF_LIST'){ return; }"
    );

    // Thay riêng hàm loadStaff; không chạm camera, QR, IndexedDB hay syncQueue.
    h=h.replace(/function loadStaff\(force\)\{[\s\S]*?\n\}\n\nfunction renderStaff/,
      `function loadStaff(force){
  if(!staffList.length)loadLocalStaffFirst();

  if(force){
    byId('debug').textContent='Đang cập nhật nhân sự bằng POST uistate...';
    byId('reloadStaffBtn').style.display='none';
  }

  if(!navigator.onLine){
    byId('debug').textContent='OFFLINE · dùng danh sách nhân sự đã lưu trên máy.';
    return;
  }

  staffUiRequestId='staff1_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);

  const now=new Date();
  const period=String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear();
  const form=document.createElement('form');
  form.method='POST';
  form.action=BACKEND_URL;
  form.target='staffFrame';
  form.style.display='none';

  const values={api:'uistate',period,requestId:staffUiRequestId};
  Object.keys(values).forEach(k=>{
    const input=document.createElement('input');
    input.type='hidden'; input.name=k; input.value=values[k];
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  setTimeout(()=>{try{form.remove()}catch(e){}},60000);

  clearTimeout(staffLoadTimer);
  staffLoadTimer=setTimeout(()=>{
    renderStaff();
    updateStaffName();
    byId('staffSelect').style.display='block';
    if(staffList.length){
      byId('debug').textContent='Nhân sự đang dùng cache/dự phòng; POST chưa phản hồi ở lượt này.';
    }else{
      setStaffList(STAFF_FALLBACK,'Dự phòng');
    }
  },15000);
}

function renderStaff`
    );

    if(!h.includes("POST uistate") || !h.includes("staffUiRequestId='staff1_")){
      throw new Error('Patch STAFF1 chưa áp dụng đủ');
    }

    document.open();
    document.write(h);
    document.close();
  }catch(err){
    s.textContent='Không mở được STAFF1 PENDING: '+String(err&&err.message||err);
  }
})();
</script>
</body>
</html>
