<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cập nhật MAIN907</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;text-align:center}.box{padding:24px;max-width:440px}#msg{font-size:17px;line-height:1.5}</style></head><body><div class="box"><div id="msg">Đang cập nhật MAIN907…</div></div><script>
(async()=>{
 const BUILD='879-main907';
 const SW='./water-offline-sw-ui3.js?v='+BUILD;
 const msg=document.getElementById('msg');
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const go=()=>location.replace('./app.html?build='+BUILD+'&t='+Date.now());
 function status(worker){return new Promise(resolve=>{if(!worker){resolve(null);return;}try{const ch=new MessageChannel();const timer=setTimeout(()=>resolve(null),900);ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||null)};worker.postMessage('WATER_OFFLINE_STATUS',[ch.port2]);}catch(e){resolve(null)}})}
 try{
  if(!navigator.onLine){msg.textContent='Hãy bật mạng để cập nhật MAIN907. Không xóa cache hay dữ liệu.';return;}
  if(!('serviceWorker' in navigator)){go();return;}
  const reg=await navigator.serviceWorker.register(SW,{scope:'./',updateViaCache:'none'});
  try{await reg.update()}catch(e){}
  const started=Date.now();
  while(Date.now()-started<20000){
   if(reg.waiting){try{reg.waiting.postMessage('SKIP_WAITING')}catch(e){}}
   const st=await status(navigator.serviceWorker.controller);
   if(st&&st.ready===true&&st.build===BUILD){msg.textContent='✓ MAIN907 đã sẵn sàng Offline. Đang mở ứng dụng…';await wait(300);go();return;}
   await wait(250);
  }
  msg.textContent='Chrome chưa chuyển sang MAIN907. Đóng tab rồi mở lại link cập nhật khi có mạng. Không xóa dữ liệu.';
 }catch(e){msg.textContent='Chưa cập nhật được MAIN907. Giữ nguyên dữ liệu, kiểm tra mạng rồi mở lại link này.';}
})();
</script></body></html>
